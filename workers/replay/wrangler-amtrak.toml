# Amtrak + VIA sampler (every 60 s). Deploy: npx wrangler deploy -c workers/replay/wrangler-amtrak.toml
name = "railroadradar-replay-amtrak"
main = "railroadradar-replay.js"
compatibility_date = "2026-10-01"
workers_dev = false

[vars]
ROLE = "amtrak"

[triggers]
crons = ["* * * * *"]

# Feeds come from railroadradar-proxy (unchanged) through a service binding.
[[services]]
binding = "PROXY"
service = "railroadradar-proxy"

[[d1_databases]]
binding = "DB"
database_name = "railroadradar-history"
database_id = "155b2e51-b59a-481f-8d07-8491b8fca7bb"
migrations_dir = "migrations"
migrations_table = "replay_migrations"

[observability]
enabled = true
