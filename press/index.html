<style>

.wrap{max-width:860px;margin:0 auto;padding:84px 16px 48px}

.share-btn{width:36px;height:36px;padding:0;border:0;background:transparent;cursor:pointer}.share-btn img{width:36px;height:36px;display:block}
.back{color:#fff;font-weight:700;text-decoration:none}

.a11y-btn img{width:36px;height:36px;display:block}
.reader-panel{display:none;position:absolute;top:42px;left:0;background:#0c1448;border:1px solid #1a3a5f;padding:10px;z-index:8;min-width:230px;flex-wrap:wrap;gap:8px}
.reader-panel.open{display:flex}

label{display:block;font-size:12px;font-weight:700;color:#fff;margin:10px 0 4px}

input[type=text],textarea{width:100%;padding:10px;border:1px solid #c5cad3;font:14px inherit;background:#fff;color:#1a1a2e}

<script>
const CFG={apiKey:"AIzaSyBCXgIwkKHBrNfs4-0T0L9LQNb6GP-37Qs",authDomain:"railroadradar-accounts.firebaseapp.com",projectId:"railroadradar-accounts",storageBucket:"railroadradar-accounts.firebasestorage.app",messagingSenderId:"896370923309",appId:"1:896370923309:web:594b0a20d3b1c6822e65a4"};
const BOOT=['turokerr@gmail.com','railroadradar@gmail.com'];
const A11Y_ICON='https://railroadradar.com/assets/icons/accessibility.png';
const SHARE_ICON='https://railroadradar.com/assets/icons/share.png';
let auth,db,storage,user=null,perms=null,speaking=false;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
const email=e=>String(e||'').trim().toLowerCase();
const boot=e=>BOOT.indexOf(email(e))!==-1;
const isAdmin=u=>!!u&&(boot(u.email)||(perms&&(perms.viewReports||perms.banUsers||perms.manageAdmins||perms.deleteReports)));
function slugify(t){const s=String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,72);return s||('release-'+Date.now().toString(36));}
function idFromLoc(){const q=new URLSearchParams(location.search);if(q.get('id'))return q.get('id').trim();const m=location.pathname.match(/^\/press\/([^\/]+)\/?$/);return (m&&m[1]&&m[1]!=='index.html')?decodeURIComponent(m[1]):'';}
function urlOf(s){return 'https://railroadradar.com/press/index.html?id='+encodeURIComponent(s);}
async function notifyDiscord(a){
  try{
    const hook='https://discord.com/api/webhooks/1550613722161086534/0zz4C0rPGbrpDphlGcmFkRpMig27IuZX0cS-n_sw5wnZw8SjRKNoRDUbean4O1DtkJqw';
    const raw=String(a.body||'').trim();
    const title=String(a.title||'Press release').slice(0,256);
    const chunks=[];
    for(let i=0;i<raw.length && chunks.length<10;i+=4096)chunks.push(raw.slice(i,i+4096));
    if(!chunks.length)chunks.push('');
    const img=a.images&&a.images[0]&&a.images[0].url;
    const embeds=chunks.map((desc,i)=>({
      title:i? (title+' (cont.)').slice(0,256):title,
      url:urlOf(a.slug),
      description:desc.slice(0,4096),
      color:706304,
      footer:{text:'RailroadRadar Press'},
      timestamp:new Date().toISOString()
    }));
    if(img)embeds[0].image={url:img};
    await fetch(hook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'RailroadRadar',embeds})});
  }catch(e){}
}

function when(ts){try{const d=ts&&ts.toDate?ts.toDate():(ts?new Date(ts):null);return(!d||isNaN(d))? '':d.toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'});}catch(e){return '';}}
function readerState(){try{return JSON.parse(localStorage.getItem('rrPressReader')||'{}');}catch(e){return {};}}
function saveReader(st){try{localStorage.setItem('rrPressReader',JSON.stringify(st));}catch(e){}}
function applyReader(){
  const art=document.querySelector('.article');
  if(!art)return;
  const st=Object.assign({size:2,spaced:false,plain:false},readerState());
  if(st.size<1)st.size=1;if(st.size>4)st.size=4;
  art.classList.remove('size-1','size-2','size-3','size-4');
  art.classList.add('size-'+st.size);
  art.classList.toggle('spaced',!!st.spaced);
  art.classList.toggle('plain',!!st.plain);
  const s=document.getElementById('r-space'); if(s)s.setAttribute('aria-pressed',st.spaced?'true':'false');
  const p=document.getElementById('r-plain'); if(p)p.setAttribute('aria-pressed',st.plain?'true':'false');
  const speak=document.getElementById('r-speak'); if(speak)speak.setAttribute('aria-pressed',speaking?'true':'false');
}
function bindReader(title,body){
  const st=()=>Object.assign({size:2,spaced:false,plain:false},readerState());
  const toggle=document.getElementById('a11y');
  const panel=document.getElementById('reader-panel');
  if(toggle&&panel){
    toggle.onclick=e=>{e.stopPropagation();const open=!panel.classList.contains('open');panel.classList.toggle('open',open);toggle.setAttribute('aria-expanded',open?'true':'false');};
    document.addEventListener('click',e=>{
      if(!panel.classList.contains('open'))return;
      if(panel.contains(e.target)||toggle.contains(e.target))return;
      panel.classList.remove('open');toggle.setAttribute('aria-expanded','false');
    });
  }
  const down=document.getElementById('r-down');
  const up=document.getElementById('r-up');
  const space=document.getElementById('r-space');
  const plain=document.getElementById('r-plain');
  const speak=document.getElementById('r-speak');
  if(down)down.onclick=()=>{const n=st();n.size=Math.max(1,(n.size||2)-1);saveReader(n);applyReader();};
  if(up)up.onclick=()=>{const n=st();n.size=Math.min(4,(n.size||2)+1);saveReader(n);applyReader();};
  if(space)space.onclick=()=>{const n=st();n.spaced=!n.spaced;saveReader(n);applyReader();};
  if(plain)plain.onclick=()=>{const n=st();n.plain=!n.plain;saveReader(n);applyReader();};
  if(speak){
    if(!window.speechSynthesis){speak.style.display='none';}
    else speak.onclick=()=>{
      if(speaking){window.speechSynthesis.cancel();speaking=false;applyReader();return;}
      const u=new SpeechSynthesisUtterance((title||'')+'. '+(body||''));
      u.rate=0.95;
      u.onend=()=>{speaking=false;applyReader();};
      u.onerror=()=>{speaking=false;applyReader();};
      speaking=true;applyReader();window.speechSynthesis.cancel();window.speechSynthesis.speak(u);
    };
  }
  applyReader();
}
async function refreshAdmin(u){perms=null;if(!u)return;if(boot(u.email)){perms={viewReports:1,banUsers:1,manageAdmins:1,deleteReports:1};return;}try{const snap=await db.collection('admins').doc(email(u.email)).get();if(!snap.exists)return;const p=(snap.data()||{}).perms||{};perms={viewReports:!!p.viewReports,banUsers:!!p.banUsers,manageAdmins:!!p.manageAdmins,deleteReports:!!p.deleteReports};}catch(e){}}
function header(){
  document.getElementById('in').style.display=user?'none':'';
  document.getElementById('user').style.display=user?'flex':'none';
  document.getElementById('acct-menu').classList.remove('open');
  document.getElementById('pfp').setAttribute('aria-expanded','false');
  if(!user)return;
  const av=document.getElementById('av');
  const fb=document.getElementById('avfb');
  if(user.photoURL){av.style.display='block';av.src=user.photoURL;av.alt='Account';fb.style.display='none';}
  else {
    av.style.display='none';av.removeAttribute('src');
    fb.style.display='flex';
    const label=user.displayName||user.email||'A';
    fb.textContent=String(label).trim().charAt(0).toUpperCase()||'A';
  }
}
function form(p){p=p||{};return `<div class="card form-card" id="c"><h2 style="color:#07093e;font-size:16px">${p.slug?'Edit release':'New press release'}</h2><div class="err" id="ce"></div>
<label>Title</label><input id="t" type="text" maxlength="160" value="${esc(p.title||'')}">
<label>Images</label><input id="f" type="file" accept="image/*" multiple>
<label>Or image URLs (one per line)</label><textarea id="u" style="min-height:70px">${esc((p.images||[]).map(x=>x.url).join('\n'))}</textarea>
<label>Body</label><textarea id="b">${esc(p.body||'')}</textarea>
<label style="display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px"><input id="k" type="checkbox"${p.commentsEnabled?' checked':''}> Allow comments</label>
<p><button class="btn" id="pub">${p.slug?'Save':'Publish'}</button> <button class="btn sec" id="can">Cancel</button></p></div>`;}
async function ups(slug,files){const out=[];if(!files||!files.length)return out;if(!storage)throw new Error('Uploads unavailable');for(let i=0;i<files.length;i++){const f=files[i];if(!f||!/^image\//.test(f.type||''))continue;if(f.size>8*1024*1024)throw new Error('Images must be under 8 MB');const path='press/'+slug+'/'+Date.now()+'-'+i+'-'+String(f.name||'img').replace(/[^\w.-]+/g,'_');await storage.ref().child(path).put(f,{contentType:f.type});out.push({url:await storage.ref().child(path).getDownloadURL(),name:f.name||''});}return out;}
async function save(slug0){const title=document.getElementById('t').value.trim(),body=document.getElementById('b').value.trim();if(!title||!body){document.getElementById('ce').textContent='Title and body are required.';document.getElementById('ce').className='err on';return;}
let slug=slug0||slugify(title);if(!slug0){const ex=await db.collection('pressReleases').doc(slug).get();if(ex.exists)slug+='-'+Date.now().toString(36);}
try{let images=document.getElementById('u').value.split('\n').map(s=>s.trim()).filter(Boolean).map(url=>({url,name:''}));images=images.concat(await ups(slug,document.getElementById('f').files));
const payload={slug,title,body,images,commentsEnabled:!!document.getElementById('k').checked,published:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),authorUid:user.uid,authorEmail:user.email||'',authorName:user.displayName||user.email||'RailroadRadar'};
if(!slug0)payload.createdAt=firebase.firestore.FieldValue.serverTimestamp();
await db.collection('pressReleases').doc(slug).set(payload,{merge:true});if(!slug0)await notifyDiscord({title,body,slug,images});location.href='/press/index.html?id='+encodeURIComponent(slug);
}catch(err){document.getElementById('ce').textContent=err.message||'Publish failed. Add Firestore/Storage rules for pressReleases.';document.getElementById('ce').className='err on';}}
async function list(){const app=document.getElementById('app');app.innerHTML=`<h1>Press Releases</h1><p class="lede">Official news and announcements from RailroadRadar.</p>${isAdmin(user)?'<p><button class="btn" id="nw">New article</button></p>':''}<div id="slot"></div><div id="list" class="empty">Loading…</div>`;
const nw=document.getElementById('nw');if(nw)nw.onclick=()=>{document.getElementById('slot').innerHTML=form();document.getElementById('pub').onclick=()=>save(null);document.getElementById('can').onclick=()=>document.getElementById('slot').innerHTML='';};
try{const snap=await db.collection('pressReleases').orderBy('createdAt','desc').limit(50).get();if(snap.empty){document.getElementById('list').textContent='No press releases yet.';return;}
document.getElementById('list').innerHTML=snap.docs.map(doc=>{const a=doc.data()||{},s=a.slug||doc.id,img=a.images&&a.images[0]&&a.images[0].url;return `<article class="card">${img?`<img class="thumb" src="${esc(img)}" alt="${esc(a.title||'Press image')}">`:''}<a class="t" href="/press/index.html?id=${encodeURIComponent(s)}">${esc(a.title||s)}</a><div class="meta">${esc(when(a.createdAt)||'Recently')}</div><div>${esc(String(a.body||'').slice(0,220))}${String(a.body||'').length>220?'…':''}</div></article>`;}).join('');
}catch(e){document.getElementById('list').textContent='Could not load releases. Add Firestore rules for pressReleases.';}}
async function comments(slug){const box=document.getElementById('clist');if(!box)return;const snap=await db.collection('pressReleases').doc(slug).collection('comments').orderBy('createdAt','asc').limit(200).get();
if(snap.empty){box.innerHTML='<p class="empty">No comments yet.</p>';return;}
box.innerHTML=snap.docs.map(d=>{const c=d.data()||{};const can=user&&(user.uid===c.uid||isAdmin(user));return `<div class="comment"><b>${esc(c.displayName||'User')}</b> <span class="meta">${esc(when(c.createdAt))}</span><div>${esc(c.text||'')}</div>${can?`<button class="btn sec" data-x="${esc(d.id)}">Delete</button>`:''}</div>`;}).join('');
box.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{await db.collection('pressReleases').doc(slug).collection('comments').doc(b.getAttribute('data-x')).delete();comments(slug);});}
async function article(slug){if(window.speechSynthesis)window.speechSynthesis.cancel();speaking=false;
const app=document.getElementById('app');const snap=await db.collection('pressReleases').doc(slug).get();
if(!snap.exists){app.innerHTML='<h1>Not found</h1><p><a class="btn sec" href="/press/index.html">All releases</a></p>';return;}
const a=snap.data()||{};document.title=(a.title||'Press')+' · RailroadRadar';
const imgs=(a.images||[]).map((im,i)=>im&&im.url?`<img class="${i?'':'hero'}" src="${esc(im.url)}" alt="${esc(a.title||'Press image')}">`:'').join('');
app.innerHTML=`<p><a class="back" href="/press/index.html">← All press releases</a></p>
<article class="article size-2">
<div class="tools">
<button type="button" class="a11y-btn" id="a11y" aria-label="Accessibility settings" aria-expanded="false" aria-controls="reader-panel"><img src="${A11Y_ICON}" alt=""></button>
<button type="button" class="share-btn" id="share" aria-label="Share this article"><img src="${SHARE_ICON}" alt=""></button>
<div class="reader-panel" id="reader-panel" role="menu" aria-label="Accessibility settings">
<button type="button" id="r-down" aria-label="Smaller text">A-</button>
<button type="button" id="r-up" aria-label="Larger text">A+</button>
<button type="button" id="r-space" aria-pressed="false">Spacing</button>
<button type="button" id="r-plain" aria-pressed="false">Serif</button>
<button type="button" id="r-speak" aria-pressed="false">Listen</button>
</div>
</div>
<h1>${esc(a.title||slug)}</h1><div class="meta">${esc(when(a.createdAt))} ${a.authorName?' · '+esc(a.authorName):''}</div>
${imgs}<div class="body">${esc(a.body||'')}</div>
${isAdmin(user)?`<p><button class="btn sec" id="ed">Edit</button> <button class="btn sec" id="dc">Send to Discord</button> <button class="btn danger" id="del">Delete</button></p>`:''}</article><div id="slot"></div>
${a.commentsEnabled?`<div><h2 style="color:#fff">Comments</h2><div class="err" id="cerr"></div>${user?`<textarea id="ct" style="min-height:90px"></textarea><p><button class="btn" id="pc">Post comment</button></p>`:'<p class="lede">Sign in to comment.</p>'}<div id="clist"></div></div>`:''}`;
bindReader(a.title||'',a.body||'');
const sh=document.getElementById('share');
if(sh)sh.onclick=async()=>{const url=urlOf(slug);try{if(navigator.share){await navigator.share({title:a.title||'RailroadRadar',text:a.title||'',url});return;}}catch(e){}try{await navigator.clipboard.writeText(url);sh.setAttribute('aria-label','Link copied');setTimeout(()=>sh.setAttribute('aria-label','Share this article'),1600);}catch(e){window.prompt('Copy link',url);}};
const dc=document.getElementById('dc');if(dc)dc.onclick=async()=>{dc.disabled=true;dc.textContent='Sending…';try{await notifyDiscord({title:a.title||slug,body:a.body||'',slug,images:a.images||[]});dc.textContent='Sent';setTimeout(()=>{dc.textContent='Send to Discord';dc.disabled=false;},1600);}catch(e){dc.textContent='Failed';dc.disabled=false;}};
const ed=document.getElementById('ed');if(ed)ed.onclick=()=>{document.getElementById('slot').innerHTML=form(a);document.getElementById('pub').onclick=()=>save(slug);document.getElementById('can').onclick=()=>document.getElementById('slot').innerHTML='';};
const del=document.getElementById('del');if(del)del.onclick=async()=>{if(confirm('Delete this press release?')){await db.collection('pressReleases').doc(slug).delete();location.href='/press/index.html';}};
const pc=document.getElementById('pc');if(pc)pc.onclick=async()=>{const text=(document.getElementById('ct').value||'').trim();if(!text)return;try{await db.collection('pressReleases').doc(slug).collection('comments').add({uid:user.uid,email:user.email||'',displayName:user.displayName||user.email||'User',text,createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('ct').value='';comments(slug);}catch(err){document.getElementById('cerr').textContent=err.message||'Could not comment';document.getElementById('cerr').className='err on';}};
if(a.commentsEnabled)await comments(slug);}
async function route(){const id=idFromLoc();if(id)await article(id);else await list();}
firebase.initializeApp(CFG);auth=firebase.auth();db=firebase.firestore();try{storage=firebase.storage();}catch(e){storage=null;}

function rrCookieDecided(){
  try{
    const raw=localStorage.getItem('rr_cookie_prefs');
    if(raw){const p=JSON.parse(raw);if(p&&p.decided)return p;}
    const c=localStorage.getItem('rr_cookie_consent');
    if(c==='accepted')return {decided:true,clarity:true};
    if(c==='declined')return {decided:true,clarity:false};
  }catch(e){}
  return null;
}
function rrSaveCookies(on){
  try{
    localStorage.setItem('rr_cookie_consent', on?'accepted':'declined');
    localStorage.setItem('rr_cookie_prefs', JSON.stringify({decided:true,clarity:!!on,preferences:true,decidedAt:Date.now()}));
  }catch(e){}
  if(on&&typeof window.__rrLoadClarity==='function')window.__rrLoadClarity();
}
function rrCookieBar(){
  const box=document.getElementById('rr-cookie');
  if(!box)return;
  const decided=rrCookieDecided();
  if(decided){
    box.hidden=true;box.classList.remove('on');
    if(decided.clarity&&typeof window.__rrLoadClarity==='function')window.__rrLoadClarity();
    return;
  }
  box.hidden=false;box.classList.add('on');
  const ck=document.getElementById('rr-cookie-clarity');
  if(ck)ck.checked=true;
  const acc=document.getElementById('rr-cookie-accept');
  const dec=document.getElementById('rr-cookie-decline');
  if(acc)acc.onclick=()=>rrSaveCookies(!!(ck&&ck.checked));
  if(dec)dec.onclick=()=>rrSaveCookies(false);
}
rrCookieBar();
document.getElementById('in').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
document.getElementById('out').onclick=()=>auth.signOut();
document.getElementById('pfp').onclick=e=>{e.stopPropagation();const m=document.getElementById('acct-menu');const open=!m.classList.contains('open');m.classList.toggle('open',open);document.getElementById('pfp').setAttribute('aria-expanded',open?'true':'false');};
document.addEventListener('click',e=>{const m=document.getElementById('acct-menu');const b=document.getElementById('pfp');if(!m||!b)return;if(m.contains(e.target)||b.contains(e.target))return;m.classList.remove('open');b.setAttribute('aria-expanded','false');});
auth.onAuthStateChanged(async u=>{user=u;header();try{if(typeof betterstack==='function'&&u)betterstack('user',{id:u.uid||'',email:u.email||'',username:u.displayName||u.email||''});}catch(e){}await refreshAdmin(u);await route();});
