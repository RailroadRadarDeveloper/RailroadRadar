     * - Prevents double-loading Clarity
     */
    window.__rrLoadClarity = function () {
      // Prevent double-load
      if (window.__rrClarityLoaded) return;
      
      // Check if Clarity script already exists
      if (document.querySelector('script[src*="clarity.ms"]')) {
        window.__rrClarityLoaded = true;
        return;
      }
      
      window.__rrClarityLoaded = true;
      
      try {
        (function(c, l, a, r, i, t, y) {
          c[a] = c[a] || function() { (c[a].q = c[a].q || []).push(arguments); };
          t = l.createElement(r);

      } catch (e) {
        console.warn('[RR] Failed to load Clarity:', e.message);
      }
    };

    /**
     * Parse cookie consent safely with fallbacks
     * Returns: { clarity: boolean }
     */
    function __rrParseCookieConsent() {
      const result = { clarity: false };
      
      if (typeof localStorage === 'undefined') {
        return result;
      }

      try {
        // Check new format first (rr_cookie_prefs)
        const prefsRaw = localStorage.getItem('rr_cookie_prefs');
        if (prefsRaw) {
          const prefs = JSON.parse(prefsRaw);
          if (prefs && typeof prefs.decided === 'boolean') {
            result.clarity = !!prefs.clarity;
            return result;
          }
        }

        // Fallback to legacy format (rr_cookie_consent)
        const consent = localStorage.getItem('rr_cookie_consent');
        if (consent === 'accepted') {
          result.clarity = true;
          return result;
        }
      } catch (e) {
        console.warn('[RR] Cookie parsing failed:', e.message);
        // Silent fail — don't load Clarity on parse errors
      }

      return result;
    }

    // Load Clarity only if explicitly consented
    try {
      const consent = __rrParseCookieConsent();
      if (consent.clarity === true) {
        window.__rrLoadClarity();
      }
    } catch (e) {
      console.error('[RR] Unexpected error in cookie consent logic:', e);
      // Don't load Clarity if anything goes wrong
    }
