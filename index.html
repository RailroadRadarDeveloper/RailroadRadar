
<!DOCTYPE html>
<html>
<head>
  <title>RailroadRadar</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track MBTA Commuter Rail trains in real time. Interactive map with live positions, delays, station departures, service alerts, and trip history.">
  <meta name="theme-color" content="#07093e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RailroadRadar">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/favicon-192.png?v=3">
  <link rel="shortcut icon" href="/favicon.ico?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-precomposed.png?v=2">
  <!-- Microsoft Clarity — loaded only after cookie Accept (see #rr-cookie-bar) -->
  <script>
    /**
     * Safe cookie consent & Clarity loader
     * Robust handling of:
     * - localStorage disabled/unavailable
     * - JSON parse errors
     * - Multiple consent formats (legacy + new)
     * - Prevents double-loading Clarity
     */
    window.__rrLoadClarity = function () {
      // Prevent double-load
      if (window.__rrClarityLoaded) return;
      
      // Check if Clarity script already exists
      if (document.querySelector('script[src*="clarity.ms"]')) {
        window.__rrClarityLoaded = true;
        return;
      }
      
      window.__rrClarityLoaded = true;
      
      try {
        (function(c, l, a, r, i, t, y) {
          c[a] = c[a] || function() { (c[a].q = c[a].q || []).push(arguments); };
          t = l.createElement(r);
          t.async = 1;
          t.src = "https://www.clarity.ms/tag/" + i;
          y = l.getElementsByTagName(r)[0];
          y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "yie7bk3bns");
      } catch (e) {
        console.warn('[RR] Failed to load Clarity:', e.message);
      }
    };

    /**
     * Parse cookie consent safely with fallbacks
     * Returns: { clarity: boolean }
     */
    function __rrParseCookieConsent() {
      const result = { clarity: false };
      
      if (typeof localStorage === 'undefined') {
        return result;
      }

      try {
        // Check new format first (rr_cookie_prefs)
        const prefsRaw = localStorage.getItem('rr_cookie_prefs');
        if (prefsRaw) {
          const prefs = JSON.parse(prefsRaw);
          if (prefs && typeof prefs.decided === 'boolean') {
            result.clarity = !!prefs.clarity;
            return result;
          }
        }

        // Fallback to legacy format (rr_cookie_consent)
        const consent = localStorage.getItem('rr_cookie_consent');
        if (consent === 'accepted') {
          result.clarity = true;
          return result;
        }
      } catch (e) {
        console.warn('[RR] Cookie parsing failed:', e.message);
        // Silent fail — don't load Clarity on parse errors
      }

      return result;
    }

    // Load Clarity only if explicitly consented
    try {
      const consent = __rrParseCookieConsent();
      if (consent.clarity === true) {
        window.__rrLoadClarity();
      }
    } catch (e) {
      console.error('[RR] Unexpected error in cookie consent logic:', e);
      // Don't load Clarity if anything goes wrong
    }
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js" defer></script>
  <link rel="stylesheet" href="/app.css">
</head>
<body>

  <div id="overlay"></div>
  <div id="map"></div>
  <div id="control-panel" class="control-panel"></div>
  <div id="rr-cookie-bar" hidden></div>
  <div id="rr-cookie-modal" hidden></div>
  <div id="rr-train-page"></div>
