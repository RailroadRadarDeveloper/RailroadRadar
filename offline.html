        top -40px right -60px,
        bottom left -80px;

        min(480px, 60vw),
        min(520px, 70vw);
      color: var(--light-text);

    body {
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .header {
      width: 100%;
      height: 60px;
      background-color: #07093e;
      display: flex;
      align-items: center;
      padding: 0 16px;
    }
    .header-logo {
      height: 40px;
      margin-right: 12px;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }
    .error-message {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      max-width: 520px;
      line-height: 1.35;
      margin: 0 0 14px 0;
      letter-spacing: 0.2px;
    }
    .error-code-line {
      font-size: 18px;
      font-weight: 600;
      color: #a8c0e0;
      margin: 0 0 28px 0;
      letter-spacing: 0.3px;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }
    .btn-primary {
      background-color: #0ac700;
      color: white;
    }
    .btn-primary:hover {
      background-color: #089e00;
    }
    .train-hint {
      margin-top: 36px;
      font-size: 13px;
      color: #7a9bb8;
    }
    .footer {
      background-color: #07093e;
      color: #a8c0e0;
      padding: 14px 20px;
      font-size: 13px;
      text-align: center;
    }
    @media (max-width: 480px) {
      .error-message { font-size: 22px; }
      .error-code-line { font-size: 16px; }
    }
  </style>
</head>
