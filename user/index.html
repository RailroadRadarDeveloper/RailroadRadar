  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #fff; color: #1a2030;
    }
    .header {
      position: fixed; top: 0; left: 0; right: 0; height: 64px;
      background: #07093e; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 20;
    }
    .header-logo-picture { display: flex; align-items: center; }
    .header img.wordmark {
      height: 52px; width: auto; max-width: min(260px, 58vw); object-fit: contain; display: block;
    }
    @media (min-width: 768px) {
      .header img.wordmark { height: 48px; max-width: min(380px, 44vw); }
    }
    .hb {
      background: #fff; color: #07093e; border: 0; padding: 8px 12px;
      font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 88px 16px 64px; }
    .state {
      background: #f6f7fb; border: 1px solid #e2e6ef; padding: 28px 22px;
      text-align: center; color: #5b6578;
    }
    .state h1 { color: #07093e; margin: 0 0 8px; font-size: 22px; }
    .state p { margin: 0 0 18px; line-height: 1.45; }
    .profile-head {
      display: flex; gap: 16px; align-items: center; margin-bottom: 28px;
      background: #f6f7fb; border: 1px solid #e2e6ef; padding: 18px 20px;
    }
    .avatar, .avatar-fallback {
      width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
      border: 3px solid #07093e; background: #2c3e6b; flex-shrink: 0;
    }
    .avatar-fallback {
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 800; color: #fff;
    }
    .profile-meta h1 { margin: 0 0 4px; font-size: 24px; color: #07093e; line-height: 1.2; }
    .profile-meta .handle { color: #5b6578; font-weight: 700; font-size: 15px; }
    .profile-meta .brand-note { margin: 6px 0 0; font-size: 12px; font-weight: 700; color: #07093e; letter-spacing: .04em; text-transform: uppercase; }
    .section { margin: 0 0 28px; }
    .section h2 {
      margin: 0 0 14px; color: #07093e; font-size: 18px; font-weight: 800;
    }
    /* Solid full-color trip cards (match My Trips prefs) */
    .trip-log-row {
      background: var(--rr-trip-rail, #07093e); color: #fff; border: none; border-radius: 14px;
      padding: 16px; margin: 0 0 16px; box-shadow: 0 6px 20px rgba(15, 23, 42, 0.18);
    }
    .trip-log-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .trip-log-row-rail { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .trip-rail-badge, .trip-train-chip {
      display: inline-block; color: #07093e; background: #fff;
      font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; letter-spacing: .02em;
    }
    .trip-train-chip { background: rgba(255,255,255,0.92); }
    .trip-log-row-route { font-size: 17px; font-weight: 800; color: #fff; margin: 0 0 6px; }
    .trip-log-row-meta { color: rgba(255,255,255,0.88); font-size: 13px; margin-bottom: 8px; }
    .trip-log-row-facts {
      display: flex; flex-wrap: wrap; gap: 10px; color: #fff; font-size: 13px; font-weight: 700; margin-bottom: 10px;
    }
    .trip-log-row-map {
      margin-top: 10px; height: 160px; width: 100%; border-radius: 10px;
      background: #0b0d1a; overflow: hidden; position: relative; z-index: 0;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.12);
    }
    .trip-log-row-map.is-empty::after {
      content: 'Map unavailable';
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #9aa3b8; font-size: 12px; font-weight: 700; pointer-events: none; z-index: 3;
    }
    .trip-log-row-map.is-loading::after {
      content: 'Loading map…';
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #9aa3b8; font-size: 12px; font-weight: 700; pointer-events: none; z-index: 3;
    }
    .trip-log-row-map .leaflet-container { height: 100%; width: 100%; background: #0b0d1a; }
    .trip-log-row-map .leaflet-control-container { display: none !important; }
    .trip-seg-chip {
      display: block; font-size: 11px; color: rgba(255,255,255,0.9); margin: 0 0 4px;
    }
    .empty-trips { color: #5b6578; padding: 8px 0 18px; }
    .footer-note { margin-top: 20px; color: #7b8494; font-size: 13px; text-align: center; }
    .footer-note a { color: #07093e; font-weight: 700; text-decoration: none; }
    @media (max-width: 520px) {
      .profile-head { flex-direction: column; text-align: center; }
    }
  </style>

    function findTripStation(railroad, stationId) {
      const rr = String(railroad || '').toLowerCase();
      let sid = String(stationId || '');
      if (rr === 'mbta') sid = tripMbtaCanonicalStationId(sid) || sid;
      const list = getTripLogStations(railroad);
      for (let i = 0; i < list.length; i++) {
        if (String(list[i].id) === String(sid)) return list[i];
      }
      // MBTA: try place- strip / match name-ish id without place-
      if (rr === 'mbta' && sid.indexOf('place-') !== 0) {
        const place = 'place-' + sid;
        for (let i = 0; i < list.length; i++) {
          if (String(list[i].id) === place) return list[i];
        }
      }
      return null;
    }
    function getTripLogStationsForLine(railroad, lineId) {
      const rr = String(railroad || '').toLowerCase();
      const lid = String(lineId || '');
      const all = getTripLogStations(railroad);
      if (!lid || lid === 'ALL') return all;
      const pack = TRIP_LINE_STOPS[rr];
      if (pack && pack[lid] && Array.isArray(pack[lid].s)) {
        const set = {};
        pack[lid].s.forEach(function (sid) { set[String(sid)] = true; });
        return all.filter(function (s) { return set[String(s.id)]; });
      }
      return [];
    }
    function rrTripStopChainLatLngs(railroad, lineId, originId, destId) {
      const o = findTripStation(railroad, originId);
      const d = findTripStation(railroad, destId);
      if (!o || !d || !lineId) return null;
      const oLat = Number(o.lat), oLon = Number(o.lon);
      const dLat = Number(d.lat), dLon = Number(d.lon);
      if (![oLat, oLon, dLat, dLon].every(function (n) { return isFinite(n); })) return null;
      if (oLat === dLat && oLon === dLon) return [[oLat, oLon]];
      const od = haversineMiles(oLat, oLon, dLat, dLon);
      if (!(od > 0) || !isFinite(od)) return null;
      let corridorPts = null;
      const stations = getTripLogStationsForLine(railroad, lineId) || [];
      const corridor = [];
      corridor.push({ lat: oLat, lon: oLon, dO: 0 });
      corridor.push({ lat: dLat, lon: dLon, dO: od });
      stations.forEach(function (s) {
        if (!s) return;
        const lat = Number(s.lat), lon = Number(s.lon);
        if (!isFinite(lat) || !isFinite(lon)) return;
        const dO = haversineMiles(oLat, oLon, lat, lon);
        const dD = haversineMiles(lat, lon, dLat, dLon);
        if (!isFinite(dO) || !isFinite(dD)) return;
        if (dO + dD > od * 1.5 + 0.75) return;
        if (dO > od + 0.75 || dD > od + 0.75) return;
        corridor.push({ lat: lat, lon: lon, dO: dO });
      });
      corridor.sort(function (a, b) { return a.dO - b.dO; });
      corridorPts = rrDedupeLatLngs(corridor.map(function (p) { return [p.lat, p.lon]; }));

      let indexPts = null;
      const rr = String(railroad || '').toLowerCase();
      const pack = TRIP_LINE_STOPS[rr];
      const lid = String(lineId || '');
      if (pack && pack[lid] && Array.isArray(pack[lid].s)) {
        const ids = pack[lid].s;
        let oi = -1, di = -1;
        for (let i = 0; i < ids.length; i++) {
          if (String(ids[i]) === String(originId)) oi = i;
          if (String(ids[i]) === String(destId)) di = i;
        }
        if (oi >= 0 && di >= 0 && oi !== di) {
          const lo = Math.min(oi, di), hi = Math.max(oi, di);
          const slicePts = [];
          for (let i = lo; i <= hi; i++) {
            const st = findTripStation(railroad, ids[i]);
            if (!st) continue;
            const lat = Number(st.lat), lon = Number(st.lon);
            if (!isFinite(lat) || !isFinite(lon)) continue;
            slicePts.push([lat, lon]);
          }
          indexPts = rrDedupeLatLngs(slicePts);
          if (oi > di && indexPts) indexPts.reverse();
        }
      }
      function pathLen(pts) {
        if (!pts || pts.length < 2) return 0;
        let sum = 0;
        for (let i = 1; i < pts.length; i++) sum += haversineMiles(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]);
        return sum;
      }
      function pathHasJump(pts, maxJumpMi) {
        if (!pts || pts.length < 2) return false;
        const lim = maxJumpMi == null ? 10 : maxJumpMi;
        for (let i = 1; i < pts.length; i++) {
          if (haversineMiles(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]) > lim) return true;
        }
        return false;
      }
      // MBTA TRIP_LINE_STOPS can jump; prefer corridor
      const indexOk = indexPts && indexPts.length >= 2 && !pathHasJump(indexPts, 10);
      const corridorOk = corridorPts && corridorPts.length >= 2 && !pathHasJump(corridorPts, 12);
      const cLen = pathLen(corridorPts);
      const iLen = pathLen(indexPts);
      let chosen = null;
      if (indexOk && corridorOk) chosen = (iLen <= cLen * 1.08) ? indexPts : corridorPts;
      else if (corridorOk) chosen = corridorPts;
      else if (indexOk) chosen = indexPts;
      else if (corridorPts && corridorPts.length >= 2) chosen = corridorPts;
      else if (indexPts && indexPts.length >= 2) chosen = indexPts;
      return chosen;
    }
    function rrTripSegIds(seg, data) {
      const rr = String((seg && seg.railroad) || (data && data.railroad) || '').toLowerCase();
      const lineId = String((seg && (seg.lineId || seg.line_id)) || (data && data.lineId) || '');
      const originId = String((seg && (seg.originStationId || seg.originId)) || (data && data.originStationId) || '');
      const destId = String((seg && (seg.destStationId || seg.destId)) || (data && data.destStationId) || '');
      return { railroad: rr, lineId: lineId, originId: originId, destId: destId };
    }
    function coordFrom(obj, prefix) {
      if (!obj) return null;
      const lat = Number(obj[prefix + 'Lat'] != null ? obj[prefix + 'Lat'] : (obj.lat != null ? obj.lat : obj.latitude));
      const lon = Number(obj[prefix + 'Lng'] != null ? obj[prefix + 'Lng'] : (obj[prefix + 'Lon'] != null ? obj[prefix + 'Lon'] : (obj.lon != null ? obj.lon : obj.lng)));
      if (isFinite(lat) && isFinite(lon)) return [lat, lon];
      return null;
    }
    function rrResolveTripSegmentGeom(seg, data) {
      const ids = rrTripSegIds(seg, data);
      const color = tripRailColor(ids.railroad);
      const o = findTripStation(ids.railroad, ids.originId);
      const d = findTripStation(ids.railroad, ids.destId);
      let origin = null, dest = null;
      if (o) {
        const lat = Number(o.lat), lon = Number(o.lon);
        if (isFinite(lat) && isFinite(lon)) origin = [lat, lon];
      }
      if (d) {
        const lat = Number(d.lat), lon = Number(d.lon);
        if (isFinite(lat) && isFinite(lon)) dest = [lat, lon];
      }
      // Fall back to coords stored on the trip/segment doc
      if (!origin) origin = coordFrom(seg, 'origin') || coordFrom(seg, '') || coordFrom(data, 'origin');
      if (!dest) dest = coordFrom(seg, 'dest') || coordFrom(data, 'dest');
      let line = null;
      if (origin && dest) {
        const polys = rrGetCachedTripPolylines(ids.railroad, ids.lineId);
        if (polys && polys.length) {
          const odMi = haversineMiles(origin[0], origin[1], dest[0], dest[1]);
          let best = null, bestLen = Infinity;
          polys.forEach(function (pl) {
            const sliced = rrSlicePolylineBetween(pl, origin[0], origin[1], dest[0], dest[1]);
            if (!sliced || sliced.length < 2) return;
            let len = 0;
            for (let i = 1; i < sliced.length; i++) len += haversineMiles(sliced[i - 1][0], sliced[i - 1][1], sliced[i][0], sliced[i][1]);
            if (odMi > 0.5 && len > Math.max(odMi * 2.8, odMi + 25)) return;
            if (len < bestLen) { bestLen = len; best = sliced; }
          });
          line = best;
        }
        if (!line && ids.lineId) {
          line = rrTripStopChainLatLngs(ids.railroad, ids.lineId, ids.originId, ids.destId);
        }
        if (!line) line = [origin, dest];
      }
      return {
        railroad: ids.railroad, lineId: ids.lineId, originId: ids.originId, destId: ids.destId,
        color: color, origin: origin, dest: dest, line: line
      };
    }
    function rrTripSegmentsForMap(data) {
      const segs = Array.isArray(data && data.segments) ? data.segments : null;
      if (segs && segs.length) return segs;
      if (!data) return [];
      return [{
        railroad: data.railroad,
        lineId: data.lineId || '',
        originStationId: data.originStationId,
        destStationId: data.destStationId,
        originName: data.originName,
        destName: data.destName
      }];
    }
    function rrTripMbtaShapesUrl(lineId) {
      return RR_API + '/api/mbta/shapes?filter[route]=' + encodeURIComponent(lineId) + '&page[limit]=100';
    }
    async function ensureTripShapesForMiles(railroad, lineId) {
      const ag = String(railroad || '').toLowerCase();
      const lid = String(lineId || '');
      if (!ag || ag === 'metra') return null;
      if (lid && rrGetCachedTripPolylines(ag, lid)) return rrGetCachedTripPolylines(ag, lid);
      if (ag !== 'mbta' && window.RR_TRIP_SHAPES[ag] && Object.keys(window.RR_TRIP_SHAPES[ag]).length) {
        return null;
      }
      const key = ag === 'mbta' ? ('mbta:' + lid) : ag;
      if (window.RR_TRIP_SHAPES_PROMISES[key]) return window.RR_TRIP_SHAPES_PROMISES[key];
      const p = (async function () {
        try {
          if (ag === 'mbta') {
            if (!lid) return null;
            let url = rrTripMbtaShapesUrl(lid);
            const polys = [];
            while (url) {
              const sr = await fetch(url);
              if (!sr.ok) break;
              const sd = await sr.json();
              (sd.data || []).forEach(function (s) {
                const enc = s.attributes && s.attributes.polyline;
                if (!enc) return;
                try {
                  const pts = rrDecodeGooglePolyline(enc);
                  const n = rrNormalizePolyLatLngs(pts);
                  if (n) polys.push(n);
                } catch (_) {}
              });
              const next = sd.links && sd.links.next;
              url = next || null;
              if (polys.length > 40) break;
            }
            if (polys.length) rrRegisterTripShapePolylines('mbta', lid, polys);
            return polys.length ? polys : null;
          }
          const url = 'https://railroadradar.com/assets/shapes/' + ag + '.json';
          const res = await fetch(url);
          if (!res.ok) return null;
          const data = await res.json();
          if (data && data.routes) rrRegisterTripShapes(ag, data.routes);
          return lid ? rrGetCachedTripPolylines(ag, lid) : null;
        } catch (_) { return null; }
      })();
      window.RR_TRIP_SHAPES_PROMISES[key] = p;
      return p;
    }
    function rrEnsureTripGeomsShapes(data) {
      const segs = rrTripSegmentsForMap(data);
      const promises = [];
      const seen = {};
      segs.forEach(function (seg) {
        const ids = rrTripSegIds(seg, data);
        if (!ids.railroad || !ids.lineId) return;
        const key = ids.railroad + ':' + ids.lineId;
        if (seen[key]) return;
        seen[key] = true;
        if (rrGetCachedTripPolylines(ids.railroad, ids.lineId)) return;
        promises.push(ensureTripShapesForMiles(ids.railroad, ids.lineId));
      });
      return Promise.all(promises).then(function () { return true; });
    }

    function paintTripLogMiniMap(el, data) {
      if (!el || typeof L === 'undefined' || !L.map) {
        if (el) { el.classList.add('is-empty'); el.classList.remove('is-loading'); }
        return;
      }
      el.classList.remove('is-empty');
      el.classList.add('is-loading');
      el.innerHTML = '';
      const segs = rrTripSegmentsForMap(data).map(function (s) { return rrResolveTripSegmentGeom(s, data); });
      const hasAny = segs.some(function (g) { return g.origin || g.dest || (g.line && g.line.length >= 2); });
      if (!hasAny) {
        el.classList.remove('is-loading');
        el.classList.add('is-empty');
        return;
      }
      let map;
      try {
        map = L.map(el, {
          zoomControl: false, attributionControl: false, dragging: false,
          scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false,
          keyboard: false, tap: false, touchZoom: false, closePopupOnClick: false
        });
        rrTripMapTileLayer({ maxZoom: 20, opacity: 1 }).addTo(map);
      } catch (e) {
        el.classList.remove('is-loading');
        el.classList.add('is-empty');
        return;
      }
      const bounds = [];
      segs.forEach(function (g) {
        if (g.line && g.line.length >= 2) {
          try {
            L.polyline(g.line, { color: g.color || '#07093e', weight: 5, opacity: 1, lineJoin: 'round', lineCap: 'round' }).addTo(map);
            g.line.forEach(function (p) { bounds.push(p); });
          } catch (_) {}
        } else if (g.origin && g.dest) {
          try {
            L.polyline([g.origin, g.dest], { color: g.color || '#07093e', weight: 3, opacity: 0.75, dashArray: '6 6' }).addTo(map);
            bounds.push(g.origin, g.dest);
          } catch (_) {}
        }
      });
      (function paintTripEndpointMarkers() {
        function llKey(ll) {
          if (!ll) return '';
          const lat = Array.isArray(ll) ? Number(ll[0]) : Number(ll.lat);
          const lng = Array.isArray(ll) ? Number(ll[1]) : Number(ll.lng);
          if (!isFinite(lat) || !isFinite(lng)) return '';
          return lat.toFixed(5) + ',' + lng.toFixed(5);
        }
        function addOdMarker(ll, isOrigin) {
          if (!ll) return;
          try {
            L.circleMarker(ll, {
              radius: 5, color: '#1a2030', weight: 2,
              fillColor: isOrigin ? '#1a7f37' : '#b00020', fillOpacity: 1
            }).addTo(map);
            bounds.push(ll);
          } catch (_) {}
        }
        function addTransferMarker(ll) {
          if (!ll) return;
          try {
            L.circleMarker(ll, {
              radius: 3.5, color: '#07093e', weight: 2, fillColor: '#fff', fillOpacity: 1
            }).addTo(map);
            bounds.push(ll);
          } catch (_) {}
        }
        if (!segs.length) return;
        if (segs.length === 1) {
          addOdMarker(segs[0].origin, true);
          addOdMarker(segs[0].dest, false);
          return;
        }
        addOdMarker(segs[0].origin, true);
        const endKeys = Object.create(null);
        const ok = llKey(segs[0].origin); if (ok) endKeys[ok] = 1;
        const dk = llKey(segs[segs.length - 1].dest); if (dk) endKeys[dk] = 1;
        const seen = Object.create(null);
        for (let i = 0; i < segs.length - 1; i++) {
          const ll = segs[i].dest || (segs[i + 1] && segs[i + 1].origin);
          const k = llKey(ll);
          if (!k || endKeys[k] || seen[k]) continue;
          seen[k] = 1;
          addTransferMarker(ll);
        }
        addOdMarker(segs[segs.length - 1].dest, false);
      })();
      try {
        if (bounds.length >= 2) map.fitBounds(bounds, { padding: [18, 18], maxZoom: 13 });
        else if (bounds.length === 1) map.setView(bounds[0], 11);
        else map.setView([42.3, -71.1], 7);
      } catch (_) {
        try { map.setView([42.3, -71.1], 7); } catch (__) {}
      }
      el.classList.remove('is-loading');
      maps.push(map);
      setTimeout(function () { try { map.invalidateSize(false); } catch (_) {} }, 50);
      setTimeout(function () { try { map.invalidateSize(false); } catch (_) {} }, 250);
    }
    function scheduleTripLogMiniMap(el, data) {
      if (!el) return;
      el.classList.add('is-loading');
      el.classList.remove('is-empty');
      rrEnsureTripGeomsShapes(data).then(function () {
        if (!el.isConnected) return;
        paintTripLogMiniMap(el, data);
      }).catch(function () {
        if (!el.isConnected) return;
        paintTripLogMiniMap(el, data);
      });
    }

    function tripCard(d) {
      const ids = railIds(d);
      const primary = (ids[0] || d.railroad || 'trip');
      const badges = (ids.length ? ids : ['trip']).map(function (id) {
        return '<span class="trip-rail-badge">' + esc(railLabel(id)) + '</span>';
      }).join('');
      const train = d.trainNumber ? '<span class="trip-train-chip">Train ' + esc(d.trainNumber) + '</span>' : '';
      const miles = formatMiles(d.miles);
      const stock = String(d.rollingStock || '').trim();
      const segs = Array.isArray(d.segments) ? d.segments : [];
      let chips = '';
      if (segs.length > 1) {
        chips = segs.map(function (s, i) {
          return '<span class="trip-seg-chip">' + (i + 1) + '. ' +
            esc(railLabel(s.railroad)) + ' · ' +
            esc(s.originName || s.originStationId || '') + ' → ' +
            esc(s.destName || s.destStationId || '') + '</span>';
        }).join('');
      }
      return '<article class="trip-log-row" data-trip-id="' + esc(d.id || '') + '" data-rail-accent style="--rr-trip-rail:' + railColor(primary) + '">' +
        '<div class="trip-log-row-top"><div class="trip-log-row-rail">' + badges + train + '</div></div>' +
        '<div class="trip-log-row-route">' + routeHtml(d) + '</div>' +
        '<div class="trip-log-row-meta">' + esc(tripWhen(d)) + '</div>' +
        '<div class="trip-log-row-facts">' +
          (miles ? '<span>' + esc(miles) + '</span>' : '') +
          (stock ? '<span>Stock #' + esc(stock) + '</span>' : '') +
        '</div>' + chips +
        '<div class="trip-log-row-map is-loading" data-trip-map></div>' +
      '</article>';
    }
    function sectionHtml(title, trips) {
      if (!trips.length) return '';
      return '<section class="section"><h2>' + esc(title) + '</h2>' +
        trips.map(tripCard).join('') + '</section>';
    }
    function renderProfile(profile, trips) {
      const name = profile.displayName || profile.username || 'Railfan';
      document.title = name + ' · MyTrips';
      window.__rrProfileShare = location.href.split('#')[0];
      trips = (trips || []).filter(function (t) { return !t.hiddenPublic; });
      const upcoming = trips.filter(function (t) { return tripStartMs(t) >= Date.now(); }).sort(function (a, b) { return tripStartMs(a) - tripStartMs(b); });
      const past = trips.filter(function (t) { return tripStartMs(t) < Date.now(); });
      const photo = profile.photoURL
        ? '<img class="avatar" src="' + esc(profile.photoURL) + '" alt="' + esc(name) + '" referrerpolicy="no-referrer">'
        : '<div class="avatar-fallback">' + esc(String(name).charAt(0).toUpperCase()) + '</div>';
      const list = (upcoming.length || past.length)
        ? sectionHtml('Upcoming trips', upcoming) + sectionHtml('Past trips', past)
        : '<p class="empty-trips">No public trips yet.</p>';
      document.getElementById('app').innerHTML =
        '<div class="profile-head">' + photo +
        '<div class="profile-meta">' +
        '<h1>' + esc(name) + '</h1>' +
        '<div class="handle">@' + esc(profile.username || '') + '</div>' +
        '<div class="brand-note">MyTrips</div>' +
        '</div></div>' + list +
        '<p class="footer-note">Public trip log on <a href="https://railroadradar.com/mytrips/">MyTrips</a></p>';
      const ordered = upcoming.concat(past);
      Array.prototype.forEach.call(document.querySelectorAll('[data-trip-map]'), function (el, i) {
        const trip = ordered[i];
        if (trip) scheduleTripLogMiniMap(el, trip);
      });
    }
    async function main() {
      const username = usernameFromLoc();
      if (!username) {
        showState('Profile not found', 'No username was provided in this link.');
        return;
      }
      let db;
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.firestore();
      } catch (e) {
        showState('Could not load', 'Firebase failed to start. Try again later.');
        return;
      }
      const lower = username.toLowerCase();
      let unameSnap;
      try { unameSnap = await db.collection('usernames').doc(lower).get(); }
      catch (e) { showState('Could not load', 'Unable to look up this profile right now.'); return; }
      if (!unameSnap.exists) {
        showState('Profile not found', 'We couldn’t find a public profile for that username.');
        return;
      }
      const unameData = unameSnap.data() || {};
      const uid = unameData.uid;
      if (!uid) {
        showState('Profile not found', 'We couldn’t find a public profile for that username.');
        return;
      }
      let profileSnap;
      try { profileSnap = await db.collection('publicProfiles').doc(uid).get(); }
      catch (e) { showState('Could not load', 'Unable to load this profile right now.'); return; }
      if (!profileSnap.exists) {
        showState('This profile isn’t public', 'This user has not published a public MyTrips profile.');
        return;
      }
      const profile = Object.assign({ uid: uid }, profileSnap.data() || {});
      if (!profile.username) profile.username = unameData.username || username;
      let trips = [];
      try {
        const tripSnap = await db.collection('tripLogs').where('userId', '==', uid).orderBy('startTime', 'desc').limit(50).get();
        trips = tripSnap.docs.map(function (doc) { return Object.assign({ id: doc.id }, doc.data() || {}); });
      } catch (e) {
        try {
          const tripSnap = await db.collection('tripLogs').where('userId', '==', uid).limit(50).get();
          trips = tripSnap.docs.map(function (doc) { return Object.assign({ id: doc.id }, doc.data() || {}); });
          trips.sort(function (a, b) { return tripStartMs(b) - tripStartMs(a); });
        } catch (e2) { trips = []; }
      }
      renderProfile(profile, trips);
    }
    main();
  })();
  </script>
