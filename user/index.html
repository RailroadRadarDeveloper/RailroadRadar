<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTrips · RailroadRadar</title>
  <meta name="theme-color" content="#07093e">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="https://railroadradar.com/assets/icons/favicon-32.png?v=3">
  <link rel="apple-touch-icon" href="https://railroadradar.com/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #fff; color: #1a2030;
    }
    .header {
      position: fixed; top: 0; left: 0; right: 0; height: 64px;
      background: #07093e; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 20;
    }
    .header-logo-picture { display: flex; align-items: center; }
    .header img.wordmark {
      height: 52px; width: auto; max-width: min(260px, 58vw); object-fit: contain; display: block;
    }
    @media (min-width: 768px) {
      .header img.wordmark { height: 48px; max-width: min(380px, 44vw); }
    }
    .hb {
      background: #fff; color: #07093e; border: 0; padding: 8px 12px;
      font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 88px 16px 64px; }
    .state {
      background: #f6f7fb; border: 1px solid #e2e6ef; padding: 28px 22px;
      text-align: center; color: #5b6578;
    }
    .state h1 { color: #07093e; margin: 0 0 8px; font-size: 22px; }
    .state p { margin: 0 0 18px; line-height: 1.45; }
    .profile-head {
      display: flex; gap: 16px; align-items: center; margin-bottom: 28px;
      background: #f6f7fb; border: 1px solid #e2e6ef; padding: 18px 20px;
    }
    .avatar, .avatar-fallback {
      width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
      border: 3px solid #07093e; background: #2c3e6b; flex-shrink: 0;
    }
    .avatar-fallback {
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 800; color: #fff;
    }
    .profile-meta h1 { margin: 0 0 4px; font-size: 24px; color: #07093e; line-height: 1.2; }
    .profile-meta .handle { color: #5b6578; font-weight: 700; font-size: 15px; }
    .profile-meta .brand-note { margin: 6px 0 0; font-size: 12px; font-weight: 700; color: #07093e; letter-spacing: .04em; text-transform: uppercase; }
    .section { margin: 0 0 28px; }
    .section h2 {
      margin: 0 0 14px; color: #07093e; font-size: 18px; font-weight: 800;
    }
    .trip-log-row {
      background: #fff; border: 1px solid #e2e6ef; border-radius: 12px;
      padding: 14px; margin: 0 0 14px; box-shadow: 0 6px 18px rgba(7,9,62,.05);
    }
    .trip-log-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .trip-log-row-rail { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .trip-rail-badge, .trip-train-chip {
      display: inline-block; color: #fff; background: #07093e;
      font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; letter-spacing: .02em;
    }
    .trip-train-chip { background: #eef1f7; color: #07093e; }
    .trip-log-row-route { font-size: 17px; font-weight: 800; color: #07093e; margin: 0 0 6px; }
    .trip-log-row-meta { color: #5b6578; font-size: 13px; margin-bottom: 8px; }
    .trip-log-row-facts {
      display: flex; flex-wrap: wrap; gap: 10px; color: #07093e; font-size: 13px; font-weight: 700; margin-bottom: 10px;
    }
    .trip-log-row-map {
      height: 160px; border-radius: 10px; background: #edf0f6; overflow: hidden;
    }
    .trip-log-row-map.is-empty::after {
      content: 'Map preview unavailable';
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: #7b8494; font-size: 13px; font-weight: 700;
    }
    .trip-log-row-map .leaflet-container { height: 100%; width: 100%; background: #edf0f6; }
    .trip-seg-chip {
      display: block; font-size: 12px; color: #3d4656; margin: 0 0 6px;
    }
    .empty-trips { color: #5b6578; padding: 8px 0 18px; }
    .footer-note { margin-top: 20px; color: #7b8494; font-size: 13px; text-align: center; }
    .footer-note a { color: #07093e; font-weight: 700; text-decoration: none; }
    @media (max-width: 520px) {
      .profile-head { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a class="brand" href="https://railroadradar.com/mytrips/">
      <picture class="header-logo-picture">
        <source media="(min-width: 768px)" srcset="https://railroadradar.com/assets/brand/mytrips-logo-wide.png">
        <img class="wordmark" src="https://railroadradar.com/assets/brand/mytrips-logo.png" alt="MyTrips by RailroadRadar">
      </picture>
    </a>
    <a class="hb" href="https://railroadradar.com/">Live map</a>
  </div>
  <div class="wrap" id="app">
    <div class="state" id="state-loading">
      <h1>Loading MyTrips…</h1>
      <p>Pulling this rider’s public trip cards.</p>
    </div>
  </div>

  <script>
  (function () {
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBCXgIwkKHBrNfs4-0T0L9LQNb6GP-37Qs",
      authDomain: "railroadradar-accounts.firebaseapp.com",
      projectId: "railroadradar-accounts",
      storageBucket: "railroadradar-accounts.firebasestorage.app",
      messagingSenderId: "896370923309",
      appId: "1:896370923309:web:594b0a20d3b1c6822e65a4"
    };
    const RAIL_COLORS = {
      mbta: '#9d1c80', amtrak: '#003b5c', mnr: '#ee0034', lirr: '#0039A6',
      njt: '#FF671F', metra: '#0055A4', marc: '#FF8000', ctrail: '#003865'
    };
    const RAIL_LABELS = {
      mbta: 'MBTA', amtrak: 'Amtrak', mnr: 'Metro-North', lirr: 'LIRR',
      njt: 'NJ Transit', metra: 'Metra', marc: 'MARC', ctrail: 'CTrail', septa: 'SEPTA', via: 'VIA Rail'
    };
    const maps = [];
    const mbtaStops = {};

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }
    function usernameFromLoc() {
      const q = new URLSearchParams(location.search);
      const u = (q.get('u') || '').trim();
      if (u) return u;
      const m = location.pathname.match(/^\/user\/([^\/]+)\/?$/);
      if (m && m[1] && m[1] !== 'index.html') {
        try { return decodeURIComponent(m[1]); } catch (_) { return m[1]; }
      }
      return '';
    }
    function showState(title, body) {
      document.getElementById('app').innerHTML =
        '<div class="state"><h1>' + esc(title) + '</h1><p>' + esc(body) + '</p>' +
        '<p><a class="hb" href="https://railroadradar.com/">Back to live map</a></p></div>';
    }
    function railLabel(rr) {
      const id = String(rr || '').toLowerCase();
      return RAIL_LABELS[id] || (rr ? String(rr) : 'Railroad');
    }
    function railColor(rr) {
      return RAIL_COLORS[String(rr || '').toLowerCase()] || '#07093e';
    }
    function railIds(d) {
      const ids = [];
      const segs = Array.isArray(d.segments) ? d.segments : [];
      segs.forEach(function (s) {
        const id = String(s.railroad || '').toLowerCase();
        if (id && ids.indexOf(id) < 0) ids.push(id);
      });
      const top = String(d.railroad || '').toLowerCase();
      if (top && ids.indexOf(top) < 0) ids.unshift(top);
      return ids;
    }
    function asDate(raw) {
      if (!raw) return null;
      try {
        if (raw && typeof raw.toDate === 'function') return raw.toDate();
        const d = new Date(raw);
        return isNaN(d.getTime()) ? null : d;
      } catch (_) { return null; }
    }
    function formatWhen(raw) {
      const d = asDate(raw);
      if (!d) return '';
      return d.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
    }
    function tripWhen(d) {
      const segs = Array.isArray(d.segments) ? d.segments : [];
      const start = (segs[0] && (segs[0].departTime || segs[0].startTime)) || d.startTime;
      const end = (segs.length && (segs[segs.length - 1].arriveTime || segs[segs.length - 1].endTime)) || d.endTime;
      const a = formatWhen(start), b = formatWhen(end);
      if (a && b && a !== b) return a + ' → ' + b;
      return a || b || '';
    }
    function tripStartMs(d) {
      const segs = Array.isArray(d.segments) ? d.segments : [];
      const raw = (segs[0] && (segs[0].departTime || segs[0].startTime)) || d.startTime;
      const dt = asDate(raw);
      return dt ? dt.getTime() : 0;
    }
    function formatMiles(n) {
      const x = Number(n);
      if (!isFinite(x)) return '';
      return (Math.round(x * 10) / 10).toLocaleString('en-US') + ' mi';
    }
    function routeHtml(d) {
      const segs = Array.isArray(d.segments) ? d.segments : [];
      if (segs.length > 1) {
        const o = segs[0].originName || d.originName || 'Origin';
        const dest = segs[segs.length - 1].destName || d.destName || 'Destination';
        return esc(o) + ' → ' + esc(dest);
      }
      return esc(d.originName || d.originStationId || 'Origin') + ' → ' + esc(d.destName || d.destStationId || 'Destination');
    }
    function coordFrom(obj, prefix) {
      if (!obj) return null;
      const lat = Number(obj[prefix + 'Lat'] != null ? obj[prefix + 'Lat'] : (obj.lat != null ? obj.lat : obj.latitude));
      const lon = Number(obj[prefix + 'Lng'] != null ? obj[prefix + 'Lng'] : (obj[prefix + 'Lon'] != null ? obj[prefix + 'Lon'] : (obj.lon != null ? obj.lon : obj.lng)));
      if (isFinite(lat) && isFinite(lon)) return [lat, lon];
      return null;
    }
    function mbtaCoord(id) {
      if (!id) return null;
      const s = mbtaStops[String(id)] || mbtaStops[String(id).replace(/^place-/, '')];
      return s || null;
    }
    function pointsForTrip(d) {
      const pts = [];
      const segs = Array.isArray(d.segments) && d.segments.length ? d.segments : [d];
      segs.forEach(function (s) {
        const o = coordFrom(s, 'origin') || mbtaCoord(s.originStationId) || coordFrom(s, '');
        const dest = coordFrom(s, 'dest') || mbtaCoord(s.destStationId);
        if (o) pts.push(o);
        if (dest) pts.push(dest);
      });
      const o2 = coordFrom(d, 'origin') || mbtaCoord(d.originStationId);
      const d2 = coordFrom(d, 'dest') || mbtaCoord(d.destStationId);
      if (o2) pts.push(o2);
      if (d2) pts.push(d2);
      return pts;
    }
    function paintMap(el, d) {
      if (!el || typeof L === 'undefined') {
        if (el) el.classList.add('is-empty');
        return;
      }
      const pts = pointsForTrip(d);
      if (pts.length < 1) {
        el.classList.add('is-empty');
        return;
      }
      const map = L.map(el, {
        zoomControl: false, attributionControl: false, dragging: false,
        scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false,
        keyboard: false, tap: false, touchZoom: false
      });
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
      const color = railColor((railIds(d)[0]) || d.railroad);
      const line = L.polyline(pts, { color: color, weight: 4, opacity: 0.9 }).addTo(map);
      pts.forEach(function (p) {
        L.circleMarker(p, { radius: 5, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1 }).addTo(map);
      });
      try { map.fitBounds(line.getBounds(), { padding: [16, 16], maxZoom: 12 }); } catch (_) {}
      maps.push(map);
      setTimeout(function () { try { map.invalidateSize(); } catch (_) {} }, 80);
    }
    function tripCard(d) {
      const ids = railIds(d);
      const badges = (ids.length ? ids : ['trip']).map(function (id) {
        return '<span class="trip-rail-badge" style="background:' + railColor(id) + '">' + esc(railLabel(id)) + '</span>';
      }).join('');
      const train = d.trainNumber ? '<span class="trip-train-chip">Train ' + esc(d.trainNumber) + '</span>' : '';
      const miles = formatMiles(d.miles);
      const stock = String(d.rollingStock || '').trim();
      const segs = Array.isArray(d.segments) ? d.segments : [];
      let chips = '';
      if (segs.length > 1) {
        chips = segs.map(function (s, i) {
          return '<span class="trip-seg-chip">' + (i + 1) + '. ' +
            esc(railLabel(s.railroad)) + ' · ' +
            esc(s.originName || s.originStationId || '') + ' → ' +
            esc(s.destName || s.destStationId || '') + '</span>';
        }).join('');
      }
      return '<article class="trip-log-row" data-trip-id="' + esc(d.id || '') + '">' +
        '<div class="trip-log-row-top"><div class="trip-log-row-rail">' + badges + train + '</div></div>' +
        '<div class="trip-log-row-route">' + routeHtml(d) + '</div>' +
        '<div class="trip-log-row-meta">' + esc(tripWhen(d)) + '</div>' +
        '<div class="trip-log-row-facts">' +
          (miles ? '<span>' + esc(miles) + '</span>' : '') +
          (stock ? '<span>Stock #' + esc(stock) + '</span>' : '') +
        '</div>' + chips +
        '<div class="trip-log-row-map" data-trip-map></div>' +
      '</article>';
    }
    function sectionHtml(title, trips) {
      if (!trips.length) return '';
      return '<section class="section"><h2>' + esc(title) + '</h2>' +
        trips.map(tripCard).join('') + '</section>';
    }
    function renderProfile(profile, trips) {
      const name = profile.displayName || profile.username || 'Railfan';
      document.title = name + ' · MyTrips';
      window.__rrProfileShare = location.href.split('#')[0];
      trips = (trips || []).filter(function (t) { return !t.hiddenPublic; });
      const upcoming = trips.filter(function (t) { return tripStartMs(t) >= Date.now(); }).sort(function (a, b) { return tripStartMs(a) - tripStartMs(b); });
      const past = trips.filter(function (t) { return tripStartMs(t) < Date.now(); });
      const photo = profile.photoURL
        ? '<img class="avatar" src="' + esc(profile.photoURL) + '" alt="' + esc(name) + '" referrerpolicy="no-referrer">'
        : '<div class="avatar-fallback">' + esc(String(name).charAt(0).toUpperCase()) + '</div>';
      const list = (upcoming.length || past.length)
        ? sectionHtml('Upcoming trips', upcoming) + sectionHtml('Past trips', past)
        : '<p class="empty-trips">No public trips yet.</p>';
      document.getElementById('app').innerHTML =
        '<div class="profile-head">' + photo +
        '<div class="profile-meta">' +
        '<h1>' + esc(name) + '</h1>' +
        '<div class="handle">@' + esc(profile.username || '') + '</div>' +
        '<div class="brand-note">MyTrips</div>' +
        '</div></div>' + list +
        '<p class="footer-note">Public trip log on <a href="https://railroadradar.com/mytrips/">MyTrips</a></p>';
      Array.prototype.forEach.call(document.querySelectorAll('[data-trip-map]'), function (el, i) {
        const trip = upcoming.concat(past)[i];
        if (trip) paintMap(el, trip);
      });
    }
    async function loadMbtaStops() {
      try {
        const res = await fetch('https://railroadradar-proxy.railroadradar.workers.dev/api/mbta/stops?filter[location_type]=0&page[limit]=2000');
        const json = await res.json();
        (json.data || []).forEach(function (s) {
          const a = s.attributes || {};
          if (s.id && a.latitude != null && a.longitude != null) {
            mbtaStops[s.id] = [Number(a.latitude), Number(a.longitude)];
          }
        });
      } catch (_) {}
    }
    async function main() {
      const username = usernameFromLoc();
      if (!username) {
        showState('Profile not found', 'No username was provided in this link.');
        return;
      }
      let db;
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.firestore();
      } catch (e) {
        showState('Could not load', 'Firebase failed to start. Try again later.');
        return;
      }
      const lower = username.toLowerCase();
      let unameSnap;
      try { unameSnap = await db.collection('usernames').doc(lower).get(); }
      catch (e) { showState('Could not load', 'Unable to look up this profile right now.'); return; }
      if (!unameSnap.exists) {
        showState('Profile not found', 'We couldn’t find a public profile for that username.');
        return;
      }
      const unameData = unameSnap.data() || {};
      const uid = unameData.uid;
      if (!uid) {
        showState('Profile not found', 'We couldn’t find a public profile for that username.');
        return;
      }
      let profileSnap;
      try { profileSnap = await db.collection('publicProfiles').doc(uid).get(); }
      catch (e) { showState('Could not load', 'Unable to load this profile right now.'); return; }
      if (!profileSnap.exists) {
        showState('This profile isn’t public', 'This user has not published a public MyTrips profile.');
        return;
      }
      const profile = Object.assign({ uid: uid }, profileSnap.data() || {});
      if (!profile.username) profile.username = unameData.username || username;
      await loadMbtaStops();
      let trips = [];
      try {
        const tripSnap = await db.collection('tripLogs').where('userId', '==', uid).orderBy('startTime', 'desc').limit(50).get();
        trips = tripSnap.docs.map(function (doc) { return Object.assign({ id: doc.id }, doc.data() || {}); });
      } catch (e) {
        try {
          const tripSnap = await db.collection('tripLogs').where('userId', '==', uid).limit(50).get();
          trips = tripSnap.docs.map(function (doc) { return Object.assign({ id: doc.id }, doc.data() || {}); });
          trips.sort(function (a, b) { return tripStartMs(b) - tripStartMs(a); });
        } catch (e2) { trips = []; }
      }
      renderProfile(profile, trips);
    }
    main();
  })();
  </script>
</body>
</html>
