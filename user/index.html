    .state h1 { color: #07093e; margin: 0 0 8px; font-size: 22px; }
    .state p { margin: 0 0 18px; line-height: 1.45; }
    .profile-head {
      display: flex; gap: 16px; align-items: center; margin-bottom: 28px;
      background: #f6f7fb; border: 1px solid #e2e6ef; padding: 18px 20px;
    }
    .avatar, .avatar-fallback {

    .avatar-fallback {

    .section h2 {
      margin: 0 0 14px; color: #07093e; font-size: 18px; font-weight: 800;
    }
    /* Solid full-color trip cards (match My Trips prefs) */
    .trip-log-row {
      background: var(--rr-trip-rail, #07093e); color: #fff; border: none; border-radius: 14px;
      padding: 16px; margin: 0 0 16px; box-shadow: 0 6px 20px rgba(15, 23, 42, 0.18);
    }
    .trip-log-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .trip-log-row-rail { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .trip-rail-badge, .trip-train-chip {
      display: inline-block; color: #07093e; background: #fff;
      font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; letter-spacing: .02em;
    }
    .trip-train-chip { background: rgba(255,255,255,0.92); }
    .trip-log-row-route { font-size: 17px; font-weight: 800; color: #fff; margin: 0 0 6px; }
    .trip-log-row-meta { color: rgba(255,255,255,0.88); font-size: 13px; margin-bottom: 8px; }
    .trip-log-row-facts {
      display: flex; flex-wrap: wrap; gap: 10px; color: #fff; font-size: 13px; font-weight: 700; margin-bottom: 10px;
    }
    .trip-log-row-map {
      margin-top: 10px; height: 160px; width: 100%; border-radius: 10px;
      background: #0b0d1a; overflow: hidden; position: relative; z-index: 0;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.12);
    }

    }
    .trip-log-row-map.is-loading::after {
      content: 'Loading map…';
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;

      }
      el.classList.remove('is-empty');
      el.classList.add('is-loading');
      el.innerHTML = '';
      const segs = rrTripSegmentsForMap(data).map(function (s) { return rrResolveTripSegmentGeom(s, data); });
      const hasAny = segs.some(function (g) { return g.origin || g.dest || (g.line && g.line.length >= 2); });
      if (!hasAny) {
        el.classList.remove('is-loading');
        el.classList.add('is-empty');
        return;
      }
      let map;
      try {
        map = L.map(el, {
          zoomControl: false, attributionControl: false, dragging: false,
          scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false,
          keyboard: false, tap: false, touchZoom: false, closePopupOnClick: false
        });
        rrTripMapTileLayer({ maxZoom: 20, opacity: 1 }).addTo(map);
      } catch (e) {
        el.classList.remove('is-loading');
        el.classList.add('is-empty');
        return;
      }
      const bounds = [];
      const odOnly = tripIsSpecialMove(data);
      segs.forEach(function (g) {
        if (odOnly) return;
        if (g.line && g.line.length >= 2) {
          try {
            L.polyline(g.line, { color: g.color || '#07093e', weight: 5, opacity: 1, lineJoin: 'round', lineCap: 'round' }).addTo(map);
            g.line.forEach(function (p) { bounds.push(p); });
          } catch (_) {}
        } else if (g.origin && g.dest) {
          try {
            L.polyline([g.origin, g.dest], { color: g.color || '#07093e', weight: 3, opacity: 1, dashArray: '6 6' }).addTo(map);
            bounds.push(g.origin, g.dest);
          } catch (_) {}
        }
      });
      (function paintTripEndpointMarkers() {
        function llKey(ll) {
          if (!ll) return '';
          const lat = Array.isArray(ll) ? Number(ll[0]) : Number(ll.lat);
          const lng = Array.isArray(ll) ? Number(ll[1]) : Number(ll.lng);
          if (!isFinite(lat) || !isFinite(lng)) return '';
          return lat.toFixed(5) + ',' + lng.toFixed(5);
        }
        function addOdMarker(ll, isOrigin) {
          if (!ll) return;
          try {
            L.circleMarker(ll, {
              radius: 5, color: '#1a2030', weight: 2,
              fillColor: isOrigin ? '#1a7f37' : '#b00020', fillOpacity: 1
            }).addTo(map);
            bounds.push(ll);
          } catch (_) {}
        }
        function addTransferMarker(ll) {
          if (!ll) return;
          try {
            L.circleMarker(ll, {
              radius: 3.5, color: '#07093e', weight: 2, fillColor: '#fff', fillOpacity: 1
            }).addTo(map);
            bounds.push(ll);
          } catch (_) {}
        }
        if (!segs.length) return;
        if (segs.length === 1) {
          addOdMarker(segs[0].origin, true);
          addOdMarker(segs[0].dest, false);
          return;
        }
        addOdMarker(segs[0].origin, true);
        const endKeys = Object.create(null);
        const ok = llKey(segs[0].origin); if (ok) endKeys[ok] = 1;
        const dk = llKey(segs[segs.length - 1].dest); if (dk) endKeys[dk] = 1;
        const seen = Object.create(null);
        for (let i = 0; i < segs.length - 1; i++) {
          const ll = segs[i].dest || (segs[i + 1] && segs[i + 1].origin);
          const k = llKey(ll);
          if (!k || endKeys[k] || seen[k]) continue;
          seen[k] = 1;
          addTransferMarker(ll);
        }
        addOdMarker(segs[segs.length - 1].dest, false);
      })();
      try {
        if (bounds.length >= 2) map.fitBounds(bounds, { padding: [18, 18], maxZoom: 13 });
        else if (bounds.length === 1) map.setView(bounds[0], 11);
        else map.setView([42.3, -71.1], 7);
      } catch (_) {
        try { map.setView([42.3, -71.1], 7); } catch (__) {}
      }
      el.classList.remove('is-loading');
      maps.push(map);
      setTimeout(function () { try { map.invalidateSize(false); } catch (_) {} }, 50);
      setTimeout(function () { try { map.invalidateSize(false); } catch (_) {} }, 250);
    }
    function scheduleTripLogMiniMap(el, data) {
      if (!el) return;
      el.classList.add('is-loading');
      el.classList.remove('is-empty');
      rrEnsureTripGeomsShapes(data).then(function () {
        if (!el.isConnected) return;
        paintTripLogMiniMap(el, data);
      }).catch(function () {
        if (!el.isConnected) return;
        paintTripLogMiniMap(el, data);
      });
    }

    function tripCard(d) {
      const ids = railIds(d);
      const primary = (ids[0] || d.railroad || 'trip');
      const badges = (ids.length ? ids : ['trip']).map(function (id) {
        return '<span class="trip-rail-badge">' + esc(railLabel(id)) + '</span>';
      }).join('');
      const train = d.trainNumber ? '<span class="trip-train-chip">Train ' + esc(d.trainNumber) + '</span>' : '';
      const miles = formatMiles(d.miles);
      const stock = String(d.rollingStock || '').trim();
      const segs = Array.isArray(d.segments) ? d.segments : [];
      let chips = '';
      if (segs.length > 1) {
        chips = segs.map(function (s, i) {
          return '<span class="trip-seg-chip">' + (i + 1) + '. ' +
            esc(railLabel(s.railroad)) + ' · ' +
            esc(s.originName || s.originStationId || '') + ' → ' +
            esc(s.destName || s.destStationId || '') + '</span>';
        }).join('');
      }
      return '<article class="trip-log-row" data-trip-id="' + esc(d.id || '') + '" data-rail-accent style="--rr-trip-rail:' + railColor(primary) + '">' +
        '<div class="trip-log-row-top"><div class="trip-log-row-rail">' + badges + train + '</div></div>' +
        '<div class="trip-log-row-route">' + routeHtml(d) + '</div>' +
        '<div class="trip-log-row-meta">' + esc(tripWhen(d)) + '</div>' +
        '<div class="trip-log-row-facts">' +
          (miles ? '<span>' + esc(miles) + '</span>' : '') +
          (stock ? '<span>Stock #' + esc(stock) + '</span>' : '') +
        '</div>' + chips +
        '<div class="trip-log-row-map is-loading" data-trip-map></div>' +
      '</article>';
    }
    function sectionHtml(title, trips) {
      if (!trips.length) return '';
      return '<section class="section"><h2>' + esc(title) + '</h2>' +
        trips.map(tripCard).join('') + '</section>';
    }
    function renderProfile(profile, trips) {
      const name = profile.displayName || profile.username || 'Railfan';
      document.title = name + ' | MyTrips';
      window.__rrProfileShare = location.href.split('#')[0];
      const upcoming = trips.filter(function (t) { return tripStartMs(t) >= Date.now(); }).sort(function (a, b) { return tripStartMs(a) - tripStartMs(b); });
      const past = trips.filter(function (t) { return tripStartMs(t) < Date.now(); });
      const photo = profile.photoURL
        ? '<img class="avatar" src="' + esc(profile.photoURL) + '" alt="' + esc(name) + '" referrerpolicy="no-referrer">'
        : '<div class="avatar-fallback">' + esc(String(name).charAt(0).toUpperCase()) + '</div>';
      const list = (upcoming.length || past.length)
        ? sectionHtml('Upcoming trips', upcoming) + sectionHtml('Past trips', past)
        : '<p class="empty-trips">No public trips yet.</p>';
      document.getElementById('app').innerHTML =
        '<div class="profile-head">' + photo +
        '<div class="profile-meta">' +
        '<h1>' + esc(name) + '</h1>' +
        '<div class="handle">@' + esc(profile.username || '') + '</div>' +
        '<div class="brand-note">MyTrips</div>' +
        '</div></div>' + list +
        '<p class="footer-note">Public trip log on <a href="/mytrips/">MyTrips</a></p>';
      const ordered = upcoming.concat(past);
      Array.prototype.forEach.call(document.querySelectorAll('[data-trip-map]'), function (el, i) {
        const trip = ordered[i];
        if (trip) scheduleTripLogMiniMap(el, trip);
      });
    }
    async function main() {
      const username = usernameFromLoc();
      if (!username) {
        showState('Profile not found', 'No username was provided in this link.');
        return;
      }
      let db;
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.firestore();
      } catch (e) {
        showState('Could not load', 'Firebase failed to start. Try again later.');
        return;
      }
      const lower = username.toLowerCase();
      let unameSnap;
      try { unameSnap = await db.collection('usernames').doc(lower).get(); }
      catch (e) { showState('Could not load', 'Unable to look up this profile right now.'); return; }
      if (!unameSnap.exists) {
        showState('Profile not found', 'We couldn’t find a public profile for that username.');
        return;
      }
      const unameData = unameSnap.data() || {};
      const uid = unameData.uid;
      if (!uid) {
        showState('Profile not found', 'We couldn’t find a public profile for that username.');
        return;
      }
      let profileSnap;
      try { profileSnap = await db.collection('publicProfiles').doc(uid).get(); }
      catch (e) { showState('Could not load', 'Unable to load this profile right now.'); return; }
      if (!profileSnap.exists) {
        showState('This profile isn’t public', 'This user has not published a public MyTrips profile.');
        return;
      }
      const profile = Object.assign({ uid: uid }, profileSnap.data() || {});
      if (!profile.username) profile.username = unameData.username || username;
      let trips = [];
      try {
        const tripSnap = await db.collection('tripLogs').where('userId', '==', uid).where('hiddenPublic', '==', false).orderBy('startTime', 'desc').limit(50).get();
        trips = tripSnap.docs.map(function (doc) { return Object.assign({ id: doc.id }, doc.data() || {}); });
      } catch (e) {
        try {
          const tripSnap = await db.collection('tripLogs').where('userId', '==', uid).where('hiddenPublic', '==', false).limit(50).get();
          trips = tripSnap.docs.map(function (doc) { return Object.assign({ id: doc.id }, doc.data() || {}); });
          trips.sort(function (a, b) { return tripStartMs(b) - tripStartMs(a); });
        } catch (e2) { trips = []; }
      }
      // Amtrak miles saved before the stop-chain fix are shown corrected (assets/js/trip-miles.js).
      try {
        const fix = window.rrTripMilesFix;
        if (fix) {
          const lids = [];
          trips.forEach(function (t) { fix.shapesNeeded(t).forEach(function (l) { if (lids.indexOf(l) < 0) lids.push(l); }); });
          if (lids.length) {
            await Promise.race([
              Promise.all(lids.map(function (l) { return Promise.resolve(ensureTripShapesForMiles('amtrak', l)).catch(function () { return null; }); })),
              new Promise(function (r) { setTimeout(r, 5000); })
            ]);
          }
          trips = trips.map(function (t) { const c = fix.correctedTrip(t); return c ? Object.assign({}, t, c) : t; });
        }
      } catch (_) {}
      renderProfile(profile, trips);
    }
    main();
  })();
  </script>
