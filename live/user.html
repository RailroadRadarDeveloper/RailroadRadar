<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live tracker | RailroadRadar</title>
  <script>
    (function () {
      try {
        var p = localStorage.getItem('rr_theme');
        var dark = p === 'dark' || (p !== 'light' && !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
        if (dark) document.documentElement.classList.add('rr-theme-dark');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --rr-live-bg: #07093e;
      --rr-live-ink: #fff;
      --rr-live-card: #fff;
      --rr-live-card-ink: #0b0b3b;
      --rr-live-muted: rgba(255,255,255,.78);
      --rr-live-map: #d7dde6;
      --rr-live-rail: #b00020;
      --rr-live-ok: #1faa59;
      --rr-live-warn: #c45c00;
    }
    html.rr-theme-dark {
      --rr-live-bg: #07093e;
      --rr-live-ink: #f2f4ff;
      --rr-live-card: #151a52;
      --rr-live-card-ink: #f2f4ff;
      --rr-live-muted: rgba(242,244,255,.78);
      --rr-live-map: #0b0f2e;
    }
    html, body { margin: 0; height: 100%; background: var(--rr-live-bg); color: var(--rr-live-ink); font-family: system-ui, -apple-system, sans-serif; }
    header {
      height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px;
      background: var(--rr-live-bg); position: relative; z-index: 10000; min-width: 0;
    }
    header a { color: #fff; font-weight: 800; text-decoration: none; display: flex; align-items: center; flex: 0 0 auto; }
    header img { height: 40px; width: auto; display: block; }
    .rr-live-head-main { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
    #status {
      font-size: 14px; font-weight: 800; line-height: 1.2; white-space:nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    }
    .rr-live-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 18px; }
    .rr-badge {
      display: inline-flex; align-items: center; gap: 5px; border-radius: 4px; padding: 2px 7px;
      font: 700 11px/1.2 sans-serif; letter-spacing: .01em;
    }
    .rr-badge-live { background: var(--rr-live-ok); color: #fff; }
    .rr-badge-live::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
    .rr-badge-stale { background: var(--rr-live-warn); color: #fff; }
    .rr-badge-ended { background: rgba(255,255,255,.18); color: #fff; }
    #live-share-banner {
      position: fixed; top: 60px; left: 0; right: 0; z-index: 10040;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: #b00020; color: #fff; padding: 10px 16px; font: 700 14px/1.3 sans-serif;
    }
    #live-share-banner[hidden] { display: none; }
    #live-share-banner button { background: #fff; color: #b00020; border: 0; border-radius: 999px; padding: 6px 12px; font-weight: 800; cursor: pointer; }
    #live-stats {
      position: fixed; top: 60px; left: 0; right: 0; z-index: 9000;
      display: flex; flex-wrap: wrap; gap: 10px 18px; padding: 10px 16px;
      background: var(--rr-live-bg); color: var(--rr-live-ink); font-size: 14px; font-weight: 700;
    }
    #live-stats[hidden], #map[hidden] { display: none !important; }
    #live-updated { font-weight: 600; color: var(--rr-live-muted); }
    #live-stale {
      flex: 1 0 100%; margin: 0; padding: 8px 10px; border-radius: 4px;
      background: rgba(196,92,0,.18); color: #ffd7b0; font-weight: 700; font-size: 13px; line-height: 1.35;
      border-left: 4px solid var(--rr-live-warn);
    }
    #live-stale[hidden] { display: none; }
    #map { position: fixed; top: 104px; left: 0; right: 0; bottom: 0; background: var(--rr-live-map); }
    body:has(#live-share-banner:not([hidden]), #rr-live-bar:not([hidden])) #live-stats { top: 104px; }
    body:has(#live-share-banner:not([hidden]), #rr-live-bar:not([hidden])) #map { top: 148px; }
    html body:has(#rr-live-bar:not([hidden])) #live-stats { top: calc(60px + var(--rr-live-bar-h, 44px)); }
    html body:has(#rr-live-bar:not([hidden])) #map { top: calc(104px + var(--rr-live-bar-h, 44px)); }
    body.rr-live-has-stale #map { top: calc(148px); }
    html body.rr-live-has-stale:has(#rr-live-bar:not([hidden])) #map { top: calc(148px + var(--rr-live-bar-h, 44px)); }
    #ended-card {
      position: fixed; inset: 60px 0 0 0; z-index: 9500; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: var(--rr-live-bg);
    }
    #ended-card[hidden] { display: none; }
    .rr-ended-inner {
      width: min(420px, 100%); background: var(--rr-live-card); color: var(--rr-live-card-ink);
      border-radius: 4px; padding: 22px 20px; box-shadow: 0 10px 30px rgba(0,0,0,.28);
      border-left: 4px solid var(--rr-live-rail);
    }
    .rr-ended-inner h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.25; }
    .rr-ended-inner p { margin: 0; font-size: 14px; line-height: 1.45; opacity: .9; }
    .rr-ended-inner a { color: inherit; font-weight: 800; }
    .rr-live-train { background: transparent !important; border: 0 !important; }
    .rr-live-pin {
      position: relative; width: 76px; height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.45));
    }
    .rr-live-pin.is-stale { opacity: .45; filter: grayscale(.35) drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
    .rr-live-halo {
      position: absolute; top: 10px; left: 50%; width: 44px; height: 44px; margin-left: -22px;
      border-radius: 50%; background: rgba(7,9,62,.22); box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 0 14px rgba(7,9,62,.35);
      pointer-events: none;
    }
    html.rr-theme-dark .rr-live-halo {
      background: rgba(255,255,255,.16); box-shadow: 0 0 0 3px rgba(7,9,62,.75), 0 0 16px rgba(0,0,0,.45);
    }
    .rr-live-pin img {
      position: relative; z-index: 1; width: 68px; height: 30px; object-fit: contain; display: block; margin-top: 17px;
    }
    .rr-live-pin-label {
      position: relative; z-index: 2; margin-top: 4px; max-width: 120px; padding: 2px 6px; border-radius: 4px;
      background: rgba(7,9,62,.88); color: #fff; font: 700 11px/1.2 sans-serif;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.35);
    }
    html.rr-theme-dark .rr-live-pin-label { background: rgba(21,26,82,.95); }
    .gtfs-shape-line { pointer-events: none; }
    @media (max-width: 420px) {
      header { padding: 0 10px 0 12px; gap: 8px; }
      header img { height: 34px; }
      #status { font-size: 13px; }
      #live-stats { gap: 8px 14px; padding: 8px 12px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/"><img src="/assets/logo.png" alt="RailroadRadar"></a>
    <div class="rr-live-head-main">
      <span id="status">Loading tracker</span>
      <div class="rr-live-badges" id="live-badges" hidden></div>
    </div>
  </header>
  <div id="live-share-banner" hidden>Sharing live location <button type="button" id="live-share-stop">Stop sharing</button></div>
  <div id="live-stats" hidden>
    <span id="live-speed">Speed</span>
    <span id="live-place">Location</span>
    <span id="live-updated">Updated</span>
    <p id="live-stale" hidden role="status"></p>
  </div>
  <div id="map" hidden></div>
  <div id="ended-card" hidden>
    <div class="rr-ended-inner">
      <h1 id="ended-title">This trip has ended</h1>
      <p id="ended-detail">The live share is no longer active.</p>
      <p style="margin-top:14px"><a href="/">Back to RailroadRadar</a></p>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var shareCode = (params.get('s') || '').trim().toLowerCase();
      var legacyUid = (params.get('uid') || '').trim();
      var HEARTBEAT_MS = 60 * 1000;
      var STALE_WARN_MS = 150 * 1000; // ~2.5 heartbeats
      var STALE_DROP_MS = 30 * 60 * 1000;
      var TILE_LIGHT = 'https://railroadradar-proxy.railroadradar.workers.dev/api/mapbox/styles/v1/northeastamtrakrailfanalt/ckyq285h5219a14mpql9jt2r7/tiles/256/{z}/{x}/{y}';
      var TILE_DARK = 'https://railroadradar-proxy.railroadradar.workers.dev/api/mapbox/styles/v1/mapbox/dark-v11/tiles/256/{z}/{x}/{y}';
      var SHAPE_FILES = [
        { id: 'mbta', file: '/assets/shapes/mbta.json', fallback: '#800080' },
        { id: 'mnr', file: '/assets/shapes/mnr.json', fallback: '#EE0034' },
        { id: 'lirr', file: '/assets/shapes/lirr.json', fallback: '#0055A4' },
        { id: 'amtrak', file: '/assets/shapes/amtrak.json', fallback: '#003366' },
        { id: 'njt', file: '/assets/shapes/njt.json', fallback: '#FF671F' },
        { id: 'ctrail', file: '/assets/shapes/ctrail.json', fallback: '#EA0D2A' },
        { id: 'marc', file: '/assets/shapes/marc.json', fallback: '#FF8000' },
        { id: 'via', file: '/assets/shapes/via.json', fallback: '#FFCC00' }
      ];

      firebase.initializeApp({
        apiKey: 'AIzaSyBCXgIwkKHBrNfs4-0T0L9LQNb6GP-37Qs',
        authDomain: 'railroadradar-accounts.firebaseapp.com',
        projectId: 'railroadradar-accounts',
        storageBucket: 'railroadradar-accounts.firebasestorage.app',
        messagingSenderId: '896370923309',
        appId: '1:896370923309:web:594b0a20d3b1c6822e65a4'
      });

      var map = null, baseLayer = null, marker = null, shapesLoaded = false;
      var shareIsLive = false, lastDoc = null, tickTimer = null;
      var placeKey = '', placeCache = Object.create(null), placeQueue = Promise.resolve(), placeLastAt = 0;

      var elStatus = document.getElementById('status');
      var elBadges = document.getElementById('live-badges');
      var elStats = document.getElementById('live-stats');
      var elSpeed = document.getElementById('live-speed');
      var elPlace = document.getElementById('live-place');
      var elUpdated = document.getElementById('live-updated');
      var elStale = document.getElementById('live-stale');
      var elMap = document.getElementById('map');
      var elEnded = document.getElementById('ended-card');
      var elEndedTitle = document.getElementById('ended-title');
      var elEndedDetail = document.getElementById('ended-detail');
      var elBanner = document.getElementById('live-share-banner');

      function isDark() {
        return document.documentElement.classList.contains('rr-theme-dark');
      }

      function ensureMap() {
        if (map) return map;
        elMap.hidden = false;
        map = L.map('map', { zoomControl: true, attributionControl: true });
        baseLayer = L.tileLayer(isDark() ? TILE_DARK : TILE_LIGHT, {
          attribution: '© Mapbox © OpenStreetMap contributors',
          maxZoom: 20
        }).addTo(map);
        map.setView([42.36, -71.06], 8);
        loadRouteLines();
        return map;
      }

      function loadRouteLines() {
        if (shapesLoaded || !map) return;
        shapesLoaded = true;
        SHAPE_FILES.forEach(function (ag) {
          fetch(ag.file).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          }).then(function (data) {
            (data.routes || []).forEach(function (rt) {
              var color = rt.color || ag.fallback;
              (rt.polylines || []).forEach(function (pl) {
                if (!pl || pl.length < 2) return;
                L.polyline(pl, {
                  color: color, weight: 3, opacity: 0.65, interactive: false, className: 'gtfs-shape-line'
                }).addTo(map);
              });
            });
          }).catch(function () {});
        });
      }

      function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, function (c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
      }

      function icon(heading, src, title, stale) {
        var rot = isFinite(Number(heading)) ? Number(heading) : 90;
        if (!/^\/assets\/[A-Za-z0-9-]+\.png$/.test(src || '')) src = '/assets/hsp46.png';
        var label = escapeHtml(String(title || 'Live trip').slice(0, 40));
        var html = '<div class="rr-live-pin' + (stale ? ' is-stale' : '') + '">' +
          '<span class="rr-live-halo" aria-hidden="true"></span>' +
          '<img src="' + src + '" alt="" style="transform:rotate(' + rot + 'deg)">' +
          '<span class="rr-live-pin-label">' + label + '</span></div>';
        return L.divIcon({
          className: 'rr-live-train',
          html: html,
          iconSize: [76, 70],
          iconAnchor: [38, 32]
        });
      }

      function roundCoord(n) {
        return Math.round(Number(n) * 1000) / 1000;
      }

      function placeFor(lat, lon) {
        var rLat = roundCoord(lat), rLon = roundCoord(lon);
        var key = rLat.toFixed(3) + ',' + rLon.toFixed(3);
        if (key === placeKey) return;
        if (placeCache[key]) {
          placeKey = key;
          elPlace.textContent = placeCache[key];
          return;
        }
        placeKey = key;
        placeQueue = placeQueue.then(function () {
          var wait = Math.max(0, 1100 - (Date.now() - placeLastAt));
          return new Promise(function (resolve) { setTimeout(resolve, wait); });
        }).then(function () {
          if (placeKey !== key) return null;
          placeLastAt = Date.now();
          return fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + rLat + '&lon=' + rLon, {
            headers: { 'Accept': 'application/json' }
          });
        }).then(function (r) {
          if (!r) return null;
          return r.json();
        }).then(function (data) {
          if (!data || placeKey !== key) return;
          var a = data.address || {};
          var town = a.village || a.town || a.city || a.hamlet || a.municipality || '';
          var state = a.state || '';
          var text = town && state ? (town + ', ' + state) : (data.display_name || 'Location unavailable');
          placeCache[key] = text;
          elPlace.textContent = text;
        }).catch(function () {
          if (placeKey === key) elPlace.textContent = 'Location unavailable';
        });
      }

      function agoLabel(ms) {
        var sec = Math.max(0, Math.round(ms / 1000));
        if (sec < 20) return 'Updated just now';
        if (sec < 60) return 'Updated ' + sec + 's ago';
        var min = Math.round(sec / 60);
        if (min < 60) return 'Updated ' + min + ' min ago';
        var hrs = Math.floor(min / 60);
        var rem = min % 60;
        return 'Updated ' + hrs + 'h' + (rem ? (' ' + rem + 'm') : '') + ' ago';
      }

      function showEnded(title, detail) {
        shareIsLive = false;
        updateStopBanner();
        elStats.hidden = true;
        elMap.hidden = true;
        elBadges.hidden = true;
        document.body.classList.remove('rr-live-has-stale');
        if (marker && map) { try { map.removeLayer(marker); } catch (e) {} marker = null; }
        elStatus.textContent = title || 'Trip ended';
        elEndedTitle.textContent = title || 'This trip has ended';
        elEndedDetail.textContent = detail || 'The live share is no longer active.';
        elEnded.hidden = false;
      }

      function showLiveUi() {
        elEnded.hidden = true;
        elStats.hidden = false;
        elBadges.hidden = false;
        ensureMap();
      }

      function updateStopBanner() {
        var user = firebase.auth().currentUser;
        var localBar = document.getElementById('rr-live-bar');
        var ownerUid = lastDoc && lastDoc.uid;
        elBanner.hidden = !(shareIsLive && user && ownerUid && user.uid === ownerUid && !(localBar && !localBar.hidden));
      }
      firebase.auth().onAuthStateChanged(updateStopBanner);
      setInterval(updateStopBanner, 2000);
      document.getElementById('live-share-stop').onclick = function () {
        if (!lastDoc || !lastDoc.uid) return;
        var code = shareCode || lastDoc.shareCode;
        var ref = code
          ? firebase.firestore().collection('specialMoveShares').doc(code)
          : firebase.firestore().collection('specialMoveShares').doc(lastDoc.uid);
        ref.delete();
      };

      function paint(d) {
        lastDoc = d;
        var now = Date.now();
        var updated = Number(d.updatedAt) || 0;
        var age = updated ? (now - updated) : Infinity;
        var expired = !(d.active === true && Number(d.expiresAt) > now);
        var dropped = !updated || age > STALE_DROP_MS;
        if (expired || dropped || !isFinite(Number(d.lat)) || !isFinite(Number(d.lon))) {
          var lastTxt = updated ? agoLabel(now - updated).replace(/^Updated /, 'Last update ') : '';
          showEnded(
            'This trip has ended',
            lastTxt
              ? ('Sharing stopped. ' + lastTxt + '.')
              : 'The live share is no longer active.'
          );
          return;
        }

        showLiveUi();
        shareIsLive = true;
        updateStopBanner();

        var title = String(d.title || 'Live trip');
        document.title = title + ' | RailroadRadar';
        elStatus.textContent = title;

        var stale = age > STALE_WARN_MS;
        elBadges.innerHTML = stale
          ? '<span class="rr-badge rr-badge-stale">Signal may be lost</span>'
          : '<span class="rr-badge rr-badge-live">Live</span>';

        var mph = d.speed == null ? null : Math.round(Number(d.speed) * 2.23694);
        elSpeed.textContent = mph == null || !isFinite(mph) ? 'Speed unavailable' : ('Speed ' + Math.max(0, mph) + ' mph');
        placeFor(Number(d.lat), Number(d.lon));
        elUpdated.textContent = agoLabel(age);

        if (stale) {
          var mins = Math.max(1, Math.round(age / 60000));
          elStale.hidden = false;
          elStale.textContent = 'No update for ' + mins + ' min, signal may be lost';
          document.body.classList.add('rr-live-has-stale');
        } else {
          elStale.hidden = true;
          elStale.textContent = '';
          document.body.classList.remove('rr-live-has-stale');
        }

        var ll = [Number(d.lat), Number(d.lon)];
        var ic = icon(d.heading, d.icon, title, stale);
        if (!marker) {
          marker = L.marker(ll, { icon: ic, zIndexOffset: 2000 }).addTo(map);
          map.setView(ll, 14);
        } else {
          marker.setLatLng(ll);
          marker.setIcon(ic);
        }
      }

      function tick() {
        if (!lastDoc || elEnded.hidden === false) return;
        paint(lastDoc);
      }

      if (legacyUid && !shareCode) {
        showEnded(
          'This link format has changed',
          'Ask the sharer for a new live link. Older links that used an account id no longer open a live trip, so a past share cannot show a later one.'
        );
      } else if (!shareCode || !/^[a-z0-9]{8,20}$/.test(shareCode)) {
        showEnded(
          'Live link not found',
          'This live link is missing or not valid. Check the link, or ask the sharer for a new one.'
        );
      } else {
        elStatus.textContent = 'Loading tracker';
        firebase.firestore().collection('specialMoveShares').doc(shareCode).onSnapshot(function (doc) {
          var d = doc.exists ? (doc.data() || {}) : null;
          if (!d) {
            showEnded('This trip has ended', 'The live share is no longer active.');
            return;
          }
          paint(d);
          if (!tickTimer) tickTimer = setInterval(tick, 15000);
        }, function () {
          showEnded('This trip has ended', 'The live share is no longer active.');
        });
      }
    })();
  </script>
  <script src="/assets/js/live-share-bar.js?v=69c925021a"></script>
  <script src="/assets/js/site-nav.js?v=ce097ac69e" defer></script>
</body>
</html>
