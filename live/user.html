<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live tracker · RailroadRadar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { margin: 0; height: 100%; background: #07093e; color: #fff; font-family: sans-serif; }
    header { height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; background: #07093e; position: relative; z-index: 10000; }
    header a { color: #fff; font-weight: 800; text-decoration: none; display: flex; align-items: center; }
    header img { height: 40px; width: auto; display: block; }
    #rr-live-bar, #live-share-banner { position: fixed; top: 60px; left: 0; right: 0; z-index: 10040; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #b00020; color: #fff; padding: 10px 16px; font: 700 14px/1.3 sans-serif; }
    #live-stats { position: fixed; top: 104px; left: 0; right: 0; z-index: 9000; display: flex; gap: 18px; padding: 10px 16px; background: #07093e; color: #fff; font-size: 14px; font-weight: 700; }
    #map { position: fixed; top: 148px; left: 0; right: 0; bottom: 0; background: #d7dde6; }
    #status { font-size: 14px; }
    .rr-live-train { background: transparent !important; border: 0 !important; }
  </style>
</head>
<body>
  <header>
    <a href="/"><img src="/assets/logo.png" alt="RailroadRadar"></a>
    <span id="status">Loading tracker</span>
  </header>
  <div id="live-share-banner">Sharing live location <button type="button" id="live-share-stop" style="background:#fff;color:#b00020;border:0;border-radius:999px;padding:6px 10px;font-weight:800;">Stop sharing</button></div>
  <div id="live-stats"><span id="live-speed">Speed --</span><span id="live-place">Location --</span></div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script>
    var uid = new URLSearchParams(location.search).get('uid') || '';
    firebase.initializeApp({
      apiKey: 'AIzaSyBCXgIwkKHBrNfs4-0T0L9LQNb6GP-37Qs',
      authDomain: 'railroadradar-accounts.firebaseapp.com',
      projectId: 'railroadradar-accounts',
      storageBucket: 'railroadradar-accounts.firebasestorage.app',
      messagingSenderId: '896370923309',
      appId: '1:896370923309:web:594b0a20d3b1c6822e65a4'
    });
    var map = L.map('map').setView([42.36, -71.06], 8);
    L.tileLayer('https://railroadradar-proxy.railroadradar.workers.dev/api/mapbox/styles/v1/northeastamtrakrailfanalt/ckyq285h5219a14mpql9jt2r7/tiles/256/{z}/{x}/{y}', {
      attribution: '',
      maxZoom: 20
    }).addTo(map);
    var marker = null;

    document.getElementById('live-share-stop').onclick = function() {
      try { localStorage.setItem('rrSpecialShareStopped', '1'); localStorage.removeItem('rrSpecialMoveShareV1'); } catch (e) {}
      document.getElementById('live-share-banner').hidden = true;
      if (window.firebase && firebase.auth && firebase.auth().currentUser) {
        firebase.firestore().collection('specialMoveShares').doc(firebase.auth().currentUser.uid).delete();
      }
    };

    var placeKey = '';
    function placeFor(lat, lon) {
      var key = lat.toFixed(2) + ',' + lon.toFixed(2);
      if (key === placeKey) return;
      placeKey = key;
      fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lon)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var a = data.address || {};
          var town = a.village || a.town || a.city || a.hamlet || a.municipality || '';
          var state = a.state || '';
          document.getElementById('live-place').textContent = town && state ? (town + ', ' + state) : (data.display_name || 'Location unavailable');
        }).catch(function() {
          document.getElementById('live-place').textContent = 'Location unavailable';
        });
    }
    function icon(heading, src) {
      var rot = isFinite(Number(heading)) ? Number(heading) : 90;
      return L.divIcon({ className: 'rr-live-train', html: '<img src="' + (src || '/assets/hsp46.png') + '" alt="" style="width:46px;height:20px;object-fit:contain;transform:rotate(' + rot + 'deg);display:block;">', iconSize: [46, 20], iconAnchor: [23, 10] });
    }
    if (!uid) {
      document.getElementById('status').textContent = 'No tracker selected';
    } else {
      firebase.firestore().collection('specialMoveShares').doc(uid).onSnapshot(function(doc) {
        var d = doc.exists ? (doc.data() || {}) : null;
        var live = d && d.active === true && Number(d.expiresAt) > Date.now() && isFinite(Number(d.lat)) && isFinite(Number(d.lon));
        if (!live) {
          document.getElementById('status').textContent = 'Tracker is not live';
          if (marker) { map.removeLayer(marker); marker = null; }
          return;
        }
        var title = String(d.title || 'Live trip');
        document.title = title + ' · RailroadRadar';
        document.getElementById('status').textContent = title;

        var mph = d.speed == null ? null : Math.round(Number(d.speed) * 2.23694);
        document.getElementById('live-speed').textContent = mph == null || !isFinite(mph) ? 'Speed --' : ('Speed ' + Math.max(0, mph) + ' mph');
        placeFor(Number(d.lat), Number(d.lon));

        var ll = [Number(d.lat), Number(d.lon)];
        if (!marker) marker = L.marker(ll, { icon: icon(d.heading, d.icon) }).addTo(map);
        else { marker.setLatLng(ll); marker.setIcon(icon(d.heading, d.icon)); }
        if (!marker._rrFollowed) { map.setView(ll, 14); marker._rrFollowed = true; }
      }, function() {
        document.getElementById('status').textContent = 'Could not load this tracker';
      });
    }
  </script>
  <script src="/assets/js/live-share-bar.js"></script>
</body>
</html>
