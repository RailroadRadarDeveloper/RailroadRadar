<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trackside Favorites · RailroadRadar</title>
<meta name="description" content="Restaurants, stores, and businesses that are easy to reach by train, train-themed, or welcoming to railfans.">
<meta name="theme-color" content="#07093e">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png?v=3">
<style>
:root{--navy:#07093e;--page:#07093e;--muted:#a8c0e0;--line:#1a3a5f}
*{box-sizing:border-box}html,body{margin:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--page);color:#fff}
.header{position:fixed;top:0;left:0;right:0;height:60px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:20}
.header .wordmark{height:40px;width:auto;display:block}
.header-right{display:flex;gap:8px;align-items:center}
.hb{background:#fff;color:var(--navy);border:0;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none}
.hb:focus,.back:focus{outline:2px solid #fff;outline-offset:2px}
.user{display:none;position:relative;align-items:center}
.pfp-btn{width:34px;height:34px;padding:0;border:0;background:transparent;cursor:pointer}
.pfp-btn img,.user-fallback{width:34px;height:34px;border-radius:50%;object-fit:cover;display:block}
.user-fallback{background:#fff;color:var(--navy);font:800 14px inherit;align-items:center;justify-content:center}
.acct-menu{display:none;position:absolute;right:0;top:42px;background:#0c1448;border:1px solid #1a3a5f;padding:8px;z-index:30;min-width:110px}
.acct-menu.open{display:block}
.acct-menu .hb{width:100%}
.wrap{max-width:860px;margin:0 auto;padding:84px 16px 48px}
h1{margin:0 0 8px}
.lede,.empty,.url,.access{color:var(--muted)}
.back{color:#fff;font-weight:700;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:22px;margin-top:22px}
.card{background:#0c1448;color:#fff;border:1px solid var(--line);padding:0;overflow:hidden;display:block;text-decoration:none}
.card img,.hero img{width:100%;object-fit:cover;background:#132047;display:block}
.card img{height:280px}.hero img{width:100%;height:52vh;min-height:320px;object-fit:cover}
.card .body{padding:22px 24px}.card h2{font-size:28px}
.wrap.location{max-width:none;padding:60px 0 48px}.hero{background:transparent;border:0;margin:0}.hero .copy{max-width:860px;margin:0 auto;padding:28px 20px 0}.hero .back{display:inline-block;margin:16px 20px 0}
.card h2{margin:6px 0;font-size:20px}
.hero h1{margin:6px 0;font-size:32px}
.kind{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase}
.card p,.hero p{line-height:1.45}
.hero a{color:#fff;font-weight:800}
.actions{display:flex;gap:8px;margin-top:14px}
form{background:#0c1448;border:1px solid var(--line);padding:18px 20px;margin-top:22px}
label{display:block;margin:12px 0 4px;font-weight:700}
input,textarea,select{width:100%;border:0;padding:10px;font:inherit}
button.hb.remove{background:transparent;color:#fff}
.verified-badge{width:0.92em;height:0.92em;object-fit:contain;vertical-align:-0.08em;margin-left:0.22em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10050;display:none;align-items:flex-start;justify-content:center;padding:84px 16px 24px;overflow:auto}
.modal.open{display:flex !important}
.modal form{width:min(640px,100%);margin:0}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:700}
.check input{width:auto}

</style>
</head>
<body>
<div class="header">
  <a href="/"><img class="wordmark" src="/assets/brand/railroadradar-wordmark.png" alt="RailroadRadar"></a>
  <div class="header-right">
    <button class="hb" id="add" type="button" hidden onclick="window.rrOpenFavoriteForm&&window.rrOpenFavoriteForm({})">Add a favorite</button>
    <button class="hb" id="in">Sign in</button>
    <div class="user" id="user">
      <button type="button" class="pfp-btn" id="pfp" aria-label="Account menu" aria-expanded="false" aria-controls="acct-menu">
        <img id="av" alt="">
        <span class="user-fallback" id="avfb" style="display:none"></span>
      </button>
      <div class="acct-menu" id="acct-menu"><button class="hb" id="out">Sign out</button></div>
    </div>
  </div>
</div>
<div class="wrap">
  <div id="app">
    <h1>Trackside Favorites</h1>
    <p class="lede">Restaurants, stores, and other businesses that are easy to reach by public transit, train-themed, or welcoming to train fans.</p>
    <div class="grid" id="list"></div>
    <p class="empty" id="empty">No favorites yet.</p>
  </div>
</div>
<div class="modal" id="modal" hidden>
  <form id="admin-form">
    <h2 id="form-title">Add a favorite</h2>
    <label for="name">Location name</label>
    <input id="name" maxlength="80" required>
    <label for="kind">Type</label>
    <select id="kind"><option>Restaurant</option><option>Store</option><option>Other business</option></select>
    <label for="address">Address</label>
    <input id="address" maxlength="160" required>
    <label for="railroad">Railroad</label>
    <input id="railroad" maxlength="80" required placeholder="MBTA">
    <label for="line">Line</label>
    <input id="line" maxlength="80" required placeholder="Fitchburg Line">
    <label for="station">Closest station</label>
    <input id="station" maxlength="80" required placeholder="Porter">
    <label for="photo">Photo link</label>
    <input id="photo" type="url" placeholder="https://">
    <label for="bio">Bio</label>
    <textarea id="bio" rows="4" maxlength="600" required></textarea>
    <label for="link">Link</label>
    <input id="link" type="url" placeholder="https://">
    <label class="check" for="verified"><input id="verified" type="checkbox"> Verified location</label>
    <div class="actions">
      <button class="hb" type="submit" id="save">Publish</button>
      <button class="hb remove" type="button" id="cancel">Cancel</button>
    </div>
  </form>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:'AIzaSyBCXgIwkKHBrNfs4-0T0L9LQNb6GP-37Qs',authDomain:'railroadradar-accounts.firebaseapp.com',projectId:'railroadradar-accounts',storageBucket:'railroadradar-accounts.firebasestorage.app',messagingSenderId:'896370923309',appId:'1:896370923309:web:594b0a20d3b1c6822e65a4'});
var auth=firebase.auth(), db=firebase.firestore(), isAdmin=false, editing=null;
function esc(s){return String(s||'').replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];});}
function idFromUrl(){return new URLSearchParams(location.search).get('id')||'';}
function slugify(name){
  var slug=String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80);
  return slug||'favorite';
}
function pageUrl(id){return location.origin+'/favorites/?id='+encodeURIComponent(id);}
function freeSlug(base,skip){
  function tryN(n){
    var id=n===1?base:base+'-'+n;
    if(id===skip) return Promise.resolve(id);
    return db.collection('tracksideFavorites').doc(id).get().then(function(doc){return doc.exists?tryN(n+1):id;});
  }
  return tryN(1);
}
function accessHtml(d){
  var railroad=String(d.railroad||'').trim(), line=String(d.line||'').trim(), station=String(d.station||'').trim();
  var title=railroad&&line?railroad+"'s "+line:(railroad||line);
  return (title?'<p class="access">'+esc(title)+'</p>':'')+(station?'<p class="access">Closest Station: '+esc(station)+'</p>':'');
}
function fields(d){
  return {photo:/^https:\/\//.test(d.photo||'')?d.photo:'',link:/^https:\/\//.test(d.link||'')?d.link:'',name:esc(d.name),kind:esc(d.kind||'Place'),bio:esc(d.bio),address:esc(d.address),verified:!!d.verified};
}
function nameHtml(name,verified){
  return esc(name)+(verified?'<img class="verified-badge" src="/assets/admin-badge.png" alt="Verified location" title="Verified location" width="18" height="18">':'');
}
function card(id,d){
  var f=fields(d);
  return '<a class="card" href="'+esc(pageUrl(id))+'"><div class="body">'+(f.photo?'<img src="'+esc(f.photo)+'" alt="">':'')+'<div class="kind">'+f.kind+'</div><h2>'+nameHtml(d.name,f.verified)+'</h2>'+accessHtml(d)+'<p>'+f.address+'</p></div></a>';
}
function bindDetail(id){
  var edit=document.getElementById('edit');
  if(edit) edit.onclick=function(ev){ev.preventDefault(); window.rrOpenFavoriteForm(window.currentFavorite||{});};
  var remove=document.getElementById('remove');
  if(remove) remove.onclick=function(){if(confirm('Remove this favorite?')) db.collection('tracksideFavorites').doc(id).delete().then(function(){location.href='/favorites/';});};
}
function showDetail(id,d){
  var f=fields(d);
  document.title=(d.name||'Favorite')+' · RailroadRadar';
  document.querySelector('.wrap').classList.add('location'); document.getElementById('app').innerHTML='<article class="hero">'+(f.photo?'<img src="'+esc(f.photo)+'" alt="">':'')+'<a class="back" href="/favorites/">All favorites</a><div class="copy"><div class="kind">'+f.kind+'</div><h1>'+nameHtml(d.name,f.verified)+'</h1>'+accessHtml(d)+'<p>'+f.address+'</p><p>'+f.bio+'</p>'+(f.link?'<p><a href="'+esc(f.link)+'" target="_blank" rel="noopener">Visit</a></p>':'')+'<p class="url">'+esc(pageUrl(id))+'</p>'+(isAdmin?'<div class="actions"><button class="hb" type="button" id="edit" onclick="window.rrOpenFavoriteForm(window.currentFavorite||{})">Edit</button><button class="hb remove" type="button" id="remove">Remove</button></div>':'')+'</div></article>';
  bindDetail(id);
}
function fillForm(d){
  ['name','kind','address','railroad','line','station','photo','bio','link'].forEach(function(key){document.getElementById(key).value=d[key]||'';});
  if(!d.kind) document.getElementById('kind').value='Restaurant';
  document.getElementById('verified').checked=!!d.verified;
}
function openForm(d){
  window.rrOpenFavoriteForm=openForm;
  editing=d&&d.id?d.id:(idFromUrl()||null);
  fillForm(d||{});
  document.getElementById('form-title').textContent=editing?'Edit favorite':'Add a favorite';
  document.getElementById('save').textContent=editing?'Save':'Publish';
  var modal=document.getElementById('modal');
  modal.hidden=false; modal.classList.add('open');
}
function closeForm(){
  var modal=document.getElementById('modal');
  modal.classList.remove('open'); modal.hidden=true;
  if(!idFromUrl()) editing=null;
}
function payload(){
  var user=auth.currentUser;
  return {name:document.getElementById('name').value.trim().slice(0,80),kind:document.getElementById('kind').value,address:document.getElementById('address').value.trim().slice(0,160),railroad:document.getElementById('railroad').value.trim().slice(0,80),line:document.getElementById('line').value.trim().slice(0,80),station:document.getElementById('station').value.trim().slice(0,80),photo:document.getElementById('photo').value.trim(),bio:document.getElementById('bio').value.trim().slice(0,600),link:document.getElementById('link').value.trim(),verified:document.getElementById('verified').checked,updatedAt:Date.now(),updatedBy:user?user.uid:''};
}
function load(){
  var id=idFromUrl();
  var form=document.getElementById('admin-form');
  if(id){
    db.collection('tracksideFavorites').doc(id).onSnapshot(function(doc){
      if(!doc.exists){document.getElementById('app').innerHTML='<a class="back" href="/favorites/">All favorites</a><p class="empty">This favorite could not be found.</p>'; form.hidden=true; return;}
      var data=doc.data()||{};
      data.id=id;
      window.currentFavorite=data;
      showDetail(id,data);
      form.hidden=true;
      if(isAdmin && new URLSearchParams(location.search).get('edit')==='1') openForm(data);
    },function(err){document.getElementById('app').innerHTML='<p class="empty">Could not open this favorite ('+(err&&err.code||'unknown')+').</p>';});
    return;
  }
  editing=null;
  document.querySelector('.wrap').classList.remove('location');
  var add=document.getElementById('add');
  if(add) add.hidden=!isAdmin;
  db.collection('tracksideFavorites').onSnapshot(function(snap){
    var rows=[]; snap.forEach(function(doc){rows.push({id:doc.id,data:doc.data()||{}});});
    rows.sort(function(a,b){return (b.data.createdAt||0)-(a.data.createdAt||0);});
    var html=''; rows.forEach(function(row){html+=card(row.id,row.data);});
    var list=document.getElementById('list');
    if(list){list.innerHTML=html; document.getElementById('empty').hidden=!!html;}
  },function(err){
    var code=err&&err.code?err.code:'unknown';
    var empty=document.getElementById('empty');
    if(!empty) return;
    empty.hidden=false;
    empty.textContent=code==='permission-denied'?'Firebase is still blocking this list. Publish the tracksideFavorites rules.':'Favorites could not load ('+code+').';
  });
}
document.getElementById('cancel').onclick=function(){closeForm();};
window.rrOpenFavoriteForm=openForm;
document.getElementById('add').onclick=function(ev){ev.preventDefault(); editing=null; openForm({});};
document.getElementById('modal').addEventListener('click',function(ev){if(ev.target.id==='modal') closeForm();});
document.getElementById('admin-form').addEventListener('submit',function(ev){
  ev.preventDefault(); var user=auth.currentUser; if(!user)return;
  var data=payload();
  freeSlug(slugify(data.name),editing).then(function(id){
    data.slug=id;
    var write=db.collection('tracksideFavorites').doc(id).set(Object.assign({},data,editing?{}:{createdAt:Date.now(),createdBy:user.uid}),{merge:true});
    return write.then(function(){
      if(editing&&editing!==id) return db.collection('tracksideFavorites').doc(editing).delete();
    }).then(function(){location.href='/favorites/?id='+encodeURIComponent(id);});
  }).catch(function(err){alert(err&&err.message?err.message:'Could not save');});
});
document.getElementById('in').onclick=function(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());};
document.getElementById('out').onclick=function(){auth.signOut();};
document.getElementById('pfp').onclick=function(){var m=document.getElementById('acct-menu'); m.classList.toggle('open'); this.setAttribute('aria-expanded', m.classList.contains('open'));};
auth.onAuthStateChanged(function(user){
  document.getElementById('in').style.display=user?'none':'inline-block';
  document.getElementById('user').style.display=user?'flex':'none';
  if(user){
    var av=document.getElementById('av'), fb=document.getElementById('avfb');
    if(user.photoURL){av.src=user.photoURL; av.style.display='block'; fb.style.display='none';}
    else{av.style.display='none'; fb.style.display='flex'; fb.textContent=(user.displayName||user.email||'A').slice(0,1).toUpperCase();}
  }
  var email=user&&user.email?user.email.toLowerCase():'';
  var bootstrap=email==='turokerr@gmail.com'||email==='railroadradar@gmail.com';
  var check=!user?Promise.resolve(false):db.collection('admins').doc(email).get().then(function(doc){return doc.exists;}).catch(function(){return false;});
  check.then(function(ok){isAdmin=!!ok||bootstrap; var add=document.getElementById('add'); if(add) add.hidden=!isAdmin; load();});
});
load();
</script>
</body>
</html>
