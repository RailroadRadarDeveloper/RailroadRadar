name: Apply OSM rail shapes v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-osm-shapes2.yml'
permissions:
  contents: write
concurrency:
  group: apply-osm-shapes2
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rejoin, verify, apply, clean up
        run: |
          set -eu
          if [ ! -f scripts/osm-shapes2.b64.part00 ]; then echo already applied; exit 0; fi
          echo "35047a1aa2975eb1091cbe21f7a3a4c58bbfacc35a7bae879f8b7702c70341a3  assets/shapes/via.json" | sha256sum -c -
          echo "08bdeab57399e75c5f3b435e5612fce7924fd73f4cf41c3852ed9e72d321e2c6  assets/shapes/amtrak.json" | sha256sum -c -
          cat scripts/osm-shapes2.b64.part00 scripts/osm-shapes2.b64.part01 scripts/osm-shapes2.b64.part02 scripts/osm-shapes2.b64.part03 scripts/osm-shapes2.b64.part04 scripts/osm-shapes2.b64.part05  | tr -d ' \n\r' > /tmp/s.b64
          echo "0c00ce075c4b312469d347599f6a8cc93224d1d1dd6d610e615e3ba228e9d3a5  /tmp/s.b64" | sha256sum -c -
          mkdir -p /tmp/x && base64 -d /tmp/s.b64 | gunzip | tar -xf - -C /tmp/x
          echo "9662482ca793899f2c313c8732355ce7c1f0ce2c990fe6bca281c3d04b3496cf  /tmp/x/via.json" | sha256sum -c -
          echo "9b3d7c088423a8f59a9599f408d4c72d201f0f89425d1d9c987ba3b75720a37b  /tmp/x/amtrak.json" | sha256sum -c -
          cp /tmp/x/via.json assets/shapes/via.json
          cp /tmp/x/amtrak.json assets/shapes/amtrak.json
          git rm -q scripts/osm-shapes2.b64.part00 scripts/osm-shapes2.b64.part01 scripts/osm-shapes2.b64.part02 scripts/osm-shapes2.b64.part03 scripts/osm-shapes2.b64.part04 scripts/osm-shapes2.b64.part05  .github/workflows/apply-osm-shapes2.yml
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add assets/shapes/via.json assets/shapes/amtrak.json
          git commit -m "Amtrak + VIA lines: 15 m track-accurate simplification, shared-corridor snapping (fixes corner-cutting and offset sibling lines at street zoom)"
          git push origin HEAD:main
