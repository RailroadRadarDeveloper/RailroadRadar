name: Revert stoplist scale

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/revert-stoplist-scale.py
      - .github/workflows/revert-stoplist-scale.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/revert-stoplist-scale.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Revert extra stop-list scaling; keep 0.72 popup zoom" && git push; fi
