name: Live bar all pages
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/add-live-bar-pages.py
      - assets/js/live-share-bar.js
      - .github/workflows/live-bar-pages.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/add-live-bar-pages.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo nothing; else git commit -m "Keep live location sharing and the red stop banner on every page" && git push; fi
