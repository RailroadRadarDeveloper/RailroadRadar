name: Stop status below name

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/stop-status-below-name.py
      - .github/workflows/stop-status-below-name.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/stop-status-below-name.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Move live stop time under the station name" && git push; fi
