name: Full press Discord embed
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/full-press-discord-embed.py
      - .github/workflows/full-press-discord-embed.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/full-press-discord-embed.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add press/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Embed full press article body in Discord" && git push; fi
