name: Add press Discord button
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/add-press-discord-button.py
      - .github/workflows/add-press-discord-button.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/add-press-discord-button.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add press/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Add Send to Discord button on press articles" && git push; fi
