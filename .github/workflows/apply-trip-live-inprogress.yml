name: Apply trip live inprogress
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/trip-live-inprogress.patch.gz.b64'
      - '.github/workflows/apply-trip-live-inprogress.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair b64 if needed, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, pathlib, base64, gzip
          expected = "c5b4c2967785ab2074ede398a90c3d09ab167c9a86feed88ecc60f1965b75c0d"
          path = pathlib.Path('scripts/trip-live-inprogress.patch.gz.b64')
          if not path.exists():
            raise SystemExit('missing scripts/trip-live-inprogress.patch.gz.b64')
          blob = path.read_text().strip()
          h = hashlib.sha256(blob.encode()).hexdigest()
          print('initial', len(blob), h)
          if h != expected:
            arr = list(blob)
            # Known 1-byte MCP paste corruption from dca0681 upload
            if len(arr) > 933 and arr[933] == 'Q' and ''.join(arr[928:936]) == 'D+cRDQHA':
              arr[933] = 'Y'
              print('fixed pos 933 Q->Y (D+cRDQHA -> D+cRDYHA)')
            blob = ''.join(arr)
            h = hashlib.sha256(blob.encode()).hexdigest()
            print('after repair', len(blob), h)
            if h != expected:
              raise SystemExit(f'b64 sha256 mismatch after repair: {h}')
            path.write_text(blob + '\n')
            print('wrote repaired b64')
          else:
            print('b64 already clean')
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path('/tmp/trip-live-inprogress.patch').write_bytes(raw)
          print('gunzip ok', len(raw))
          PY
          git apply /tmp/trip-live-inprogress.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert '/* Trip live in-progress light */' in t
          assert 'TRIP_LIVE_POLL_MS = 50000' in t
          assert 'startTripLiveTracking' in t
          assert 'stopTripLiveTracking' in t
          assert 'window.rrCollectLiveTrainRows' in t
          assert 'window.rrFindSharedTrain' in t
          assert 'trip-detail-live' in t
          assert '/* Trip schedule train pick */' in t
          assert '/* Trip log from live */' in t
          assert '/* Trip schedule stations */' in t
          assert Path('mytrips/index.html').read_text(errors='replace').count('/* Trip live in-progress light */') >= 1
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html scripts/trip-live-inprogress.patch.gz.b64
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "My trips: light live in-progress tracking on detail"
            git push
          fi
