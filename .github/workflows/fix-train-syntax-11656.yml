name: Fix train load syntax

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fix-train-syntax-11656.py
      - .github/workflows/fix-train-syntax-11656.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-train-syntax-11656.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Fix tripTrainNumMatch syntax error that blocked train loading" && git push; fi
