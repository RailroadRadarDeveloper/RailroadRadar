name: Scheduled route from shapes
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/scheduled-route-shape.py
      - .github/workflows/scheduled-route-shape.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/scheduled-route-shape.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Use MBTA track shapes for future train routes" && git push; fi
