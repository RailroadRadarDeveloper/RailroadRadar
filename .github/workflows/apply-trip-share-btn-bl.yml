name: Apply trip share btn bottom left

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/trip-share-btn-bl.patch.gz.b64'
      - '.github/workflows/apply-trip-share-btn-bl.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Decode, verify, apply patch
        run: |
          set -euo pipefail
          B64=scripts/trip-share-btn-bl.patch.gz.b64
          test -f "$B64"
          EXPECTED_SHA="87d5acc7b80e97a6b597411fa104fd19eecd65687df56b41f7d97d4da6cd2b29"
          ACTUAL_SHA=$(sha256sum "$B64" | awk '{print $1}')
          echo "b64 sha256=$ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::b64 SHA mismatch (got $ACTUAL_SHA expected $EXPECTED_SHA)"
            exit 1
          fi
          python3 - <<'PY'
          import base64, gzip, pathlib, sys
          b64 = pathlib.Path("scripts/trip-share-btn-bl.patch.gz.b64").read_text().strip()
          raw = gzip.decompress(base64.b64decode(b64))
          pathlib.Path("/tmp/trip-share-btn-bl.patch").write_bytes(raw)
          for m in [b"Trip share btn bottom left", b"Trip mytrips clarity cookies", b"openRrCookieSettings", b"trip-detail-capturing #trip-detail-share"]:
              if m not in raw:
                  print("missing marker", m)
                  sys.exit(1)
          print("patch bytes", len(raw))
          PY
          git apply --whitespace=nowarn /tmp/trip-share-btn-bl.patch || {
            echo "git apply failed; trying patch -p0"
            patch -p0 --forward < /tmp/trip-share-btn-bl.patch
          }
          if [ -f mytrips/index.html ]; then
            cp -a index.html mytrips/index.html
          fi
          grep -q "Trip share btn bottom left" index.html
          grep -q "Trip mytrips clarity cookies" index.html
          grep -q "openRrCookieSettings" index.html
          echo "markers OK"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "RailroadRadar Bot"
          git config user.email "bot@railroadradar.com"
          git add index.html mytrips/index.html 2>/dev/null || git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "My trips: share btn bottom-left, hide on capture; Clarity/cookies on mytrips"
          git push origin HEAD:main
