name: Remove press header border
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/remove-press-header-border.py
      - .github/workflows/remove-press-header-border.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/remove-press-header-border.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add press/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Remove press header border line" && git push; fi
