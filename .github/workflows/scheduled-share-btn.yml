name: Scheduled train share button
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/scheduled-share-btn.py
      - .github/workflows/scheduled-share-btn.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/scheduled-share-btn.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Add Share button on future scheduled train popups" && git push; fi
