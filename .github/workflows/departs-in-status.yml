name: Departs in status text
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/departs-in-status.py
      - .github/workflows/departs-in-status.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/departs-in-status.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Show Departs in countdown on scheduled trip popups" && git push; fi
