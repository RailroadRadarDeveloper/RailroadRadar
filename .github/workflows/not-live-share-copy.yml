name: Not-live share copy
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/not-live-share-copy.py
      - .github/workflows/not-live-share-copy.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/not-live-share-copy.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Use not-live copy on shared future train pages" && git push; fi
