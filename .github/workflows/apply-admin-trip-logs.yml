name: Apply admin trip logs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/admin-trip-logs.patch.gz.b64'
      - '.github/workflows/apply-admin-trip-logs.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode patch, apply, commit admin.html
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, pathlib
          expected = "6be3510a2fdf2b6d03773ead11508dc2d61951918ef69510468d9cd2580954d3"
          p = pathlib.Path('scripts/admin-trip-logs.patch.gz.b64')
          if not p.exists():
              raise SystemExit('missing patch artifact')
          blob = p.read_text().strip()
          print('b64 len', len(blob))
          got = hashlib.sha256(blob.encode()).hexdigest()
          if got != expected:
              raise SystemExit(f'hash mismatch: {got}')
          pathlib.Path('/tmp/all.b64').write_text(blob)
          print('hash ok')
          PY
          base64 -d /tmp/all.b64 | gunzip > /tmp/admin-trip-logs.patch
          patch -p1 < /tmp/admin-trip-logs.patch
          python3 - <<'PY'
          from pathlib import Path
          t = Path('admin.html').read_text(errors='replace')
          assert 'admin-tab-trips' in t
          assert 'Admin trip logs viewer' in t
          assert 'loadAdminTrips' in t
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "Admin: view users trip logs"
            git push
          fi
