name: Apply special move map listener
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sm-maplisten.patch.gz.b64.part*'
      - '.github/workflows/apply-sm-maplisten.yml'
permissions:
  contents: write
concurrency:
  group: apply-sm-maplisten
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rejoin, verify, apply, clean up
        run: |
          set -eu
          if [ ! -f scripts/sm-maplisten.patch.gz.b64.part0 ]; then echo already applied; exit 0; fi
          echo "9f619b265d111f08b31e88dd1d01b4ec6256b12f509f8df3c59015affddf9b3d  index.html" | sha256sum -c -
          cat scripts/sm-maplisten.patch.gz.b64.part0 | tr -d ' \n\r' > /tmp/p.b64
          echo "90e4838f6357b8a289bc52e67be3741bc7080d4a5c52b6ae1420da4cf906e415  /tmp/p.b64" | sha256sum -c -
          base64 -d /tmp/p.b64 | gunzip > /tmp/p.patch
          patch --no-backup-if-mismatch index.html /tmp/p.patch
          echo "e6e94a0424a03cce4dadfc55fcaf3cf681d867160a2052a663af103ea53f0e19  index.html" | sha256sum -c -
          git rm -q scripts/sm-maplisten.patch.gz.b64.part0 .github/workflows/apply-sm-maplisten.yml
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          git commit -m "Show shared special moves on the live map again"
          git push origin HEAD:main
