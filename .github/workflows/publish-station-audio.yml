name: Publish station audio page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble stationaudio/index.html
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, hashlib, pathlib
          expected_b64 = "7668f9004e547f0de37ddf678a288a09d56b8aa380329e813c1be6c0b266018f"
          expected_html = "b116b1431ccc46779ced7a917aacedce3e5febe778e882766aa192a3ce4c39eb"
          parts = []
          for i in range(151):
              p = pathlib.Path(f"scripts/stationaudio-b64/part{i:03d}")
              if not p.exists():
                  raise SystemExit(f"missing {p}")
              parts.append(p.read_text().strip())
          blob = "".join(parts)
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected_b64:
              raise SystemExit("b64 hash mismatch " + h)
          html = gzip.decompress(base64.b64decode(blob))
          hh = hashlib.sha256(html).hexdigest()
          if hh != expected_html:
              raise SystemExit("html hash mismatch " + hh)
          text = html.decode("utf-8")
          assert 'id="voice"' in text
          assert "getVoices" in text
          assert "rr-station-audio-voice" in text
          assert "isCommuterRailTrain" in text
          assert "trains.filter(isCommuterRailTrain)" in text
          assert "filter[route_type]=2" in text
          assert "The next train is" not in text
          assert "Train approaching, please stand back." in text
          assert "on track " in text
          out = pathlib.Path("stationaudio/index.html")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(html)
          print("wrote", len(html))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add stationaudio/index.html
          git rm -r scripts/stationaudio-b64
          git rm .github/workflows/publish-station-audio.yml
          git commit -m "Exclude subway and buses from station audio, add voice options."
          git pull --rebase origin main
          git push
