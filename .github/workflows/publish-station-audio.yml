name: Publish station audio page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble stationaudio/index.html
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, hashlib, pathlib
          expected_b64 = "085fc35c522e127cf0c15cf7facaca90b001747b16449458f350d441a09b8066"
          expected_html = "ce7004aa866f35600be10cd74d16523eba4412aef498ddaaf567945306c72f96"
          parts = []
          for i in range(8):
              p = pathlib.Path(f"scripts/stationaudio-b64/part{i:02d}")
              if not p.exists():
                  raise SystemExit(f"missing {p}")
              parts.append(p.read_text().strip())
          blob = "".join(parts)
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected_b64:
              raise SystemExit("b64 hash mismatch " + h)
          html = gzip.decompress(base64.b64decode(blob))
          hh = hashlib.sha256(html).hexdigest()
          if hh != expected_html:
              raise SystemExit("html hash mismatch " + hh)
          text = html.decode("utf-8")
          assert 'id="station"' in text
          assert "Train approaching, please stand back." in text
          assert "The next train is" not in text
          assert "on track " in text
          out = pathlib.Path("stationaudio/index.html")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(html)
          print("wrote", len(html))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add stationaudio/index.html
          git rm -r scripts/stationaudio-b64
          git rm .github/workflows/publish-station-audio.yml
          git commit -m "Add station audio announcements page"
          git pull --rebase origin main
          git push
