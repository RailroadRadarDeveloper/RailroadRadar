name: MyTrips no popup Get Started
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/mytrips-no-popup-get-started.py
      - .github/workflows/mytrips-no-popup-get-started.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/mytrips-no-popup-get-started.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Disable signup popup on MyTrips and label splash CTA Get Started" && git push; fi
