name: Fix tracker page
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fix-tracker-page.py
      - .github/workflows/fix-tracker-page.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-tracker-page.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add live/user.html live/index.html index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Tracker page uses the RailroadRadar logo and site map" && git push; fi
