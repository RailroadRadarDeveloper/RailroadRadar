name: Live train popup
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/live-train-popup.py
      - .github/workflows/live-train-popup.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/live-train-popup.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Live shares use a train icon and train popup with 1s updates" && git push; fi
