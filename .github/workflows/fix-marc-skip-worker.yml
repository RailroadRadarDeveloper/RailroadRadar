name: Prefer GitHub MARC snapshots over missing worker

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-marc-skip-worker.yml
      - scripts/fix-marc-skip-worker.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python3 scripts/fix-marc-skip-worker.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/fix-marc-skip-worker.py .github/workflows/fix-marc-skip-worker.yml
          git add index.html scripts/fix-marc-skip-worker.py .github/workflows/fix-marc-skip-worker.yml
          if git diff --cached --quiet; then
            echo No changes
            exit 0
          fi
          git commit -m "Fetch MARC from GitHub snapshots instead of missing worker routes"
          git push
