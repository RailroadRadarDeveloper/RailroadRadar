name: Live train icon
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/live-train-icon.py
      - .github/workflows/live-train-icon.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/live-train-icon.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html live/user.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Show the train icon on live trip maps" && git push; fi
