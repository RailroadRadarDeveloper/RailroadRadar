name: Go live redirect
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/go-live-redirect.py
      - .github/workflows/go-live-redirect.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/go-live-redirect.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "GO LIVE opens the unique tracker page" && git push; fi
