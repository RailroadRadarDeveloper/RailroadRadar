name: Green development banner
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/green-dev-banner.py
      - .github/workflows/green-dev-banner.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/green-dev-banner.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Make development update banner RailroadRadar green" && git push; fi
