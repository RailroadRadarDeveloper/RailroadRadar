name: Fix live issues
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fix-live-issues.py
      - .github/workflows/fix-live-issues.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-live-issues.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html firestore.rules assets/js/live-share-bar.js
          if git diff --cached --quiet; then echo nothing; else git commit -m "Fix live trip save, service name, banner, and Mapbox tracker" && git push; fi
