name: Remove admin Back to map button
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-admin-back-to-map.yml'
      - 'scripts/remove-admin-back-to-map.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove header button
        run: |
          set -euo pipefail
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          python3 scripts/remove-admin-back-to-map.py
          git add admin.html scripts/build-admin-page.py
          if git diff --cached --quiet; then
            echo nothing to commit
          else
            git commit -m "Remove Back to map button from admin dashboard header"
            git push
          fi
