name: Require live location
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/require-live-location.py
      - .github/workflows/require-live-location.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/require-live-location.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Require a location fix before a live trip can be created" && git push; fi
