name: Hide guest home when signed in
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fix-mytrips-guest-hidden.py
      - .github/workflows/fix-mytrips-guest-hidden.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-mytrips-guest-hidden.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Do not show MyTrips homepage to signed-in users" && git push; fi
