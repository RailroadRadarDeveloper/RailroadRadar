name: Restore route geometry
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/shape-fix/**
      - .github/workflows/restore-route-geometry.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode geometry packs
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, hashlib, pathlib
          root = pathlib.Path("scripts/shape-fix")
          part = root / "lirr.b64.part00"
          text = part.read_text()
          if len(text) != 12000:
              raise SystemExit("lirr part00 length %s" % len(text))
          if text[139] != "6":
              text = text[:139] + "6" + text[140:]
          want = "d5dba5f60743141536d3f0e25457fd107af7c9c49b37236ba15ada666b5701f5"
          got = hashlib.sha256(text.encode()).hexdigest()
          if got != want:
              raise SystemExit("lirr part00 hash " + got)
          part.write_text(text)
          expect = {
              "mnr": "47a7694c143887aa0b26eb38891c258bf6f14f5dbe80266b5ed2a4755b437746",
              "mbta": "1b32c9bf7ac72f04db9e7df2716fc79a6370265ea92cf5157cec195cbf702a13",
              "lirr": "76d3f3e6151212239170e0cbc766d80ee14636de0b31406fafd42327e3f46117",
          }
          for name, exp in expect.items():
              parts = sorted(root.glob(name + ".b64.part*"))
              if not parts:
                  raise SystemExit("missing parts " + name)
              b64 = "".join(p.read_text().strip() for p in parts)
              raw = gzip.decompress(base64.b64decode(b64))
              h = hashlib.sha256(raw).hexdigest()
              if h != exp:
                  raise SystemExit("%s hash %s" % (name, h))
              dest = pathlib.Path("assets/shapes") / (name + ".json")
              dest.write_bytes(raw)
              print(name, len(raw), h)
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add assets/shapes/mbta.json assets/shapes/mnr.json assets/shapes/lirr.json scripts/shape-fix/lirr.b64.part00
          if git diff --cached --quiet; then
            echo "already published"
          else
            git commit -m "Restore MBTA and LIRR track-following route geometry."
            git pull --rebase origin main
            git push origin HEAD:main
          fi
