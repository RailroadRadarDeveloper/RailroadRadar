name: Popup zoom smaller

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/popup-zoom-smaller.py
      - .github/workflows/popup-zoom-smaller.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/popup-zoom-smaller.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Scale whole popup down further" && git push; fi
