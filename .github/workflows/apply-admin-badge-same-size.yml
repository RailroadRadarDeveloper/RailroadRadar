name: Apply admin badge same size
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode patch, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, glob
          expected = "0410308af11dc15e9b2dee26cc4fda171ac56528a3c935519024548f25438ec4"
          part_paths = sorted(
              [p for p in glob.glob('scripts/admin-badge-same-size.patch.gz.b64.part*')],
              key=lambda p: int(''.join(c for c in p.rsplit('part',1)[-1] if c.isdigit()) or 0)
          )
          blob = None
          if part_paths:
            blob = ''.join(pathlib.Path(p).read_text().strip() for p in part_paths)
            print('assembled parts', len(part_paths), 'len', len(blob), hashlib.sha256(blob.encode()).hexdigest())
          single = pathlib.Path('scripts/admin-badge-same-size.patch.gz.b64')
          if blob is None and single.exists():
            blob = single.read_text().strip()
            print('using single b64', len(blob))
          if not blob:
            raise SystemExit('no patch b64 found')
          def swap_o0_45(s):
            return s.translate(str.maketrans({'o':'0','0':'o','4':'5','5':'4'}))
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
            alt = swap_o0_45(blob)
            ha = hashlib.sha256(alt.encode()).hexdigest()
            print('raw mismatch', h, 'swapped', ha)
            if ha == expected:
              blob = alt
              h = ha
              print('repaired o/0 and 5/4 swap')
            else:
              raise SystemExit(f'full hash mismatch: {h}')
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path('/tmp/admin-badge-same-size.patch').write_bytes(raw)
          print('patch bytes', len(raw), 'hash ok')
          PY
          git apply /tmp/admin-badge-same-size.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert 'rr-admin-badge-same-size-2026-10-04' in t
          assert 'width: 1.15em' not in t
          assert t.count('width: 0.92em') >= 2
          assert "const size = isAdmin ? '11' : '11';" in t
          assert '.rr-admin-table .admin-badge-icon.is-visible {\n      width: 11px;\n      height: 11px;' in t
          assert '#btn-account-settings .admin-badge-icon.is-visible {\n        margin-left: 0;\n        width: 14px;\n        height: 14px;' in t
          assert 'width="11" height="11"' in t
          assert 'rr-trip-inprogress-section-2026-10-03' in t
          assert 'rr-trip-card-mainmap-markers-2026-10-03' in t
          assert 'rr-live-bar-lateness-only-2026-10-03' in t
          h = hashlib.sha256(Path('index.html').read_bytes()).hexdigest()
          expected_html = "6a5331a12c806b1961e9a83497bab9bfa86e6ea75cb72c53f8d23becadca8f54"
          if h != expected_html:
            raise SystemExit('index.html sha mismatch ' + h)
          mt = Path('mytrips/index.html').read_bytes()
          if hashlib.sha256(mt).hexdigest() != expected_html:
            raise SystemExit('mytrips sha mismatch')
          assert 'rr-admin-badge-same-size-2026-10-04' in mt.decode('utf-8', 'replace')
          print('ok', len(t), h)
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "MyTrips: match admin verified badge size to regular verified badges"
            git pull --rebase origin main
            git push
          fi
