name: Apply station audio voice
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish stationaudio/index.html from gzip+base64 parts
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, hashlib, pathlib, re
          expected = "ce6d73ba64934326c7f40a0e41a18c8a324572ff8f8eed9ddcf78d31872475b1"
          expected_raw = "a889a171b13e4b8c57f2da02d12e36ab356d0b6b04a2378c62518973595e69fc"
          paths = sorted(pathlib.Path('scripts').glob('station-audio-voice.b64.part*'), key=lambda p: int(re.search(r'part(\d+)$', p.name).group(1)))
          if len(paths) != 163:
              raise SystemExit('expected 163 parts, got %d' % len(paths))
          pieces = [p.read_text().strip() for p in paths]
          if any(len(piece) > 400 for piece in pieces):
              raise SystemExit('a part is longer than 400 bytes')
          blob = ''.join(pieces)
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
              repaired = blob.translate(str.maketrans('o045', '0o54'))
              hr = hashlib.sha256(repaired.encode()).hexdigest()
              if hr != expected:
                  raise SystemExit('b64 hash mismatch ' + h + ' repaired ' + hr)
              blob = repaired
              h = hr
          raw = gzip.decompress(base64.b64decode(blob))
          rh = hashlib.sha256(raw).hexdigest()
          if rh != expected_raw:
              raise SystemExit('raw hash mismatch ' + rh)
          text = raw.decode('utf-8')
          for banned in ('minutes late', 'minute late', 'back on time', 'is canceled', 'Service alert cleared', 'Up next', 'up next', 'The next train is'):
              if banned in text:
                  raise SystemExit('invented or up-next text still present: ' + banned)
          for need in (
              'upcomingByDestination',
              'alertMatchesAnnouncedLine',
              'Train approaching, please stand back.',
              'function peekDest',
              '>= 15000',
              'dFix <= 0.1',
              'gaining',
              'function estimatePos',
              'function segmentHit',
              'id="voice-preview"',
              'BAD_VOICE_RE',
              "VOICE_KEY = 'rr-station-audio-voice'",
              'Newburyport Line 142 to North Station, in 8 minutes, on track 2.',
              'function syncSeenMins',
              'isCommuterRailTrain',
          ):
              if need not in text:
                  raise SystemExit('missing ' + need)
          pathlib.Path('stationaudio').mkdir(exist_ok=True)
          pathlib.Path('stationaudio/index.html').write_bytes(raw)
          print('hash ok', rh, 'bytes', len(raw), 'b64', h)
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add -- stationaudio/index.html
          names=$(git diff --cached --name-only)
          printf '%s\n' "$names"
          test "$names" = "stationaudio/index.html" || test -z "$names"
          if git diff --cached --quiet; then
            echo nothing to commit
          else
            git commit -m "Station audio: clearer English voices and speak sooner countdowns immediately"
            git pull --rebase origin main
            git push
          fi
