name: Apply trip visual polish
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/trip-visual-polish.patch.gz.b64'
      - '.github/workflows/apply-trip-visual-polish.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode patch, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, pathlib, sys
          expected = "1eb354fd9883680769b73f6a8163d371b4adb168e4cbe1e2c1b51abe467440f1"
          single = pathlib.Path('scripts/trip-visual-polish.patch.gz.b64')
          if not single.exists():
            raise SystemExit('missing scripts/trip-visual-polish.patch.gz.b64')
          blob = single.read_text().strip()
          print('using single b64', len(blob))
          h=hashlib.sha256(blob.encode()).hexdigest()
          if h!=expected:
            raise SystemExit(f'full hash mismatch: {h}')
          pathlib.Path('/tmp/all.b64').write_text(blob)
          print('hash ok')
          PY
          base64 -d /tmp/all.b64 | gunzip > /tmp/trip-visual-polish.patch
          git apply /tmp/trip-visual-polish.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert 'Trip visual polish:' in t
          assert 'trip-log-primary-log' in t
          assert 'setTripLogSkeletons' in t
          assert 'trip-log-empty-cta' in t
          assert 'No trips yet' in t
          assert 'rrTripDetailIn' in t
          assert 'trip-log-row-map:not(.is-empty):not(.is-loading)::after' in t
          assert 'formatTripRelativeDepart' in t
          assert 'mapbox/dark-v11' in t
          assert '/mytrips white chrome' in t
          assert 'weight: 7' in t
          assert Path('mytrips/index.html').read_text(errors='replace').count('Trip visual polish:') >= 1
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "My trips: visual polish (cards, header, detail, maps, empty/loading)"
            git push
          fi
