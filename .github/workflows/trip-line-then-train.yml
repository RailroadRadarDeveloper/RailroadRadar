name: Line then train picker
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/trip-line-then-train.py
      - .github/workflows/trip-line-then-train.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/trip-line-then-train.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Select line before train number; default arrive time to now" && git push; fi
