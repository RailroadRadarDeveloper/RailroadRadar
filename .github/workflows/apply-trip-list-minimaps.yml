name: Apply trip list mini-maps
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/trip-list-minimaps.patch.gz.b64'
      - '.github/workflows/apply-trip-list-minimaps.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode patch, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, pathlib, sys
          expected = "51afd7235abf438a76287670060fc72efec6ce2e0ad28e60c07c3ddf592cf5fe"
          single = pathlib.Path('scripts/trip-list-minimaps.patch.gz.b64')
          if not single.exists():
            raise SystemExit('missing scripts/trip-list-minimaps.patch.gz.b64')
          blob = single.read_text().strip()
          print('using single b64', len(blob))
          h=hashlib.sha256(blob.encode()).hexdigest()
          if h!=expected:
            raise SystemExit(f'full hash mismatch: {h}')
          pathlib.Path('/tmp/all.b64').write_text(blob)
          print('hash ok')
          PY
          base64 -d /tmp/all.b64 | gunzip > /tmp/trip-list-minimaps.patch
          git apply /tmp/trip-list-minimaps.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert 'trip-log-row-map' in t
          assert 'paintTripLogMiniMap' in t
          assert 'scheduleTripLogMiniMap' in t
          assert 'rrIsMyTripsPage' in t
          assert 'TRIP_LOG_RAIL_COLORS' in t
          assert Path('mytrips/index.html').read_text(errors='replace').count('paintTripLogMiniMap') >= 1
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "Add mini maps under each trip on My trips list"
            git push
          fi
