name: Live stats
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/live-stats.py
      - .github/workflows/live-stats.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/live-stats.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add live/user.html assets/js/live-share-bar.js
          if git diff --cached --quiet; then echo nothing; else git commit -m "Show speed and place on the live tracker page" && git push; fi
