name: Fix actuals and type

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fix-actuals-and-type.py
      - .github/workflows/fix-actuals-and-type.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-actuals-and-type.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Fix Firestore actual stop times and shrink popup text" && git push; fi
