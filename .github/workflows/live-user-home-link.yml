name: Live user home link
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/live-user-home-link.py
      - .github/workflows/live-user-home-link.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/live-user-home-link.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add live/user.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Point tracker pages back to the main site" && git push; fi
