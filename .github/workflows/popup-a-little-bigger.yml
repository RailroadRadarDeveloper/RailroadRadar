name: Popup a little bigger

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/popup-a-little-bigger.py
      - .github/workflows/popup-a-little-bigger.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/popup-a-little-bigger.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Make map popups a little bigger" && git push; fi
