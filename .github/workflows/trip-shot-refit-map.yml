name: Refit trip screenshot map
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/trip-shot-refit-map.py
      - .github/workflows/trip-shot-refit-map.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/trip-shot-refit-map.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Refit trip screenshot map so origin and destination stay in frame" && git push; fi
