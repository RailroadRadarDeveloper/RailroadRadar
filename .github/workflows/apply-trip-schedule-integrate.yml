name: Apply trip schedule integrate
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/trip-schedule-integrate.patch.gz.b64'
      - '.github/workflows/apply-trip-schedule-integrate.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair b64 if needed, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, pathlib, base64, gzip
          expected = "df2641796399b5b7724792036e238674b4de4b567616059f3e3183759eade82f"
          path = pathlib.Path('scripts/trip-schedule-integrate.patch.gz.b64')
          if not path.exists():
            raise SystemExit('missing scripts/trip-schedule-integrate.patch.gz.b64')
          blob = path.read_text().strip()
          h = hashlib.sha256(blob.encode()).hexdigest()
          print('initial', len(blob), h)
          if h != expected:
            arr = list(blob)
            # Known 3-byte MCP paste corruptions from ba2d9d7 upload
            if len(arr) > 453 and arr[453] == 'R' and ''.join(arr[448:456]) == 'mSEw/Reh':
              arr[453] = 'N'
              print('fixed pos 453 R->N (/Rehvg -> /Nehvg)')
            if len(arr) > 4004 and arr[4003] == 'g' and arr[4004] == 'm' and ''.join(arr[4002:4006]) == 'Ygml':
              arr[4003] = 'n'
              arr[4004] = 'o'
              print('fixed pos 4003-4004 gm->no (gml -> nol)')
            blob = ''.join(arr)
            h = hashlib.sha256(blob.encode()).hexdigest()
            print('after repair', len(blob), h)
            if h != expected:
              raise SystemExit(f'full hash mismatch after repair: {h}')
            path.write_text(blob + '\n')
            print('wrote repaired b64')
          else:
            print('b64 already clean')
          pathlib.Path('/tmp/all.b64').write_text(blob)
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path('/tmp/trip-schedule-integrate.patch').write_bytes(raw)
          print('gunzip ok', len(raw))
          PY
          git apply /tmp/trip-schedule-integrate.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert '/* Trip schedule train pick */' in t
          assert '/* Trip log from live */' in t
          assert '/* Trip schedule stations */' in t
          assert 'rrLogTripBtnHtml' in t
          assert 'logTripFromLive' in t
          assert 'tripFetchScheduleTrains' in t
          assert 'applyTripLogFromLive' in t
          assert '/* Trip detail header route */' in t
          assert '/* Trip datetime save fix */' in t
          assert Path('mytrips/index.html').read_text(errors='replace').count('/* Trip schedule train pick */') >= 1
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html scripts/trip-schedule-integrate.patch.gz.b64
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "My trips: schedule train pick, log from live, schedule stations"
            git push
          fi
