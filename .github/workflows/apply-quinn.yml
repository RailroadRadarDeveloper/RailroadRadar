name: Apply Quinn map updates
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/via-rail.png.b64'
      - 'scripts/leaderboard-bars.png.b64'
      - 'scripts/leaderboard-trophy.png.b64'
      - 'scripts/quinn-index-small.patch.gz.b64'
      - '.github/workflows/apply-quinn.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode assets and apply patch
        run: |
          set -euo pipefail
          mkdir -p assets/icons
          if [ -f scripts/via-rail.png.b64 ]; then
            base64 -d scripts/via-rail.png.b64 > assets/via-rail.png
          fi
          if [ -f scripts/leaderboard-bars.png.b64 ]; then
            base64 -d scripts/leaderboard-bars.png.b64 > assets/icons/leaderboard-bars.png
          fi
          if [ -f scripts/leaderboard-trophy.png.b64 ]; then
            base64 -d scripts/leaderboard-trophy.png.b64 > assets/icons/leaderboard-trophy.png
          fi
          if [ -f scripts/quinn-index-small.patch.gz.b64 ]; then
            base64 -d scripts/quinn-index-small.patch.gz.b64 | gunzip > /tmp/quinn.patch
            git apply /tmp/quinn.patch
          fi
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add assets/via-rail.png assets/icons/leaderboard-bars.png assets/icons/leaderboard-trophy.png index.html
          if git diff --cached --quiet; then
            echo nothing to commit
          else
            git commit -m "Add VIA Rail trains, region filters, and updated leaderboard icons"
            git push
          fi
