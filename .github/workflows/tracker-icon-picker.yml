name: Tracker icon picker
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/tracker-icon-picker.py
      - .github/workflows/tracker-icon-picker.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tracker-icon-picker.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html live/user.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Let a tracker choose a train icon" && git push; fi
