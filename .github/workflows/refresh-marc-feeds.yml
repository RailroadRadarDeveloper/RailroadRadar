name: Refresh MARC GTFS-RT snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official MARC GTFS-RT
        run: |
          mkdir -p feeds
          curl -fsSL -o feeds/marc-vp.pb "https://mdotmta-gtfs-rt.s3.amazonaws.com/MARC+RT/marc-vp.pb"
          curl -fsSL -o feeds/marc-tu.pb "https://mdotmta-gtfs-rt.s3.amazonaws.com/MARC+RT/marc-tu.pb"
          ls -l feeds
      - name: Commit if feeds changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/marc-vp.pb feeds/marc-tu.pb
          if git diff --cached --quiet; then
            echo "Feeds unchanged"
            exit 0
          fi
          git commit -m "Refresh MARC live-train snapshots"
          git push
