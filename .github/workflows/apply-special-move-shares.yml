name: Apply Special Move location sharing
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify hash, apply patch, publish mytrips
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, hashlib, pathlib, re
          expected = "fd3abe08651d93e47ccc8699e77565feac8da7c5dbb27e5fa86e2f8134a3b520"
          expected_html = "0e425f63edc6006303a5ef1a51ea944eba16f5859470c0a65fb0ba05c98cf75f"
          blob = None
          # Prefer numbered parts (MCP-safe ~400 byte slices)
          paths = sorted(pathlib.Path("scripts").glob("special-move-shares.b64.part*"), key=lambda p: int(re.search(r"part(\d+)$", p.name).group(1)))
          if paths:
              if len(paths) != 32:
                  raise SystemExit("expected 32 parts, got %d" % len(paths))
              pieces = [p.read_text().strip() for p in paths]
              if any(len(piece) > 400 for piece in pieces):
                  raise SystemExit("a part is longer than 400 bytes")
              blob = "".join(pieces)
              print("assembled parts", len(paths), "len", len(blob))
          if blob is None:
              chunks = [pathlib.Path("scripts/special-move-shares.patch.gz.b64.%d" % i) for i in (1,2,3)]
              if all(p.exists() for p in chunks):
                  blob = "".join(p.read_text().strip() for p in chunks)
                  print("using chunked b64", len(blob))
          if blob is None:
              single = pathlib.Path("scripts/special-move-shares.patch.gz.b64")
              if single.exists():
                  blob = single.read_text().strip()
                  print("using single b64", len(blob))
          if not blob:
              raise SystemExit("no patch b64 found")
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
              raise SystemExit("b64 hash mismatch: %s" % h)
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path("/tmp/special-move-shares.patch").write_bytes(raw)
          print("patch bytes", len(raw), "hash ok")
          PY
          git apply /tmp/special-move-shares.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          t = Path('index.html').read_bytes()
          h = hashlib.sha256(t).hexdigest()
          assert h == "0e425f63edc6006303a5ef1a51ea944eba16f5859470c0a65fb0ba05c98cf75f", h
          text = t.decode('utf-8', errors='replace')
          assert '/* RR special-move location share 2026-10-05 */' in text
          assert 'specialMoveShares' in text
          assert 'trip-log-special-move' in text
          assert 'trip-detail-share-loc' in text
          assert 'rrSpecialStartSharing' in text
          assert 'rrSpecialFlushQueue' in text
          assert 'Connection lost — buffering' in text
          assert 'Last ping ' in text
          assert 'window.rrMainMap' in text
          assert 'Share my location on the live map' in text
          mt = Path('mytrips/index.html').read_text(errors='replace')
          assert 'specialMoveShares' in mt
          assert 'rrSpecialFlushQueue' in mt
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "MyTrips: Special move live location sharing (offline-resilient)"
            git pull --rebase origin main
            git push
          fi
