name: Resume tracking
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/resume-tracking.py
      - .github/workflows/resume-tracking.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/resume-tracking.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add assets/js/live-share-bar.js
          if git diff --cached --quiet; then echo nothing; else git commit -m "Resume live tracking after a page refresh" && git push; fi
