name: Apply MBTA station names + tripLogEditingId save fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/trip-mbta-save-fix.patch.gz.b64'
      - 'scripts/trip-mbta-save-fix.patch.gz.b64.part*'
      - '.github/workflows/apply-trip-mbta-save-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode patch, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, glob
          expected = "60be2645e957af6fb1eaa37022b75926089e0916357c4ab5ce54460cef001fd8"
          part_paths = sorted(
              [p for p in glob.glob('scripts/trip-mbta-save-fix.patch.gz.b64.part*')],
              key=lambda p: int(''.join(c for c in p.rsplit('part',1)[-1] if c.isdigit()) or 0)
          )
          blob = None
          if part_paths:
            blob = ''.join(pathlib.Path(p).read_text().strip() for p in part_paths)
            print('assembled parts', len(part_paths), 'len', len(blob), hashlib.sha256(blob.encode()).hexdigest()[:16])
          single = pathlib.Path('scripts/trip-mbta-save-fix.patch.gz.b64')
          if blob is None and single.exists():
            blob = single.read_text().strip()
            print('using single b64', len(blob))
          if not blob:
            raise SystemExit('no patch b64 found')
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
            raise SystemExit(f'full hash mismatch: {h}')
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path('/tmp/trip-mbta-save-fix.patch').write_bytes(raw)
          print('patch bytes', len(raw), 'hash ok')
          PY
          git apply /tmp/trip-mbta-save-fix.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert 'let tripLogEditingId = null' in t
          assert t.count('let tripLogEditingId = null') == 1
          assert 'function editTripLog' in t
          assert t.count('function editTripLog') == 1
          assert 'tripMbtaCanonicalStationId' in t
          assert 'MBTA_TRIP_CHILD_TO_PLACE' in t
          assert '/* Trip mbta stations + save editingId fix */' in t
          assert 'include=trip,stop' in t
          assert 'function rrAuthUser' in t
          assert 'rrStartMyTripsNearbyPrompt' in t
          assert 'rrTripMapTileUrl' in t
          assert 'northeastamtrakrailfanalt/ckyq285h5219a14mpql9jt2r7' in t
          assert 'background: var(--rr-trip-rail, #07093e)' in t
          assert '/* Trip live progress cards + post-trip enrich */' in t
          mt = Path('mytrips/index.html').read_text(errors='replace')
          assert 'let tripLogEditingId = null' in mt
          assert 'tripMbtaCanonicalStationId' in mt
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "Fix: MBTA trip-log station names + tripLogEditingId save ReferenceError"
            git pull --rebase origin main
            git push
          fi
