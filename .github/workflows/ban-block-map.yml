name: Ban block map

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/ban-block-map.py
      - .github/workflows/ban-block-map.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ban-block-map.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Block banned accounts from the map" && git push; fi
