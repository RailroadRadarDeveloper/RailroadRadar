name: apply-cookie-accounts
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-cookie-accounts.yml'
      - 'patches/cookie-accounts.patch'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          set -euo pipefail
          if grep -q "function formatAdminCookieCell" index.html; then
            echo already applied
            exit 0
          fi
          patch -p1 < patches/cookie-accounts.patch
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          git commit -m "Show cookie accept/reject status on admin accounts list"
          git push
