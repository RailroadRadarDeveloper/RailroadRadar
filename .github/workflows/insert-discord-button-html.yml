name: Insert Discord button HTML
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/insert-discord-button-html.py
      - .github/workflows/insert-discord-button-html.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/insert-discord-button-html.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add press/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Show Send to Discord beside Edit" && git push; fi
