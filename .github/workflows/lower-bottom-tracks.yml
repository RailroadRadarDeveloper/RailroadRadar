name: Lower bottom tracks
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/lower-bottom-tracks.py
      - .github/workflows/lower-bottom-tracks.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lower-bottom-tracks.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Move bottom-left MyTrips splash tracks lower" && git push; fi
