name: Apply trip map light
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/trip-map-light.patch.gz.b64'
      - '.github/workflows/apply-trip-map-light.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair b64 if needed, apply light map + detail polish, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, pathlib, base64, gzip
          expected = "c2825a35ef1dec195675ca716836ed0c2a678bd0dece36faaa08cf669e7454c1"
          path = pathlib.Path('scripts/trip-map-light.patch.gz.b64')
          if not path.exists():
            raise SystemExit('missing scripts/trip-map-light.patch.gz.b64')
          blob = path.read_text().strip()
          h = hashlib.sha256(blob.encode()).hexdigest()
          print('initial', len(blob), h)
          if h != expected:
            raise SystemExit(f'b64 sha256 mismatch (re-upload needed): {h}')
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path('/tmp/trip-map-light.patch').write_bytes(raw)
          print('gunzip ok', len(raw))
          PY
          git apply /tmp/trip-map-light.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert '/* Trip map light theme */' in t
          assert '/* Trip detail less transparent */' in t
          assert '/* Trip detail segment spacing */' in t
          assert 'mapbox/light-v11/tiles' in t
          i = t.find('function rrTripMapTileUrl')
          assert 'dark-v11' not in t[i:i+400]
          assert 'mapbox/dark-v11' in t
          assert 'data-seg-count' in t
          assert '/* Trip dual-rail diagonal */' in t
          assert Path('mytrips/index.html').read_text(errors='replace').count('/* Trip map light theme */') >= 1
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html scripts/trip-map-light.patch.gz.b64
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "My trips: light maps, denser detail glass, multi-seg spacing"
            git push
          fi
