name: Banner on tracker
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/banner-on-tracker.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/banner-on-tracker.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add live/user.html assets/js/live-share-bar.js
          if git diff --cached --quiet; then echo nothing; else git commit -m "Show the red sharing banner on the tracker page" && git push; fi
