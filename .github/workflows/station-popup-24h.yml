name: Station popup 24 hours
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/station-popup-24h.py
      - .github/workflows/station-popup-24h.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/station-popup-24h.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Show all station trains for the next 24 hours" && git push; fi
