name: Remove splash map link
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/remove-splash-map-link.py
      - .github/workflows/remove-splash-map-link.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/remove-splash-map-link.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Remove Back to the live map from MyTrips splash" && git push; fi
