name: Show mobile leaderboard icon
on:
  push:
    paths:
      - 'scripts/show-mobile-lb-icon.py'
      - '.github/workflows/show-mobile-lb-icon.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/show-mobile-lb-icon.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Show weekly leaderboard icon in the mobile header"
          git push
