name: Apply station audio stop match
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/station-audio-match.patch.gz.b64.part*'
      - '.github/workflows/apply-station-audio-match.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode patch and publish station audio
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, glob
          expected = "d47dbea0e6939b54e4addd77e30dbddf0c2234a1276f001266c6e469965dd70e"
          part_paths = sorted(
              [p for p in glob.glob('scripts/station-audio-match.patch.gz.b64.part*')],
              key=lambda p: int(''.join(c for c in p.rsplit('part',1)[-1] if c.isdigit()) or 0)
          )
          if not part_paths:
            raise SystemExit('no patch parts')
          blob = ''.join(pathlib.Path(p).read_text().strip() for p in part_paths)
          print('assembled parts', len(part_paths), 'len', len(blob), hashlib.sha256(blob.encode()).hexdigest())
          def swap_o0_45(s):
            return s.translate(str.maketrans({'o':'0','0':'o','4':'5','5':'4'}))
          got = hashlib.sha256(blob.encode()).hexdigest()
          if got != expected:
            alt = swap_o0_45(blob)
            ha = hashlib.sha256(alt.encode()).hexdigest()
            print('raw mismatch', got, 'swapped', ha)
            if ha == expected:
              blob = alt
              print('repaired o/0 and 5/4 swap')
            else:
              raise SystemExit('full hash mismatch: ' + got)
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path('/tmp/station-audio-match.patch').write_bytes(raw)
          print('patch bytes', len(raw), 'rejoin hash ok')
          PY
          git apply /tmp/station-audio-match.patch
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          t = Path('stationaudio/index.html').read_text(errors='replace')
          assert 'rr-station-audio-stop-match-2026-10-04' in t
          assert 'stopServesStation' in t
          assert 'The next train is' not in t
          assert 'mbtaCanonicalStopId' in t
          assert "VOICE_KEY = 'rr-station-audio-voice'" in t
          assert 'on track ' in t
          assert 'APPROACH_MI = 1.5' in t
          assert 'looseName(stop.name, station.name)' not in t
          h = hashlib.sha256(Path('stationaudio/index.html').read_bytes()).hexdigest()
          expected_html = "b87849a486f9515c9ed6bd0dcb225ee98e5ee5203851f8d111db1010e9a1fece"
          if h != expected_html:
            raise SystemExit('stationaudio sha mismatch ' + h)
          root = Path('index.html').read_text(errors='replace')
          assert 'rr-station-audio-stop-match-2026-10-04' not in root
          print('ok', len(t), h)
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add stationaudio/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "Station audio: announce only the selected station's next train"
            git pull --rebase origin main
            git push
          fi
