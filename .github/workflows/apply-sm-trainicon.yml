name: Apply special move train icon
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sm-trainicon.patch.gz.b64.part*'
      - '.github/workflows/apply-sm-trainicon.yml'
permissions:
  contents: write
concurrency:
  group: apply-sm-trainicon
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rejoin, verify, apply, clean up
        run: |
          set -eu
          if [ ! -f scripts/sm-trainicon.patch.gz.b64.part0 ]; then echo already applied; exit 0; fi
          echo "e6e94a0424a03cce4dadfc55fcaf3cf681d867160a2052a663af103ea53f0e19  index.html" | sha256sum -c -
          cat scripts/sm-trainicon.patch.gz.b64.part0 | tr -d ' \n\r' > /tmp/p.b64
          echo "4ecb4cd64cdd48e71e728267ead8cbe14b355a90064904f77aedb42968bfeaba  /tmp/p.b64" | sha256sum -c -
          base64 -d /tmp/p.b64 | gunzip > /tmp/p.patch
          patch --no-backup-if-mismatch index.html /tmp/p.patch
          echo "87115ad5f5cef8e8640dc5a9f7dc45d0b545ba4c6e2b3f5463058f4dd6a98258  index.html" | sha256sum -c -
          git rm -q scripts/sm-trainicon.patch.gz.b64.part0 .github/workflows/apply-sm-trainicon.yml
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          git commit -m "Special-move pins use the train icon and train popup again"
          git push origin HEAD:main
