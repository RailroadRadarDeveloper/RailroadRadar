name: Amtrak station dots
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/amtrak-station-dots.py
      - .github/workflows/amtrak-station-dots.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/amtrak-station-dots.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Add Amtrak station dots from all trains" && git push; fi
