name: Fill trip stop times
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/trip-fill-stop-times.py
      - .github/workflows/trip-fill-stop-times.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/trip-fill-stop-times.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Autofill origin and dest times from the picked train schedule" && git push; fi
