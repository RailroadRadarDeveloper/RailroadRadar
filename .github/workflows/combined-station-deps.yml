name: Combined Amtrak MBTA station lists
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/combined-station-deps.py
      - .github/workflows/combined-station-deps.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/combined-station-deps.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Combine Amtrak and MBTA trains in shared station departure lists" && git push; fi
