name: Embed MBTA icon
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/embed-mbta-icon.py
      - .github/workflows/embed-mbta-icon.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/embed-mbta-icon.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Embed MBTA icon in headings and map labels" && git push; fi
