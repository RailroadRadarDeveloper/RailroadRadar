name: Embed MBTA icon
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/embed-mbta-icon.py
      - .github/workflows/embed-mbta-icon.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          mkdir -p assets/icons
          curl -fsSL --max-time 120 "https://i.postimg.cc/qR9qn1bC/Untitled-design-(12).png" -o assets/icons/mbta.png
          python3 scripts/embed-mbta-icon.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add assets/icons/mbta.png index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Embed MBTA heading icon so it always loads" && git push; fi
