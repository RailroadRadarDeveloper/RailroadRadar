name: Live logo
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/live-logo.py
      - .github/workflows/live-logo.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/live-logo.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add live/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Use the RailroadRadar header logo on the live page" && git push; fi
