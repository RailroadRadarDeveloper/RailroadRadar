name: Apply Special Move share perm + no route line
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/special-move-share-perm-noline.meta'
      - 'scripts/special-move-share-perm-noline.b64.part001'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify hash, apply patch, publish mytrips
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, hashlib, pathlib, re
          expected = "0c09b3f0593a007dcd5c5f7c2ebd1236483ca4f414bbafecc33113c1bea9cafb"
          expected_html = "82a9c216fef0086067ca9b4f595e2a052c0591e2215f3091c513f5a6fb509d95"
          blob = None
          paths = sorted(pathlib.Path("scripts").glob("special-move-share-perm-noline.b64.part*"), key=lambda p: int(re.search(r"part(\d+)$", p.name).group(1)))
          if paths:
              if len(paths) != 17:
                  raise SystemExit("expected 17 parts, got %d" % len(paths))
              pieces = [p.read_text().strip() for p in paths]
              if any(len(piece) > 400 for piece in pieces):
                  raise SystemExit("a part is longer than 400 bytes")
              blob = "".join(pieces)
              print("assembled parts", len(paths), "len", len(blob))
          if blob is None:
              chunks = [pathlib.Path("scripts/special-move-share-perm-noline.patch.gz.b64.%d" % i) for i in (1,2,3)]
              if all(p.exists() for p in chunks):
                  blob = "".join(p.read_text().strip() for p in chunks)
                  print("using chunked b64", len(blob))
          if blob is None:
              single = pathlib.Path("scripts/special-move-share-perm-noline.patch.gz.b64")
              if single.exists():
                  blob = single.read_text().strip()
                  print("using single b64", len(blob))
          if not blob:
              raise SystemExit("no patch b64 found")
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
              raise SystemExit("b64 hash mismatch: %s" % h)
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path("/tmp/special-move-share-perm-noline.patch").write_bytes(raw)
          print("patch bytes", len(raw), "hash ok")
          PY
          git apply /tmp/special-move-share-perm-noline.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          t = Path('index.html').read_bytes()
          h = hashlib.sha256(t).hexdigest()
          assert h == "82a9c216fef0086067ca9b4f595e2a052c0591e2215f3091c513f5a6fb509d95", h
          text = t.decode('utf-8', errors='replace')
          assert '/* RR special-move share permission 2026-10-05 */' in text
          assert '/* RR special-move no route line 2026-10-05 */' in text
          assert 'rrSpecialSharePending' in text
          assert 'rrSpecialAbortPendingShare' in text
          assert 'async function rrSpecialStartSharing' not in text
          assert 'Sharing is ON only after a successful geo fix' in text
          assert 'Never auto-request geolocation on /mytrips' in text
          assert 'never auto-grant geo on /mytrips' in text
          assert 'Special move / extra: OD dots only' in text
          assert 'specialMoveShares' in text
          assert 'trip-detail-share-loc' in text
          mt = Path('mytrips/index.html').read_text(errors='replace')
          assert 'share permission 2026-10-05' in mt
          assert 'no route line 2026-10-05' in mt
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "MyTrips: Share requires location permission; special-move OD dots only"
            git pull --rebase origin main
            git push
          fi
