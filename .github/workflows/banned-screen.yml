name: Banned screen

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/banned-screen.py
      - .github/workflows/banned-screen.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/banned-screen.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Show banned account screen and keep login/trip blocks" && git push; fi
