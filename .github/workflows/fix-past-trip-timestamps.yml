name: Fix past trip timestamps

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fix-past-trip-timestamps.py
      - .github/workflows/fix-past-trip-timestamps.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-past-trip-timestamps.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Parse Firestore timestamps so past trip stats appear" && git push; fi
