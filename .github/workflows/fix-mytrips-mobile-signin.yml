name: Fix MyTrips mobile sign-in
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fix-mytrips-mobile-signin.py
      - .github/workflows/fix-mytrips-mobile-signin.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-mytrips-mobile-signin.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Fix MyTrips Log in and Get Started on mobile" && git push; fi
