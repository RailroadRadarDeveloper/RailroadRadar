name: Restore banner
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/restore-banner.py
      - .github/workflows/restore-banner.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore-banner.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add live/user.html assets/js/live-share-bar.js
          if git diff --cached --quiet; then echo nothing; else git commit -m "Restore the red sharing banner above the live stats" && git push; fi
