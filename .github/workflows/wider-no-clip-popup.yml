name: Wider no clip popup

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/wider-no-clip-popup.py
      - .github/workflows/wider-no-clip-popup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/wider-no-clip-popup.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Widen popups and disable overflow clipping" && git push; fi
