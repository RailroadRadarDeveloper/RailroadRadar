name: Replace leaderboard icons

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/replace-lb-icons.yml
      - scripts/replace-lb-icons.py
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download icons from PostImg
        run: |
          mkdir -p assets/icons
          curl -fsSL -A "Mozilla/5.0" -o assets/icons/leaderboard-trophy.png "https://i.postimg.cc/18rGsqpD/Untitled-design-(10).png"
          curl -fsSL -A "Mozilla/5.0" -o assets/icons/leaderboard-bars.png "https://i.postimg.cc/PCQWTwmz/Untitled-design-(9).png"
          python3 -c "from pathlib import Path; t=Path('assets/icons/leaderboard-trophy.png').read_bytes(); b=Path('assets/icons/leaderboard-bars.png').read_bytes(); assert t[:8]==b'\\x89PNG\\r\\n\\x1a\\n', t[:20]; assert b[:8]==b'\\x89PNG\\r\\n\\x1a\\n', b[:20]; print(len(t), len(b))"
      - name: Patch index.html
        run: python3 scripts/replace-lb-icons.py
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/icons/leaderboard-trophy.png assets/icons/leaderboard-bars.png index.html
          if git diff --cached --quiet; then
            echo No changes
            exit 0
          fi
          git commit -m "Use new trophy and bar-chart icons on the weekly leaderboard"
          git push
