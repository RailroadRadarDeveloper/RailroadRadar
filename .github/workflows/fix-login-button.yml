name: Fix login button
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fix-login-button.py
      - .github/workflows/fix-login-button.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-login-button.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Log in button starts Google sign-in directly" && git push; fi
