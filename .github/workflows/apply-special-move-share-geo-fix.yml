name: Apply Special Move share geo fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/special-move-share-geo-fix.meta'
      - 'scripts/special-move-share-geo-fix.b64.part001'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify hash, apply patch, publish mytrips
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, hashlib, pathlib, re
          expected = "70dee087591629e7c1a6179a9f3364be2d2663005da925617018bc8194f364e5"
          expected_html = "65db048e918a8bbe873889daed00bd126b55fc46fdfeadba28fd62c966f13f3f"
          blob = None
          paths = sorted(pathlib.Path("scripts").glob("special-move-share-geo-fix.b64.part*"), key=lambda p: int(re.search(r"part(\d+)$", p.name).group(1)))
          if paths:
              if len(paths) != 16:
                  raise SystemExit("expected 16 parts, got %d" % len(paths))
              pieces = [p.read_text().strip() for p in paths]
              if any(len(piece) > 400 for piece in pieces):
                  raise SystemExit("a part is longer than 400 bytes")
              blob = "".join(pieces)
              print("assembled parts", len(paths), "len", len(blob))
          if blob is None:
              chunks = [pathlib.Path("scripts/special-move-share-geo-fix.patch.gz.b64.%d" % i) for i in (1,2,3)]
              if all(p.exists() for p in chunks):
                  blob = "".join(p.read_text().strip() for p in chunks)
                  print("using chunked b64", len(blob))
          if blob is None:
              single = pathlib.Path("scripts/special-move-share-geo-fix.patch.gz.b64")
              if single.exists():
                  blob = single.read_text().strip()
                  print("using single b64", len(blob))
          if not blob:
              raise SystemExit("no patch b64 found")
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
              raise SystemExit("b64 hash mismatch: %s" % h)
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path("/tmp/special-move-share-geo-fix.patch").write_bytes(raw)
          print("patch bytes", len(raw), "hash ok")
          PY
          git apply /tmp/special-move-share-geo-fix.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          t = Path('index.html').read_bytes()
          h = hashlib.sha256(t).hexdigest()
          assert h == "65db048e918a8bbe873889daed00bd126b55fc46fdfeadba28fd62c966f13f3f", h
          text = t.decode('utf-8', errors='replace')
          assert '/* RR special-move share geo fix 2026-10-05 */' in text
          assert 'Waiting for location' in text
          assert 'maximumAge: 0' in text
          assert 'Firestore write failed (permission-denied)' in text
          assert 'poison Special-move Share' in text
          assert 'SYNCHRONOUSLY so getCurrentPosition' in text
          assert 'defer geo until Share' in text
          assert 'specialMoveShares' in text
          assert 'trip-detail-share-loc' in text
          mt = Path('mytrips/index.html').read_text(errors='replace')
          assert 'share geo fix 2026-10-05' in mt
          assert 'Waiting for location' in mt
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "MyTrips: fix Special-move Share geo prompt + visible Firestore errors"
            git pull --rebase origin main
            git push
          fi
