name: Keep splash navy
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/mytrips-splash-navy.py
      - .github/workflows/mytrips-splash-navy.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/mytrips-splash-navy.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Keep RailroadRadar navy behind MyTrips splash track art" && git push; fi
