name: Apply public profile trip maps
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/user-trip-maps.patch.gz.b64.mega*'
      - 'scripts/user-trip-maps.heals.json'
      - '.github/workflows/apply-user-trip-maps.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble from mega parts and publish user/index.html
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, json, pathlib, glob, re
          expected = "0c0465f4f94eba8da267fa08e8d96c19fa1f8fb6497f12b246b69937cbb0328b"
          expected_raw = "91075cfaa9c5fbf583c5a34e4e798b5ec5efba313160bf130740b8420bd78aa7"
          heal_path = pathlib.Path('scripts/user-trip-maps.heals.json')
          HEALS = json.loads(heal_path.read_text()) if heal_path.exists() else {}
          for path, fixes in HEALS.items():
            p = pathlib.Path(path)
            if not p.exists():
              continue
            t = list(p.read_text().strip())
            for i_str, ch in fixes.items():
              i = int(i_str)
              if i < len(t) and t[i] != ch:
                print('heal', path, i, t[i], '->', ch)
                t[i] = ch
            p.write_text(''.join(t))
          def load_half(i, half):
            pattern = f'scripts/user-trip-maps.patch.gz.b64.mega{i}{half}.s*.hex'
            slices = sorted(glob.glob(pattern), key=lambda p: int(re.search(r'\.s(\d+)\.hex$', p).group(1)))
            if slices:
              return ''.join(pathlib.Path(p).read_text().strip() for p in slices), f'slices:{len(slices)}'
            p = pathlib.Path(f'scripts/user-trip-maps.patch.gz.b64.mega{i}{half}.hex')
            if p.exists():
              return p.read_text().strip(), 'half.hex'
            return None, None
          parts = []
          for i in range(1, 11):
            a, asrc = load_half(i, 'a')
            b, bsrc = load_half(i, 'b')
            hx = pathlib.Path(f'scripts/user-trip-maps.patch.gz.b64.mega{i}.hex')
            tx = pathlib.Path(f'scripts/user-trip-maps.patch.gz.b64.mega{i}')
            if a is not None and b is not None:
              blob_i = bytes.fromhex((a+b).replace('\n','').replace(' ','')).decode('ascii')
              src = f'{asrc}+{bsrc}'
            elif hx.exists():
              blob_i = bytes.fromhex(hx.read_text().strip()).decode('ascii')
              src = 'hex'
            elif tx.exists():
              blob_i = tx.read_text().strip()
              src = 'text'
            else:
              raise SystemExit(f'missing mega{i}')
            parts.append(blob_i)
            print(f'mega{i} from {src}', len(blob_i))
          blob = ''.join(parts)
          print('megas', len(parts), 'len', len(blob), hashlib.sha256(blob.encode()).hexdigest())
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
            raise SystemExit(f'full hash mismatch: {h}')
          raw = gzip.decompress(base64.b64decode(blob))
          if hashlib.sha256(raw).hexdigest() != expected_raw:
            raise SystemExit('raw hash mismatch')
          text = raw.decode('utf-8')
          for marker in ['Public profile trip maps','rrTripMapTileUrl','AMTRAK_TRIP_STATIONS','MNR_TRIP_STATIONS','findTripStation','paintTripLogMiniMap','hiddenPublic','Public user profile page','northeastamtrakrailfanalt/ckyq285h5219a14mpql9jt2r7']:
            if marker not in text:
              raise SystemExit('missing marker: '+marker)
          pathlib.Path('user').mkdir(exist_ok=True)
          pathlib.Path('user/index.html').write_bytes(raw)
          pathlib.Path('scripts/user-trip-maps.patch.gz.b64').write_text(blob)
          print('ok', len(raw))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add user/index.html scripts/user-trip-maps.patch.gz.b64
          if git diff --cached --quiet; then echo nothing
          else
            git commit -m "Fix: public profile trip card maps (station catalogs + Mapbox tiles)"
            git pull --rebase origin main || true
            git push
          fi
