name: Apply trip Amtrak stations + rail cards + no fade
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/trip-amtrak-card-nofade.patch.gz.b64'
      - '.github/workflows/apply-trip-amtrak-card-nofade.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode patch, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, pathlib, sys
          expected = "3a37867b769d79fbc28a59e0e536a025dcea99a3739445c7f962c0cd31511d29"
          single = pathlib.Path('scripts/trip-amtrak-card-nofade.patch.gz.b64')
          if not single.exists():
            raise SystemExit('missing scripts/trip-amtrak-card-nofade.patch.gz.b64')
          blob = single.read_text().strip()
          print('using single b64', len(blob))
          h=hashlib.sha256(blob.encode()).hexdigest()
          if h!=expected:
            raise SystemExit(f'full hash mismatch: {h}')
          pathlib.Path('/tmp/all.b64').write_text(blob)
          print('hash ok')
          PY
          base64 -d /tmp/all.b64 | gunzip > /tmp/trip-amtrak-card-nofade.patch
          git apply /tmp/trip-amtrak-card-nofade.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert 'AMTRAK_TRIP_STATIONS' in t
          assert "rr === 'amtrak' && typeof AMTRAK_TRIP_STATIONS" in t
          assert 'Trip mini-map fade removed' in t
          assert 'trip-log-row-map:not(.is-empty):not(.is-loading)::after' not in t
          assert 'railroad-color fill' in t
          assert 'trip-log-rolling-stock' in t
          assert 'rollingStock' in t
          assert '<textarea id="trip-log-notes"' in t
          assert 'trip-detail-stock' in t
          assert 'trip-log-row-stock' in t
          assert 'Trip amtrak-card-nofade:' in t
          assert Path('mytrips/index.html').read_text(errors='replace').count('AMTRAK_TRIP_STATIONS') >= 1
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "My trips: Amtrak stations, rail-colored cards, no map fade, rolling stock/notes"
            git push
          fi
