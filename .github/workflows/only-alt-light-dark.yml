name: Keep only Alt Light and Dark maps
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/only-alt-light-dark.py'
      - '.github/workflows/only-alt-light-dark.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python3 scripts/only-alt-light-dark.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          rm -f scripts/only-alt-light-dark.py .github/workflows/only-alt-light-dark.yml
          git add -A scripts/only-alt-light-dark.py .github/workflows/only-alt-light-dark.yml || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Keep only Alt Light and Dark map options"
          git push
