name: Live share bar
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/live-share-bar.py
      - .github/workflows/live-share-bar.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/live-share-bar.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Keep the live sharing bar on MyTrips after refresh" && git push; fi
