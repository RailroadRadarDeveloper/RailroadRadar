name: Apply MyTrips trip map main-style tiles
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/trip-map-main-style.patch.gz.b64'
      - 'scripts/trip-map-main-style.patch.gz.b64.part*'
      - '.github/workflows/apply-trip-map-main-style.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode patch, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, glob
          expected = "ab46ec98fc01b2702390f4211fd072524748990abb0578da28c25f9b0d8afb26"
          part_paths = sorted(
              [p for p in glob.glob('scripts/trip-map-main-style.patch.gz.b64.part*')],
              key=lambda p: int(''.join(c for c in p.rsplit('part',1)[-1] if c.isdigit()) or 0)
          )
          blob = None
          if part_paths:
            blob = ''.join(pathlib.Path(p).read_text().strip() for p in part_paths)
            print('assembled parts', len(part_paths), 'len', len(blob), hashlib.sha256(blob.encode()).hexdigest()[:16])
          single = pathlib.Path('scripts/trip-map-main-style.patch.gz.b64')
          if blob is None and single.exists():
            blob = single.read_text().strip()
            print('using single b64', len(blob))
          if not blob:
            raise SystemExit('no patch b64 found')
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
            raise SystemExit(f'full hash mismatch: {h}')
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path('/tmp/trip-map-main-style.patch').write_bytes(raw)
          print('patch bytes', len(raw), 'hash ok')
          PY
          git apply /tmp/trip-map-main-style.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert 'Trip map main-style tiles' in t
          i = t.find('function rrTripMapTileUrl')
          snip = t[i:i+450]
          assert 'northeastamtrakrailfanalt/ckyq285h5219a14mpql9jt2r7' in snip
          assert 'mapbox/light-v11' not in snip
          assert 'northeastamtrakrailfanalt/ckyq285h5219a14mpql9jt2r7' in t  # main map style still present
          assert 'background: var(--rr-trip-rail, #07093e)' in t
          assert 'Trip cards wider + no outer frame' in t
          mt = Path('mytrips/index.html').read_text(errors='replace')
          assert 'Trip map main-style tiles' in mt
          mi = mt.find('function rrTripMapTileUrl')
          assert 'northeastamtrakrailfanalt/ckyq285h5219a14mpql9jt2r7' in mt[mi:mi+450]
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "MyTrips: trip card minimaps use main-map default style"
            git pull --rebase origin main
            git push
          fi
