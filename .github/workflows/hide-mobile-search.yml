name: Hide mobile search

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/hide-mobile-search.py
      - .github/workflows/hide-mobile-search.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch index.html
        run: python3 scripts/hide-mobile-search.py
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then
            echo No changes
            exit 0
          fi
          git commit -m "Hide header search bar on mobile screens"
          git push
