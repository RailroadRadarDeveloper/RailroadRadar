name: Hide mobile search
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hide-mobile-search.yml'
      - '.github/trigger-hide-mobile-search'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '''      .header-search-container {
        width: 100%;
        max-width: none;
      }'''
          new = '''      .header-search-container {
        display: none !important;
      }
      .header-search-results,
      .search-type-dropdown {
        display: none !important;
      }'''
          count = text.count(old)
          if count == 0:
              print('already patched or target missing')
          elif count != 1:
              raise SystemExit(f'expected 1 match, got {count}')
          else:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('patched ok')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m "Hide header search bar on mobile screens"
          git push
