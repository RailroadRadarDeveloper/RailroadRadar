name: Apply Amtrak lateness status
on:
  push:
    branches: [main]
    paths:
      - 'scripts/amtrak-lateness.patch.gz.b64.part*'
      - '.github/workflows/apply-amtrak-lateness.yml'
permissions:
  contents: write
concurrency:
  group: apply-amtrak-lateness
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rejoin, verify, apply, clean up
        run: |
          set -eu
          if [ ! -f scripts/amtrak-lateness.patch.gz.b64.part0 ]; then echo already applied; exit 0; fi
          echo "87115ad5f5cef8e8640dc5a9f7dc45d0b545ba4c6e2b3f5463058f4dd6a98258  index.html" | sha256sum -c -
          cat scripts/amtrak-lateness.patch.gz.b64.part0 | tr -d ' \n\r' > /tmp/p.b64
          echo "95fb2fe79daf4970b1e4dd8988ac9280d3374a89e78b88916e898b29dcb62278  /tmp/p.b64" | sha256sum -c -
          base64 -d /tmp/p.b64 | gunzip > /tmp/p.patch
          patch --no-backup-if-mismatch index.html /tmp/p.patch
          echo "a8919db9f7b617d75ccf4b7aa182d197a015ed396855255ee1335d5ee8113f90  index.html" | sha256sum -c -
          git rm -q scripts/amtrak-lateness.patch.gz.b64.part0 .github/workflows/apply-amtrak-lateness.yml
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          git commit -m "Amtrak popups show On Time, Delayed or Early like MBTA instead of Active"
          git push origin HEAD:main
