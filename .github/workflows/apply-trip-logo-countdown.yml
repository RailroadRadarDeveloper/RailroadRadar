name: Apply trip logo countdown

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/trip-logo-countdown.patch.gz.b64'
      - '.github/workflows/apply-trip-logo-countdown.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Decode, verify, apply patch
        run: |
          set -euo pipefail
          B64=scripts/trip-logo-countdown.patch.gz.b64
          test -f "$B64"
          EXPECTED_SHA="13cbb7ac9ec69aceb17778cd25b8f89ac8545fc8de6c0bdb50b7e26baf6ebd1b"
          ACTUAL_SHA=$(sha256sum "$B64" | awk '{print $1}')
          echo "b64 sha256=$ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::b64 SHA mismatch (got $ACTUAL_SHA expected $EXPECTED_SHA)"
            exit 1
          fi
          python3 - <<'PY'
          import base64, gzip, pathlib, sys
          b64 = pathlib.Path("scripts/trip-logo-countdown.patch.gz.b64").read_text().strip()
          raw = gzip.decompress(base64.b64decode(b64))
          pathlib.Path("/tmp/trip-logo-countdown.patch").write_bytes(raw)
          for m in [b"Trip share logo bigger", b"Trip countdown solid white", b"Trip route to visible on white segs", b"trip-route-station", b"minSide * 0.11"]:
              if m not in raw:
                  print("missing marker", m)
                  sys.exit(1)
          print("patch bytes", len(raw))
          PY
          git apply --whitespace=nowarn /tmp/trip-logo-countdown.patch || {
            echo "git apply failed; trying patch -p0"
            patch -p0 --forward < /tmp/trip-logo-countdown.patch
          }
          if [ -f mytrips/index.html ]; then
            cp -a index.html mytrips/index.html
          fi
          grep -q "Trip share logo bigger" index.html
          grep -q "Trip countdown solid white" index.html
          grep -q "Trip route to visible on white segs" index.html
          grep -q "trip-detail-seg .trip-route-station" index.html
          ! grep -q "canvas.height \* 0.055" index.html
          echo "markers OK"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "RailroadRadar Bot"
          git config user.email "bot@railroadradar.com"
          git add index.html mytrips/index.html 2>/dev/null || git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "My trips: bigger share logo, solid countdown, dark text on white segs"
          git push origin HEAD:main
