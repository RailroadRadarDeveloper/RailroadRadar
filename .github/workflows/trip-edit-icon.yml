name: Trip edit icon

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/trip-edit-icon.py
      - .github/workflows/trip-edit-icon.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/trip-edit-icon.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Add edit icon to MyTrips cards" && git push; fi
