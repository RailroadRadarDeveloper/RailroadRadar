name: Live service name
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/live-service-name.py
      - .github/workflows/live-service-name.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/live-service-name.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Live trips show the service name and railroad" && git push; fi
