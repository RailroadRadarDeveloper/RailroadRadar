name: Mobile stop list

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/mobile-stop-list.py
      - .github/workflows/mobile-stop-list.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/mobile-stop-list.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Improve mobile stop list readability and keep check icons" && git push; fi
