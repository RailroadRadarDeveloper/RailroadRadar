name: Optional route fields
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/optional-route-fields.py
      - .github/workflows/optional-route-fields.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/optional-route-fields.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Make railroad, line, origin, and destination optional" && git push; fi
