name: Ban logo only

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/ban-logo-only.py
      - .github/workflows/ban-logo-only.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ban-logo-only.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Show only the RailroadRadar logo when an account is banned" && git push; fi
