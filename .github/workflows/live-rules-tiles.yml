name: Live rules tiles
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/live-rules-tiles.py
      - .github/workflows/live-rules-tiles.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/live-rules-tiles.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add firestore.rules live/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Open live share reads and use OpenStreetMap tiles" && git push; fi
