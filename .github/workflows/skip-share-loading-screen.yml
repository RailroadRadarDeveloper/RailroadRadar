name: Skip share loading screen
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/skip-share-loading-screen.py
      - .github/workflows/skip-share-loading-screen.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/skip-share-loading-screen.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Do not show loading screen on train share links" && git push; fi
