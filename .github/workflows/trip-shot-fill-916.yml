name: Fill trip screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/trip-shot-fill-916.py
      - .github/workflows/trip-shot-fill-916.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/trip-shot-fill-916.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Capture trips in a full 9:16 frame with no letterbox" && git push; fi
