name: Fix stop status chip

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fix-stop-status-chip.py
      - .github/workflows/fix-stop-status-chip.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-stop-status-chip.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Show full live time in the stop status chip" && git push; fi
