name: Stop two times

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/stop-two-times.py
      - .github/workflows/stop-two-times.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/stop-two-times.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Show scheduled time plus On time or Now live time" && git push; fi
