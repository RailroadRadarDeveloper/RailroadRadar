name: Fix map tiles

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fix-map-tiles.py
      - .github/workflows/fix-map-tiles.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-map-tiles.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Prefetch more map tiles and redraw after the header layout change" && git push; fi
