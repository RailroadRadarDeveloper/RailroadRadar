name: restore-index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-index.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full index.html from last good commit
        run: |
          set -euo pipefail
          git checkout b95bcfe5db118cb76c3542d27d668a182ed651f8 -- index.html
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "index.html already restored"
            exit 0
          fi
          git commit -m "Restore index.html gutted by Copilot cookie-consent edit"
          git push
