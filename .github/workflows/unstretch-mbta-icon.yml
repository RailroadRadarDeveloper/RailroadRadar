name: Unstretch MBTA icon
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/unstretch-mbta-icon.py
      - .github/workflows/unstretch-mbta-icon.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/unstretch-mbta-icon.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Keep MBTA icon aspect ratio and make it a bit larger" && git push; fi
