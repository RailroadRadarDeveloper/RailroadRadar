name: Apply trip white relative
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/trip-white-relative.patch.gz.b64'
      - '.github/workflows/apply-trip-white-relative.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode patch, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, pathlib, sys
          expected = "87b1be3fe04a6834d331dca1b1da79fe47969efb9b5c6f5386945834c41b8995"
          single = pathlib.Path('scripts/trip-white-relative.patch.gz.b64')
          if not single.exists():
            raise SystemExit('missing scripts/trip-white-relative.patch.gz.b64')
          blob = single.read_text().strip()
          print('using single b64', len(blob))
          h=hashlib.sha256(blob.encode()).hexdigest()
          if h!=expected:
            raise SystemExit(f'full hash mismatch: {h}')
          pathlib.Path('/tmp/all.b64').write_text(blob)
          print('hash ok')
          PY
          base64 -d /tmp/all.b64 | gunzip > /tmp/trip-white-relative.patch
          git apply /tmp/trip-white-relative.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert '/mytrips white chrome' in t
          assert 'background: #fff !important;' in t
          assert 'formatTripRelativeDepart' in t
          assert 'id="trip-detail-relative"' in t
          assert 'trip-log-row-relative' in t
          assert 'html.rr-mytrips-page #trip-log-close' in t
          assert 'display: none !important;' in t
          assert 'Departs in ' in t
          assert 'Departed ' in t
          assert 'rrTripMapTileLayer' in t
          assert 'mapbox/dark-v11' in t
          assert 'dark inverted chrome' not in t
          assert Path('mytrips/index.html').read_text(errors='replace').count('formatTripRelativeDepart') >= 1
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "My trips: white chrome, remove X, relative depart timing"
            git push
          fi
