name: Publish track geometry
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rejoin verified packs and build Amtrak
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, hashlib, pathlib
          root = pathlib.Path("scripts/shape-geom")
          specs = {
            "mbta": (22, "c394291c778a7c78f8da805ec734cbd332f8933005e4d79b1ea14ba754ceebe6", "99c9a2be0d0ef93f7b3f608732eceb8c40f374e95c7d8ee5fd12a3db7e7c1e8e"),
            "lirr": (11, "0a37eddcb465a4524915783f90dc495338931166cfac0de57eb1a6346c46aa4a", "b864c63315a3a87a3fd094bd9454fcf40d770eb499a9d209220bbae742d76b73"),
            "mnr": (13, "9332312fb81e4053519e9b3861a3deb5dae56a56baa1faffdae25d56875053b1", "9f6a2f737add354d8646f94fc44632722269ebb7cc11e09d66e4b32c42048576"),
          }
          out = pathlib.Path("assets/shapes")
          out.mkdir(parents=True, exist_ok=True)
          for name, (n, b64sha, rawsha) in specs.items():
              parts = []
              for i in range(n):
                  parts.append((root / ("%s.b64.part%02d" % (name, i))).read_text())
              blob = "".join(parts).encode()
              got = hashlib.sha256(blob).hexdigest()
              if got != b64sha:
                  raise SystemExit("%s b64 %s" % (name, got))
              raw = gzip.decompress(base64.b64decode(blob))
              got = hashlib.sha256(raw).hexdigest()
              if got != rawsha:
                  raise SystemExit("%s raw %s" % (name, got))
              if name == "mbta" and b"CR-Haverhill" not in raw:
                  raise SystemExit("Haverhill missing")
              (out / ("%s.json" % name)).write_bytes(raw)
              print(name, len(raw), got)
          chunks = []
          for i in range(22):
              chunks.append((root / ("amtrak-build.py.part%02d" % i)).read_text())
          src = "".join(chunks)
          got = hashlib.sha256(src.encode()).hexdigest()
          expect = "4ffa0c0616d43ef561444aa1e565eea08b4a13c23fed84e3fbd43894473fba36"
          if got != expect:
              raise SystemExit("amtrak script %s" % got)
          pathlib.Path("/tmp/build_amtrak.py").write_text(src)
          print("amtrak script", got)
          PY
          OSM_CACHE=/tmp/osm-cache python3 /tmp/build_amtrak.py
          python3 - << 'PY'
          import json
          d = json.load(open("assets/shapes/amtrak.json"))
          assert d["agency"] == "amtrak"
          by = {r["name"]: r for r in d["routes"]}
          assert "CR-Haverhill" not in json.dumps(d)
          for name, n in (("Empire Builder", 2), ("Lake Shore Limited", 2), ("Amtrak Cascades", 2), ("Northeast Regional", 2), ("Floridian", 2), ("Amtrak Hartford Line", 1)):
              polys = by[name]["polylines"]
              if len(polys) < n or any(len(p) < 2 for p in polys):
                  raise SystemExit("bad " + name)
          print("amtrak routes", len(d["routes"]))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add assets/shapes/mbta.json assets/shapes/lirr.json assets/shapes/mnr.json assets/shapes/amtrak.json
          if git diff --cached --quiet; then
            echo "geometry already published"
          else
            git commit -m "Publish track-following MBTA, LIRR, Metro-North, and Amtrak route geometry."
            git pull --rebase origin main
            git push origin HEAD:main
          fi
