name: Live trip map
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/live-trip-map.py
      - .github/workflows/live-trip-map.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/live-trip-map.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Show a map for live trips without stations" && git push; fi
