name: Force press republish
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/touch-press-publish.py
      - .github/workflows/touch-press-publish.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/touch-press-publish.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add press/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Republish press page with Send to Discord button" && git push; fi
