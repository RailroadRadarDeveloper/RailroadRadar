name: Apply Better Stack and denied copy
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-betterstack-and-denied-copy.yml'
      - 'scripts/apply-betterstack-and-denied-copy.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply site patches
        run: |
          set -euo pipefail
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          python3 scripts/apply-betterstack-and-denied-copy.py
          git add index.html admin.html 404.html offline.html policies/privacy/index.html policies/terms-of-use/index.html scripts/build-admin-page.py
          if git diff --cached --quiet; then
            echo nothing to commit
          else
            git commit -m "Install Better Stack JS tag and update Access denied copy"
            git push
          fi
