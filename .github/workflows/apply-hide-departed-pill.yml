name: Apply hide Departed stop pill
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/hide-departed-pill.patch.gz.b64'
      - 'scripts/hide-departed-pill.patch.gz.b64.part*'
      - '.github/workflows/apply-hide-departed-pill.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode patch, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, glob
          expected = "e4b5e4ee3679a1e8bbc0acebca2860976966d2339a9b78fc968fb9eaf4224e3c"
          part_paths = sorted(
              [p for p in glob.glob('scripts/hide-departed-pill.patch.gz.b64.part*')],
              key=lambda p: int(''.join(c for c in p.rsplit('part',1)[-1] if c.isdigit()) or 0)
          )
          blob = None
          if part_paths:
            blob = ''.join(pathlib.Path(p).read_text().strip() for p in part_paths)
            print('assembled parts', len(part_paths), 'len', len(blob), hashlib.sha256(blob.encode()).hexdigest()[:16])
          single = pathlib.Path('scripts/hide-departed-pill.patch.gz.b64')
          if blob is None and single.exists():
            blob = single.read_text().strip()
            print('using single b64', len(blob))
          if not blob:
            raise SystemExit('no patch b64 found')
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
            raise SystemExit(f'full hash mismatch: {h}')
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path('/tmp/hide-departed-pill.patch').write_bytes(raw)
          print('patch bytes', len(raw), 'hash ok')
          PY
          git apply /tmp/hide-departed-pill.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert 'rr-ui-fix-2026-09-28g' in t
          assert 'statusHtml' in t
          assert "disp = 'Departed'" not in t
          assert 'Departed ·' not in t
          assert 'no Departed (or late-Departed) status pill' in t
          assert 'rr-ui-fix-2026-09-28f: smaller stop-row' not in t
          assert 'm._rrStops' in t
          assert Path('mytrips/index.html').read_text(errors='replace').count('rr-ui-fix-2026-09-28g') >= 1
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "UI: hide Departed/passed stop-status pill in train popup (28g)"
            git pull --rebase origin main
            git push
          fi
