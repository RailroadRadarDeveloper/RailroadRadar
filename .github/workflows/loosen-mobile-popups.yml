name: Loosen mobile popups

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/loosen-mobile-popups.py
      - .github/workflows/loosen-mobile-popups.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/loosen-mobile-popups.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Give train popups a usable width on mobile" && git push; fi
