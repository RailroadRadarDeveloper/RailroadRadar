name: Apply MyTrips live feed match
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/mytrips-live-feeds.patch.gz.b64'
      - 'scripts/mytrips-live-feeds.patch.gz.b64.part*'
      - '.github/workflows/apply-mytrips-live-feeds.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode patch, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, glob
          expected = "5185308f1c62268ca29aa9b0377bbfc212cfdcbcf75ecf81b806f0b95e124b37"
          part_paths = sorted(
              [p for p in glob.glob('scripts/mytrips-live-feeds.patch.gz.b64.part*')],
              key=lambda p: int(''.join(c for c in p.rsplit('part',1)[-1] if c.isdigit()) or 0)
          )
          blob = None
          if part_paths:
            blob = ''.join(pathlib.Path(p).read_text().strip() for p in part_paths)
            print('assembled parts', len(part_paths), 'len', len(blob), hashlib.sha256(blob.encode()).hexdigest())
          single = pathlib.Path('scripts/mytrips-live-feeds.patch.gz.b64')
          if blob is None and single.exists():
            blob = single.read_text().strip()
            print('using single b64', len(blob))
          if not blob:
            raise SystemExit('no patch b64 found')
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
            raise SystemExit(f'full hash mismatch: {h}')
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path('/tmp/mytrips-live-feeds.patch').write_bytes(raw)
          print('patch bytes', len(raw), 'hash ok')
          PY
          git apply /tmp/mytrips-live-feeds.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert 'MyTrips live feeds for in-progress cards' in t
          assert 'window.rrEnsureMyTripsLiveFeeds' in t
          assert 'function rrEnsureMyTripsLiveFeeds' in t
          assert 'Looking for your train' in t
          assert 'TRIP_LIVE_LIST_POLL_MS = 55000' in t
          assert 'tripIsInProgressLight' in t
          assert 'Finished past trips' in t
          assert 'function rrAuthUser' in t or 'rrAuthUser' in t
          assert 'rrAuthSafariItp' in t
          assert 'rrStartMyTripsNearbyPrompt' in t
          assert 'tripMbtaCanonicalStationId' in t
          assert 'rrTripMapTileUrl' in t
          assert 'northeastamtrakrailfanalt/ckyq285h5219a14mpql9jt2r7' in t
          assert 'tripTryEnrichActualTimes' in t
          assert 'startTripLiveTracking' in t
          mt = Path('mytrips/index.html').read_text(errors='replace')
          assert 'rrEnsureMyTripsLiveFeeds' in mt
          assert 'Looking for your train' in mt
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "MyTrips: load live vehicles so in-progress cards can match trains"
            git push
          fi
