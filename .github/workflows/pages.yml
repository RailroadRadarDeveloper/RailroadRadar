name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Publish only the website, not the Firebase rules, worker snippets, or README.
      - name: Collect site files
        run: rsync -a --exclude='.*' --exclude=_site --exclude=workers --exclude='*.rules' --exclude=README.md ./ _site/
      # mytrips/index.html is a symlink to index.html; this step follows it.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
