name: Sort upcoming trips soonest first
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/sort-upcoming-trips.py
      - .github/workflows/sort-upcoming-trips.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sort-upcoming-trips.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Show soonest upcoming trip first" && git push; fi
