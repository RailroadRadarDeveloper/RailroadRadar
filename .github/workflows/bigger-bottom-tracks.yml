name: Bigger bottom tracks
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/bigger-bottom-tracks.py
      - .github/workflows/bigger-bottom-tracks.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/bigger-bottom-tracks.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Make bottom-left MyTrips splash track art larger" && git push; fi
