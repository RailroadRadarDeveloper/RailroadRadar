name: Publish railroad picker
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/rail-picker.patch.gz.b64'
      - '.github/workflows/publish-rail-picker.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply railroad picker patch
        run: |
          set -euo pipefail
          base64 -d scripts/rail-picker.patch.gz.b64 | gunzip > /tmp/rail-picker.patch
          patch -p0 < /tmp/rail-picker.patch
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo nothing to commit
          else
            git commit -m "Add pre-load railroad picker to cut map lag"
            git push
          fi
