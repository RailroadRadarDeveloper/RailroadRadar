name: Apply public profile button + stats correctness
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/public-profile-stats.patch.gz.b64'
      - 'scripts/public-profile-stats.patch.gz.b64.part*'
      - '.github/workflows/apply-public-profile-stats.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode patch, apply, publish mytrips + user
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, glob
          expected = "56f280a2e3de0c16a72d7215b2aceac08e561402ad427ed23505f0f4dfe643b1"
          part_paths = sorted(
              [p for p in glob.glob('scripts/public-profile-stats.patch.gz.b64.part*')],
              key=lambda p: int(''.join(c for c in p.rsplit('part',1)[-1] if c.isdigit()) or 0)
          )
          blob = None
          if part_paths:
            blob = ''.join(pathlib.Path(p).read_text().strip() for p in part_paths)
            print('assembled parts', len(part_paths), 'len', len(blob), hashlib.sha256(blob.encode()).hexdigest()[:16])
          single = pathlib.Path('scripts/public-profile-stats.patch.gz.b64')
          if blob is None and single.exists():
            blob = single.read_text().strip()
            print('using single b64', len(blob))
          if not blob:
            raise SystemExit('no patch b64 found')
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
            raise SystemExit(f'full hash mismatch: {h}')
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path('/tmp/public-profile-stats.patch').write_bytes(raw)
          print('patch bytes', len(raw), 'hash ok')
          PY
          git apply /tmp/public-profile-stats.patch
          mkdir -p mytrips user
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert '/* Public profile + stats correctness */' in t
          assert 'ensureTripLogStats' in t
          assert 'rebuildTripLogStatsFromTrips' in t
          assert 'trip-log-public-profile' in t
          assert 'trip-public-make-toggle' in t
          assert 'bindTripPublicProfileUi' in t
          assert "doc(currentUser.uid).collection('trips')" not in t
          assert "db.collection('tripLogs').doc(id).update({ hiddenPublic" in t
          assert 'function rrAuthUser' in t
          assert 'rrStartMyTripsNearbyPrompt' in t
          assert 'tripLogEditingId' in t
          assert 'Trip live progress cards + post-trip enrich' in t
          assert 'northeastamtrakrailfanalt/ckyq285h5219a14mpql9jt2r7' in t
          u = Path('user/index.html')
          if u.exists():
            ut = u.read_text(errors='replace')
            assert 'hiddenPublic' in ut
          mt = Path('mytrips/index.html').read_text(errors='replace')
          assert 'ensureTripLogStats' in mt
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if [ -f user/index.html ]; then git add user/index.html || true; fi
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "MyTrips: public profile button + correct tripLogStats (rebuild on delete)"
            git pull --rebase origin main
            git push
          fi
