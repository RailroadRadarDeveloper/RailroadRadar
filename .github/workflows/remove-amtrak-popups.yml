name: Remove Amtrak popups
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/remove-amtrak-popups.py
      - .github/workflows/remove-amtrak-popups.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/remove-amtrak-popups.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Disable Amtrak popups; keep MBTA popups only" && git push; fi
