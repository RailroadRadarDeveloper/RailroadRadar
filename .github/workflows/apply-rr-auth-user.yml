name: Apply rrAuthUser helper
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/rr-auth-user.patch.gz.b64'
      - 'scripts/rr-auth-user.patch.gz.b64.part*'
      - '.github/workflows/apply-rr-auth-user.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode patch, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, glob
          expected = "aced723b17bb639719bc32ee8542064fd47823b62d15affcb9d1ab937945688d"
          part_paths = sorted(
              [p for p in glob.glob('scripts/rr-auth-user.patch.gz.b64.part*')],
              key=lambda p: int(''.join(c for c in p.rsplit('part',1)[-1] if c.isdigit()) or 0)
          )
          blob = None
          if part_paths:
            blob = ''.join(pathlib.Path(p).read_text().strip() for p in part_paths)
            print('assembled parts', len(part_paths), 'len', len(blob), hashlib.sha256(blob.encode()).hexdigest()[:16])
          single = pathlib.Path('scripts/rr-auth-user.patch.gz.b64')
          if blob is None and single.exists():
            blob = single.read_text().strip()
            print('using single b64', len(blob))
          if not blob:
            raise SystemExit('no patch b64 found')
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
            raise SystemExit(f'full hash mismatch: {h}')
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path('/tmp/rr-auth-user.patch').write_bytes(raw)
          print('patch bytes', len(raw), 'hash ok')
          PY
          git apply /tmp/rr-auth-user.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert 'function rrAuthUser' in t
          assert t.count('function rrAuthUser') == 1
          assert "(typeof rrAuthUser === 'function') ? rrAuthUser() : currentUser" in t
          assert t.count("(typeof rrAuthUser === 'function') ? rrAuthUser() : currentUser") >= 2
          assert 'loadTripLogStatsFromServer' in t
          assert 'loadTripLogList' in t
          assert 'if (!rrAuthUser())' in t
          mt = Path('mytrips/index.html').read_text(errors='replace')
          assert 'function rrAuthUser' in mt
          assert mt.count('function rrAuthUser') == 1
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "Fix: define rrAuthUser so MyTrips stats/list load after login"
            git pull --rebase origin main
            git push
          fi
