name: Apply proxy latency / startup fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/proxy-latency-startup.patch.gz.b64'
      - 'scripts/proxy-latency-startup.patch.gz.b64.part*'
      - '.github/workflows/apply-proxy-latency-startup.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode patch, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, glob
          expected = "1bb60e61a4f003c9080e60e88cb42cc3200318bee02a19bcf2f94cb9ddaf4015"
          part_paths = sorted(
              [p for p in glob.glob('scripts/proxy-latency-startup.patch.gz.b64.part*')],
              key=lambda p: int(''.join(c for c in p.rsplit('part',1)[-1] if c.isdigit()) or 0)
          )
          blob = None
          if part_paths:
            blob = ''.join(pathlib.Path(p).read_text().strip() for p in part_paths)
            print('assembled parts', len(part_paths), 'len', len(blob), hashlib.sha256(blob.encode()).hexdigest()[:16])
          single = pathlib.Path('scripts/proxy-latency-startup.patch.gz.b64')
          if blob is None and single.exists():
            blob = single.read_text().strip()
            print('using single b64', len(blob))
          if not blob:
            raise SystemExit('no patch b64 found')
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
            raise SystemExit(f'full hash mismatch: {h}')
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path('/tmp/proxy-latency-startup.patch').write_bytes(raw)
          print('patch bytes', len(raw), 'hash ok')
          PY
          git apply /tmp/proxy-latency-startup.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert 'SHAPE_CONCURRENCY' in t
          assert 'firstPaint' in t
          assert 'Loading live trains...' in t
          assert 'loadMbtaRouteShapes' in t
          assert 'if (!showMbta) return;' in t
          assert 'fetchRouteShapes(), 60000' in t
          assert 'filter(function(ag)' in t
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "Fix: faster load — parallel live trains, defer shapes, gate MBTA"
            git push
          fi
