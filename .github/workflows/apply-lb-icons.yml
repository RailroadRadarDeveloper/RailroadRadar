name: apply leaderboard icons
on:
  push:
    paths:
      - patches/apply_lb_icons.py
      - .github/workflows/apply-lb-icons.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply icon patch
        run: python3 patches/apply_lb_icons.py
      - name: Commit if changed
        run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "no index.html change"
          else
            git commit -m "Use attached bar-chart and trophy icons on Weekly Leaderboard"
            git push
          fi
          rm -f patches/apply_lb_icons.py
          git rm -f .github/workflows/apply-lb-icons.yml || rm -f .github/workflows/apply-lb-icons.yml
          git add -A patches .github/workflows || true
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-shot leaderboard icon workflow"
            git push
          fi
