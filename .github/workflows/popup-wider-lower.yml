name: Popup wider lower

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/popup-wider-lower.py
      - .github/workflows/popup-wider-lower.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/popup-wider-lower.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Widen popups and anchor them closer to the marker" && git push; fi
