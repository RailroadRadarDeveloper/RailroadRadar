name: Default Light tiles to official Mapbox Light
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix-mobile-mapbox-light.py'
      - '.github/workflows/fix-mobile-mapbox-light.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python3 scripts/fix-mobile-mapbox-light.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          rm -f scripts/fix-mobile-mapbox-light.py .github/workflows/fix-mobile-mapbox-light.yml
          git add -A scripts/fix-mobile-mapbox-light.py .github/workflows/fix-mobile-mapbox-light.yml || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Default Light map to official Mapbox Light, keep alt as optional"
          git push
