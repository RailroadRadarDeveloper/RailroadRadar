name: Apply popup stops compact
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/popup-stops-compact.patch.gz.b64'
      - 'scripts/popup-stops-compact.patch.gz.b64.part*'
      - '.github/workflows/apply-popup-stops-compact.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode patch, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, glob
          expected = "47358be035c3dfbd9ea1c36f5012549b039dfc3078451963aa51cdd3b4ec8e08"
          part_paths = sorted(
              [p for p in glob.glob('scripts/popup-stops-compact.patch.gz.b64.part*')],
              key=lambda p: int(''.join(c for c in p.rsplit('part',1)[-1] if c.isdigit()) or 0)
          )
          blob = None
          if part_paths:
            blob = ''.join(pathlib.Path(p).read_text().strip() for p in part_paths)
            print('assembled parts', len(part_paths), 'len', len(blob), hashlib.sha256(blob.encode()).hexdigest()[:16])
          single = pathlib.Path('scripts/popup-stops-compact.patch.gz.b64')
          if blob is None and single.exists():
            blob = single.read_text().strip()
            print('using single b64', len(blob))
          if not blob:
            raise SystemExit('no patch b64 found')
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
            raise SystemExit(f'full hash mismatch: {h}')
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path('/tmp/popup-stops-compact.patch').write_bytes(raw)
          print('patch bytes', len(raw), 'hash ok')
          PY
          git apply /tmp/popup-stops-compact.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert 'rr-ui-fix-2026-09-28f' in t
          assert 'overflow-y: auto !important; /* 28e' in t
          assert 'min-height: 150px !important' in t
          assert 'min-height: 130px !important' in t
          assert 'font-size: 11px !important;' in t
          assert 'rr-ui-fix-2026-09-28e: train-popup-body' not in t
          assert 'm._rrStops' in t
          assert Path('mytrips/index.html').read_text(errors='replace').count('rr-ui-fix-2026-09-28f') >= 1
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "UI: compact train popup stop rows (smaller type/padding) (28f)"
            git pull --rebase origin main
            git push
          fi
