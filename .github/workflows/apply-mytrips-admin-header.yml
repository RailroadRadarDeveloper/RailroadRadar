name: Apply mytrips admin header icon
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode patch, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib
          expected = "983637a5ea9656244664c8d4cacb3a9c2439a504a2ebc80d9a64d63996d5b589"
          blob = ""
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
            raise SystemExit(f'full hash mismatch: {h}')
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path('/tmp/mytrips-admin-header.patch').write_bytes(raw)
          pathlib.Path('scripts').mkdir(exist_ok=True)
          pathlib.Path('scripts/mytrips-admin-header.patch.gz.b64').write_text(blob)
          print('patch bytes', len(raw), 'hash ok')
          PY
          git apply /tmp/mytrips-admin-header.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert 'html.rr-mytrips-page #btn-admin-header.is-visible' in t
          block_start = t.find('html.rr-mytrips-page #btn-report-train-header')
          block = t[block_start:block_start + 350]
          assert 'html.rr-mytrips-page #btn-admin-header,' not in block
          assert 'id="btn-admin-header"' in t
          assert 'isAdminUser' in t
          assert 'BOOTSTRAP_ADMIN_EMAILS' in t
          assert 'function rrAuthUser' in t
          assert 'rrStartMyTripsNearbyPrompt' in t
          assert 'tripLogEditingId' in t
          assert 'tripMbtaCanonicalStationId' in t
          assert 'Looking for your train' in t
          assert 'rrTripMapTileUrl' in t
          assert 'rrAuthSafariItp' in t
          assert 'rrWireEarlyAuth' in t
          mt = Path('mytrips/index.html').read_text(errors='replace')
          assert 'html.rr-mytrips-page #btn-admin-header.is-visible' in mt
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html scripts/mytrips-admin-header.patch.gz.b64
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "Fix: show admin icon on My Trips header for admins"
            git pull --rebase origin main || true
            git push
          fi
