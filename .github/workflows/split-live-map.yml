name: Split live map
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/split-live-map.py
      - .github/workflows/split-live-map.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/split-live-map.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html assets/js/live-share-bar.js
          if git diff --cached --quiet; then echo nothing; else git commit -m "Keep live user tracking off the main map" && git push; fi
