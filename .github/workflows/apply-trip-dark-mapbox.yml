name: Apply trip dark Mapbox
on:
  workflow_dispatch:
    push:
        paths:
              - 'scripts/trip-dark-mapbox.patch.gz.b64'      - '.github/workflows/apply-trip-dark-mapbox.yml'
              permissions:
                contents: write
                jobs:
                  apply:
                      runs-on: ubuntu-latest
                          steps:
                                - uses: actions/checkout@v4
                                      - name: Decode patch, apply, publish mytrips
                                              run: |
                                                        set -euo pipefail
                                                                  python3 <<'PY'
                                                                            import hashlib, pathlib, sys
                                                                                      expected = "847a1c3ea69a8be8ad52798b4d5ffb77eabdc7b1a65915f654603f61f117f2fa"
                                                                                                single = pathlib.Path('scripts/trip-dark-mapbox.patch.gz.b64')
                                                                                                          if not single.exists():
                                                                                                                      raise SystemExit('missing scripts/trip-dark-mapbox.patch.gz.b64')
                                                                                                                                blob = single.read_text().strip()
                                                                                                                                          print('using single b64', len(blob))
                                                                                                                                                    h=hashlib.sha256(blob.encode()).hexdigest()
                                                                                                                                                              if h!=expected:
                                                                                                                                                                          raise SystemExit(f'full hash mismatch: {h}')
                                                                                                                                                                                    pathlib.Path('/tmp/all.b64').write_text(blob)
                                                                                                                                                                                              print('hash ok')
                                                                                                                                                                                                        PY
                                                                                                                                                                                                                  base64 -d /tmp/all.b64 | gunzip > /tmp/trip-dark-mapbox.patch
                                                                                                                                                                                                                            git apply /tmp/trip-dark-mapbox.patch
                                                                                                                                                                                                                                      mkdir -p mytrips
                                                                                                                                                                                                                                                cp index.html mytrips/index.html
                                                                                                                                                                                                                                                          python3 - <<'PY'
                                                                                                                                                                                                                                                                    from pathlib import Path
                                                                                                                                                                                                                                                                              t = Path('index.html').read_text(errors='replace')
                                                                                                                                                                                                                                                                                        assert 'rrTripMapTileUrl' in t
                                                                                                                                                                                                                                                                                                  assert 'rrTripMapTileLayer' in t
                                                                                                                                                                                                                                                                                                            assert '/api/mapbox/styles/v1/mapbox/dark-v11/tiles/256/{z}/{x}/{y}' in t
                                                                                                                                                                                                                                                                                                                      assert 'TRIP_MINI_MAP_TILE' not in t
                                                                                                                                                                                                                                                                                                                                assert 'background: #07093e !important;' in t
                                                                                                                                                                                                                                                                                                                                          assert '/mytrips dark inverted chrome' in t
                                                                                                                                                                                                                                                                                                                                                    assert Path('mytrips/index.html').read_text(errors='replace').count('rrTripMapTileLayer') >= 1
                                                                                                                                                                                                                                                                                                                                                      print('ok', len(t))
                                                                                                                                                                                                                                                                                                                                                                PY
                                                                                                                                                                                                                                                                                                                                                                          git config user.name "RailroadRadar"
                                                                                                                                                                                                                                                                                                                                                                                    git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
                                                                                                                                                                                                                                                                                                                                                                                              git add index.html mytrips/index.html
                                                                                                                                                                                                                                                                                                                                                                                                        if git diff --cached --quiet; then echo nothing to commit
                                                                                                                                                                                                                                                                                                                                                                                                                  else
                                                                                                                                                                                                                                                                                                                                                                                                                              git commit -m "My trips: Mapbox dark tiles + dark navy inverted UI"
                                                                                                                                                                                                                                                                                                                                                                                                                                          git push
                                                                                                                                                                                                                                                                                                                                                                                                                                                    fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                    
