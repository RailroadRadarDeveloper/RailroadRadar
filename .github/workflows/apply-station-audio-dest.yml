name: Apply station audio destinations
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish stationaudio/index.html from gzip+base64 parts
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, hashlib, pathlib, re
          expected = "6bf5af9f3a7d6b2215b5c107fa181adf35020dc918dc3d8168de3b2e1f63882e"
          expected_raw = "5af480379f23d9da61d0eda1d289e30f1cca45a117ab4fc63f9239fe5b0b1e6b"
          paths = sorted(pathlib.Path('scripts').glob('station-audio-dest.b64.part*'), key=lambda p: int(re.search(r'part(\d+)$', p.name).group(1)))
          if len(paths) != 159:
              raise SystemExit('expected 159 parts, got %d' % len(paths))
          blob = ''.join(p.read_text().strip() for p in paths)
          if any(len(p.read_text().strip()) > 400 for p in paths):
              raise SystemExit('a part is longer than 400 bytes')
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
              raise SystemExit('b64 hash mismatch ' + h)
          raw = gzip.decompress(base64.b64decode(blob))
          rh = hashlib.sha256(raw).hexdigest()
          if rh != expected_raw:
              raise SystemExit('raw hash mismatch ' + rh)
          text = raw.decode('utf-8')
          for banned in ('minutes late', 'minute late', 'back on time', 'is canceled', 'Service alert cleared', 'Up next', 'up next', 'The next train is'):
              if banned in text:
                  raise SystemExit('invented or up-next text still present: ' + banned)
          for need in ('upcomingByDestination', 'alertMatchesAnnouncedLine', 'Train approaching, please stand back.', 'function peekDest', '>= 15000', 'dFix <= 0.1', 'gaining', 'function estimatePos', 'function segmentHit'):
              if need not in text:
                  raise SystemExit('missing ' + need)
          pathlib.Path('stationaudio').mkdir(exist_ok=True)
          pathlib.Path('stationaudio/index.html').write_bytes(raw)
          print('hash ok', rh, 'bytes', len(raw))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add -- stationaudio/index.html
          names=$(git diff --cached --name-only)
          printf '%s\n' "$names"
          test "$names" = "stationaudio/index.html" || test -z "$names"
          if git diff --cached --quiet; then
            echo nothing to commit
          else
            git commit -m "Station audio: cycle each destination and speak only published line alerts"
            git push
          fi
