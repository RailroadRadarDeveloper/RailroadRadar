name: Live map stop share
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/live-map-stop.py
      - .github/workflows/live-map-stop.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/live-map-stop.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Put live trips on the main map and add Stop sharing" && git push; fi
