name: Revert popup styles

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/revert-popup-styles.py
      - .github/workflows/revert-popup-styles.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/revert-popup-styles.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Revert train and station popups to earlier size and layout" && git push; fi
