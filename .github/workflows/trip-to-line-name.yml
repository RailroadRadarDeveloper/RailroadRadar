name: Trip field to line name
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/trip-to-line-name.py
      - .github/workflows/trip-to-line-name.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/trip-to-line-name.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Replace Trip id with line name" && git push; fi
