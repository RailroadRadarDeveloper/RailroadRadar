name: Popup smaller real

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/popup-smaller-real.py
      - .github/workflows/popup-smaller-real.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/popup-smaller-real.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Make popups smaller with real width, no scale clip" && git push; fi
