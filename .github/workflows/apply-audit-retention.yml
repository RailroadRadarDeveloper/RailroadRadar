name: apply-audit-retention
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-audit-retention.yml'
      - 'patches/audit-retention.patch'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          set -euo pipefail
          if grep -q "AUDIT_LOG_RETENTION_MS" index.html; then
            echo already applied
            exit 0
          fi
          patch -p1 < patches/audit-retention.patch
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          git commit -m "Keep audit log for 7 days and purge at midnight Eastern"
          git push
