name: Unblock MBTA picker

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/unblock-mbta-picker.py
      - .github/workflows/unblock-mbta-picker.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/unblock-mbta-picker.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Load MBTA immediately instead of waiting on the railroad picker" && git push; fi
