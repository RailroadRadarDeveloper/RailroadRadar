name: Station heading Upcoming Departures
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/station-heading-upcoming.py
      - .github/workflows/station-heading-upcoming.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/station-heading-upcoming.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Station popup heading: Upcoming Departures" && git push; fi
