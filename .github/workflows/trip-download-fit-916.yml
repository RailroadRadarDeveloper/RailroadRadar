name: Fit trip PNG to 9:16
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/trip-download-fit-916.py
      - .github/workflows/trip-download-fit-916.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/trip-download-fit-916.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Letterbox trip images to 9:16 and always save the file" && git push; fi
