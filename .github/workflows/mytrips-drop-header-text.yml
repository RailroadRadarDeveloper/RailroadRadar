name: Drop MyTrips header text
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/mytrips-drop-header-text.py
      - .github/workflows/mytrips-drop-header-text.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/mytrips-drop-header-text.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Remove MyTrips text from header; logo is enough" && git push; fi
