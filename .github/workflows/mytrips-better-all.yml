name: MyTrips better all

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/mytrips-better-all.py
      - .github/workflows/mytrips-better-all.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/mytrips-better-all.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html user/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "MyTrips: dashboard stats, drafts, Log this ride, hide and copy link" && git push; fi
