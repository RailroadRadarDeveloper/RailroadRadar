name: Special optional route
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/special-optional-route.py
      - .github/workflows/special-optional-route.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/special-optional-route.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Special moves: stations, line, and times are optional" && git push; fi
