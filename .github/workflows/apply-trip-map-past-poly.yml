name: Apply MyTrips map past-live + MBTA poly + MNR stations
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/trip-map-past-poly.patch.gz.b64'
      - 'scripts/trip-map-past-poly.patch.gz.b64.part*'
      - '.github/workflows/apply-trip-map-past-poly.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode patch, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, glob
          expected = "73ea09fb3bb34b43574ef97b7dcb7a47ee48a2e2b8361162fbb471e0ee84ad4e"
          part_paths = sorted(
              [p for p in glob.glob('scripts/trip-map-past-poly.patch.gz.b64.part*')],
              key=lambda p: int(''.join(c for c in p.rsplit('part',1)[-1] if c.isdigit()) or 0)
          )
          blob = None
          if part_paths:
            blob = ''.join(pathlib.Path(p).read_text().strip() for p in part_paths)
            print('assembled parts', len(part_paths), 'len', len(blob), hashlib.sha256(blob.encode()).hexdigest()[:16])
          single = pathlib.Path('scripts/trip-map-past-poly.patch.gz.b64')
          if blob is None and single.exists():
            blob = single.read_text().strip()
            print('using single b64', len(blob))
          if not blob:
            raise SystemExit('no patch b64 found')
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
            raise SystemExit(f'full hash mismatch: {h}')
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path('/tmp/trip-map-past-poly.patch').write_bytes(raw)
          print('patch bytes', len(raw), 'hash ok')
          PY
          git apply /tmp/trip-map-past-poly.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert '/* Trip map past-live + MBTA poly + MNR stations 2026-09-29 */' in t
          assert 'MNR_TRIP_STATIONS' in t
          assert 'rrDecodeGooglePolyline' in t
          assert 'pathHasJump' in t
          assert 'Finished past trips' in t
          assert '/* Trip live progress cards + post-trip enrich */' in t
          assert 'tripTryEnrichActualTimes' in t
          assert 'tripLiveWarmCopy' in t
          assert 'TRIP_LIVE_LIST_POLL_MS' in t
          assert 'tripLogEditingId' in t
          assert 'editTripLog' in t
          assert 'tripMbtaCanonicalStationId' in t
          assert 'function rrAuthUser' in t
          assert 'rrStartMyTripsNearbyPrompt' in t
          assert 'rrTripMapTileUrl' in t
          assert 'northeastamtrakrailfanalt/ckyq285h5219a14mpql9jt2r7' in t
          assert 'background: var(--rr-trip-rail, #07093e)' in t
          assert 'startTripLiveTracking' in t
          assert 'Looking for your train' in t
          mt = Path('mytrips/index.html').read_text(errors='replace')
          assert 'Trip map past-live' in mt
          assert 'MNR_TRIP_STATIONS' in mt
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "MyTrips: hide live chip on finished past trips; fix MBTA poly zigzags; embed MNR stations for maps"
            git push
          fi
