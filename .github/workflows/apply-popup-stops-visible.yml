name: Apply popup stops visible
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/popup-stops-visible.patch.gz.b64'
      - 'scripts/popup-stops-visible.patch.gz.b64.part*'
      - '.github/workflows/apply-popup-stops-visible.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode patch, apply, publish mytrips
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, glob
          expected = "2082621db7bc90c172f204bd0724094169beb81068666eb47c441ceccce7b3bc"
          part_paths = sorted(
              [p for p in glob.glob('scripts/popup-stops-visible.patch.gz.b64.part*')],
              key=lambda p: int(''.join(c for c in p.rsplit('part',1)[-1] if c.isdigit()) or 0)
          )
          blob = None
          if part_paths:
            blob = ''.join(pathlib.Path(p).read_text().strip() for p in part_paths)
            print('assembled parts', len(part_paths), 'len', len(blob), hashlib.sha256(blob.encode()).hexdigest()[:16])
          single = pathlib.Path('scripts/popup-stops-visible.patch.gz.b64')
          if blob is None and single.exists():
            blob = single.read_text().strip()
            print('using single b64', len(blob))
          if not blob:
            raise SystemExit('no patch b64 found')
          h = hashlib.sha256(blob.encode()).hexdigest()
          if h != expected:
            raise SystemExit(f'full hash mismatch: {h}')
          raw = gzip.decompress(base64.b64decode(blob))
          pathlib.Path('/tmp/popup-stops-visible.patch').write_bytes(raw)
          print('patch bytes', len(raw), 'hash ok')
          PY
          git apply /tmp/popup-stops-visible.patch
          mkdir -p mytrips
          cp index.html mytrips/index.html
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(errors='replace')
          assert 'rr-ui-fix-2026-09-28d' in t
          assert 'min-height: min(180px, 30vh)' in t
          assert 'max-height: min(200px, 36vh)' in t
          assert 'max-height: none !important; /* flex fills remaining height */' not in t
          assert 'm._rrStops' in t
          assert 'rrHydrateAmtrakStopActuals' in t
          assert 'rr-ui-fix-2026-09-28c: mobile popup shrink' not in t
          assert Path('mytrips/index.html').read_text(errors='replace').count('rr-ui-fix-2026-09-28d') >= 1
          print('ok', len(t))
          PY
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing to commit
          else
            git commit -m "UI: restore train popup stops list min-height (mobile flex collapse)"
            git push
          fi
