name: Add MBTA heading icon
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/add-mbta-heading-icon.py
      - .github/workflows/add-mbta-heading-icon.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p assets/icons
          curl -fsSL "https://i.postimg.cc/qR9qn1bC/Untitled-design-(12).png" -o assets/icons/mbta.png
          python3 scripts/add-mbta-heading-icon.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add assets/icons/mbta.png index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Add MBTA icon before train headings" && git push; fi
