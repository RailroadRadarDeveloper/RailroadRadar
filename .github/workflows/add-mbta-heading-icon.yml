name: Add MBTA heading icon
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/add-mbta-heading-icon.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download icon and patch popups
        run: |
          mkdir -p assets/icons
          curl -fsSL "https://i.postimg.cc/qR9qn1bC/Untitled-design-(12).png" -o assets/icons/mbta.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          icon='https://railroadradar.com/assets/icons/mbta.png'
          img='<img class="mbta-heading-icon" src="'+icon+'" alt="MBTA">'
          if '.mbta-heading-icon' not in t:
              css='''    .mbta-heading-icon {
      height: 22px;
      width: auto;
      display: block;
      flex: none;
    }
'''
              needle='    .rr-dev-banner a {
      color: #fff;
      text-decoration: none;
    }'
              if needle in t:
                  t=t.replace(needle, needle+'\n'+css, 1)
              else:
                  t=t.replace('    .train-popup-header {', css+'    .train-popup-header {', 1)
          live='''                ${mbtaSpecialBadge}
                ${capeBadge}
                <span style="font-size:14.5px; font-weight:700; color:#ffffff; font-style:italic;">${rname}</span>'''
          live2='''                ${mbtaSpecialBadge}
                ${capeBadge}
                '''+img+'''
                <span style="font-size:14.5px; font-weight:700; color:#ffffff; font-style:italic;">${rname}</span>'''
          if live in t and img not in live:
              t=t.replace(live, live2, 1)
          fut='''                <span style="font-weight:700; color:#ffffff; font-style:italic;">${rname || \'Trip\'}</span>'''
          fut2='''                '''+img+'''
                <span style="font-weight:700; color:#ffffff; font-style:italic;">${rname || \'Trip\'}</span>'''
          if fut in t:
              t=t.replace(fut, fut2, 1)
          share="String(page.rname || 'Trip') + '</span><span style=\"font-weight:700;color:#ffffff;font-style:italic;\">'"
          # scheduled share html starts with rname span
          old_share='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px;line-height:1.3;color:#ffffff;font-style:italic;"><span style="font-weight:700;color:#ffffff;font-style:italic;">' +
          new_share='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px;line-height:1.3;color:#ffffff;font-style:italic;">'+img+'<span style="font-weight:700;color:#ffffff;font-style:italic;">' +
          if old_share in t:
              t=t.replace(old_share, new_share, 1)
          p.write_text(t, encoding='utf-8')
          print('icon bytes', Path('assets/icons/mbta.png').stat().st_size)
          PY
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add assets/icons/mbta.png index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Add MBTA icon before train headings" && git push; fi
