name: Fix admin interest helpers
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-admin-interest-helpers.yml'
      - 'scripts/fix-admin-interest-helpers.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Restore builder and inject helpers
        run: |
          set -euo pipefail
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          if ! grep -q 'const BOOTSTRAP_ADMIN_EMAILS' scripts/build-admin-page.py; then
            git show 4051ab521326d7074c314bc21118875bdf1de704:scripts/build-admin-page.py > scripts/build-admin-page.py
          fi
          python3 scripts/fix-admin-interest-helpers.py
          git add scripts/build-admin-page.py admin.html
          if git diff --cached --quiet; then
            echo nothing to commit
          else
            git commit -m "Fix admin dashboard formatInterestRailroads is not defined"
            git push
          fi
