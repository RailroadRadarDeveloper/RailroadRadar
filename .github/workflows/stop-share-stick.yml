name: Stop share stick
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/stop-share-stick.py
      - .github/workflows/stop-share-stick.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/stop-share-stick.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Stop sharing stays stopped" && git push; fi
