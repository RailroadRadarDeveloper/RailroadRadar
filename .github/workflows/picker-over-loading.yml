name: Picker over loading

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/picker-over-loading.py
      - .github/workflows/picker-over-loading.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/picker-over-loading.py
      - run: |
          git config user.name "RailroadRadar"
          git config user.email "67028963+RailroadRadarDeveloper@users.noreply.github.com"
          git add index.html mytrips/index.html
          if git diff --cached --quiet; then echo nothing; else git commit -m "Hide loading screen so the railroad picker can be used" && git push; fi
