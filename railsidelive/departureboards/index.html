<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departure Board | RailroadRadar</title>
  <meta name="description" content="Full-screen live departure board for any station on RailroadRadar.">
  <meta name="theme-color" content="#07093e">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/css/departure-board.css?v=f72e3f9c0f">
</head>
<body>
  <div class="pick" id="pick" hidden>
    <label class="pick-label" for="station-q">Station</label>
    <input id="station-q" class="pick-input" type="search" autocomplete="off" placeholder="Search any station" aria-label="Search any station">
    <ul class="pick-list" id="station-results"></ul>
  </div>
  <main class="board" id="board" hidden>
    <header class="board-head">
      <button type="button" class="board-name" id="station-name"></button>
      <div class="board-sub">Departures</div>
    </header>
    <ul class="rows" id="rows"></ul>
    <div class="foot" id="updated"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.4.0/dist/light/protobuf.min.js"></script>
  <script src="/assets/js/rr-fs-cache.js?v=422375c9cd"></script>
  <script src="/assets/js/trip-stations.js"></script>
  <script src="/assets/js/board-stations.js?v=9fb4856a53"></script>
  <script src="/assets/js/departure-board.js?v=e355e888f6"></script>
</body>
</html>
