<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Railside Live | RailroadRadar</title>
  <meta name="description" content="Railside Live on RailroadRadar, including live departure boards.">
  <meta name="theme-color" content="#07093e">
  <link rel="icon" href="/favicon.ico">
  <style>
    html, body { margin: 0; background: #07093e; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; }
    a { color: #fff; }
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: #07093e;
      z-index: 2;
    }
    .collab { display: flex; align-items: center; gap: 12px; min-width: 0; height: 100%; }
    .wordmark { height: 40px; width: auto; display: block; }
    .rule { width: 1px; align-self: stretch; margin: 8px 0; background: rgba(255, 255, 255, 0.35); }
    .mark { height: 46px; width: auto; display: block; background: none; border: 0; box-shadow: none; }
    main { padding: 92px 20px 32px; max-width: 720px; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0; font-size: 18px; line-height: 1.4; }
    .page-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .page-action { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; box-sizing: border-box; padding: 0 20px; border: 1px solid rgba(255,255,255,.72); border-radius: 6px; font-size: 16px; font-weight: 700; text-decoration: none; }
    .page-action-primary { background: #fff; color: #07093e; }
    .page-action-secondary { background: transparent; color: #fff; }
    .page-action:focus-visible { outline: 3px solid #8bdcff; outline-offset: 3px; }
    @media (max-width: 480px) { .page-actions { flex-direction: column; align-items: stretch; } }
    @media (max-width: 700px) {
      .wordmark { height: 32px; }
      .mark { height: 40px; }
      .collab { gap: 8px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="collab">
      <a href="/" aria-label="RailroadRadar home"><img class="wordmark" src="/assets/brand/railroadradar-wordmark.png" alt="RailroadRadar"></a>
      <span class="rule" aria-hidden="true"></span>
      <img class="mark" src="/assets/railsidelive-logo.png" alt="Railside Live">
    </div>
  </header>
  <main>
    <h1>Railside Live</h1>
    <p><a href="/railsidelive/departureboards/">Open the departure boards</a></p>
    <div class="page-actions" aria-label="Railside Live actions">
      <a class="page-action page-action-primary" href="/map/">View Live Map</a>
      <a class="page-action page-action-secondary" href="/map/?report=equipment">Report Equipment</a>
    </div>
  </main>
</body>
</html>
