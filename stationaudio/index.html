<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07093e">
  <title>Station audio — RailroadRadar</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    html, body { margin: 0; background: #07093e; color: #fff; }
    body { font: 16px/1.45 system-ui, Segoe UI, sans-serif; }
    a { color: #fff; }
    header, main { padding: 16px; max-width: 40rem; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid #fff; }
    h1 { font-size: 1.25rem; margin: 0; font-weight: 700; }
    h2 { font-size: 1rem; margin: 20px 0 8px; }
    p { margin: 10px 0; }
    label { display: block; font-weight: 700; margin: 14px 0 6px; }
    input, select, button { border-radius: 0; font: inherit; }
    input, select { width: 100%; box-sizing: border-box; background: #fff; color: #07093e; border: 0; padding: 12px; }
    .row { display: flex; gap: 8px; margin-top: 14px; }
    button { flex: 1; padding: 12px; font-weight: 700; border: 2px solid #fff; cursor: pointer; }
    #start { background: #fff; color: #07093e; }
    #stop { background: transparent; color: #fff; }
    button:disabled { opacity: 0.45; cursor: default; }
    .voice-row { margin-top: 0; }
    .voice-row select { flex: 1; width: auto; min-width: 0; }
    #voice-preview, #test-sound { flex: 0 0 auto; background: transparent; color: #fff; }
    #preview, #feeds, #selected { overflow-wrap: anywhere; }
    #feeds, #station-count { color: #d9dcf5; font-size: 0.9rem; }
    ol { margin: 0; padding-left: 1.2rem; }
    li { margin: 0 0 8px; }
  </style>
</head>
<body>
  <header>
    <h1>RailroadRadar</h1>
    <a href="/">Map</a>
  </header>
  <main>
    <p>Station audio announcements. Nothing is spoken until you press Start.</p>
    <label for="filter">Find a station</label>
    <input id="filter" type="search" placeholder="Search by name" autocomplete="off">
    <label for="station">Station</label>
    <select id="station" aria-label="Station picker"></select>
    <p id="station-count"></p>
    <p id="selected">No station selected</p>
    <label for="voice">Voice</label>
    <div class="row voice-row">
      <select id="voice" aria-label="Announcement voice"></select>
      <button type="button" id="voice-preview">Preview</button>
      <button type="button" id="test-sound">Test sound</button>
    </div>
    <p id="tts-hint" style="color:#d9dcf5;font-size:0.9rem;margin:8px 0 0;">On iPhone, turn the Ring/Silent switch off (not silent) — Safari speech follows that switch. Press Start or Test sound once to unlock audio.</p>
    <div class="row">
      <button type="button" id="start">Start</button>
      <button type="button" id="stop" disabled>Stop</button>
    </div>
    <p id="preview"></p>
    <p id="feeds"></p>
    <h2>Spoken log</h2>
    <ol id="log"></ol>
  </main>

    jobs.push((async function () {
      try {
        var buf = await getBuf(A.API + '/api/mta/lirr');
        var pack = A.gtfsTrains(A.decodeFeed(buf), 'lirr', 'LIRR', TABLES.lirr.routes, TABLES.lirr.stops);
        pack.trains.forEach(function (t) { trains.push(t); });
        notes.push(pack.hadCoords ? 'LIRR' : 'LIRR (no coordinates, approaching skipped)');
      } catch (e) { notes.push('LIRR failed'); }
    })());

    jobs.push((async function () {
      try {
        var buf = await getBuf(A.API + '/api/mta/alerts');
        var pack = A.gtfsTrains(A.decodeFeed(buf), 'mta', 'MTA', {}, {});
        alertsFromFeed(pack, null).forEach(function (a) { alerts.push(a); });
      } catch (e) { notes.push('MTA alerts unavailable'); }
    })());

    jobs.push((async function () {
      try {
        var pos = await getBuf(A.API + '/api/metra/positions');
        var tu = await getBuf(A.API + '/api/metra/tripupdates');
        var ents = A.decodeFeed(pos).concat(A.decodeFeed(tu));
        var pack = A.gtfsTrains(ents, 'metra', 'Metra', TABLES.metra.routes, TABLES.metra.stops);
        pack.trains.forEach(function (t) { trains.push(t); });
        notes.push(pack.hadCoords ? 'Metra' : 'Metra (no coordinates, approaching skipped)');
        try {
          var al = await getBuf(A.API + '/api/metra/alerts');
          var ap = A.gtfsTrains(A.decodeFeed(al), 'metra', 'Metra', TABLES.metra.routes, TABLES.metra.stops);
          alertsFromFeed(ap, ['metra']).forEach(function (a) { alerts.push(a); });
        } catch (e2) { notes.push('Metra alerts unavailable'); }
      } catch (e) { notes.push('Metra failed'); }
    })());

    jobs.push((async function () {
      try {
        var rows = await getJson(A.API + '/api/njt/vehicles');
        var list = njtTrains(Array.isArray(rows) ? rows : (rows.trains || rows.data || []));
        await enrichNjt(list, station);
        list.forEach(function (t) { trains.push(t); });
        notes.push('NJ Transit trains');
      } catch (e) { notes.push('NJ Transit vehicles failed'); }
    })());

    jobs.push((async function () {
      try {
        var rows = await getJson(A.API + '/api/njt/alerts');
        njtAlerts(Array.isArray(rows) ? rows : []).forEach(function (a) { alerts.push(a); });
      } catch (e) { notes.push('NJ Transit alerts unavailable'); }
    })());

    jobs.push((async function () {
      try {
        var pos = await getBufFirst(['https://railroadradar.com/feeds/marc-vp.pb', 'https://raw.githubusercontent.com/RailroadRadarDeveloper/RailroadRadar/main/feeds/marc-vp.pb']);
        var tu = await getBufFirst(['https://railroadradar.com/feeds/marc-tu.pb', 'https://raw.githubusercontent.com/RailroadRadarDeveloper/RailroadRadar/main/feeds/marc-tu.pb']);
        var ents = A.decodeFeed(pos).concat(A.decodeFeed(tu));
        var pack = A.gtfsTrains(ents, 'marc', 'MARC', TABLES.marc.routes, TABLES.marc.stops);
        pack.trains.forEach(function (t) { trains.push(t); });
        notes.push(pack.hadCoords ? 'MARC' : 'MARC (no coordinates, approaching skipped)');
      } catch (e) { notes.push('MARC failed'); }
    })());

    await Promise.all(jobs);
    if (!state.station || state.station.key !== station.key) return;
    trains = trains.filter(isCommuterRailTrain);
    alerts = alerts.filter(isRailAlert);
    state.trains = trains;
    var serving = trains.filter(function (t) { return trainServes(t, station); });
    /* rr-station-audio-approach-any-2026-10-04
       Approach is geographic: any commuter-rail train within 1.5 miles, including trains
       that do not stop at the selected station (Amtrak passing an MBTA stop on the same line).
       Next train, delays, cancels, and alerts stay on serving only (agency-matched stops).
       Subway and bus stay out via isCommuterRailTrain. */
    var approachTrains = trains.filter(isCommuterRailTrain);
    state.holding = A.updateApproach(state.approachMem, approachTrains, station);
    state.destPicks = upcomingByDestination(serving, station);
    state.alerts = alerts;
    state.nextPick = peekDest(state.destPicks);
    notes.push('CTrail has no vehicle feed (Hartford Line uses Amtrak)');
    notes.push('NJT stations are not listed (no coordinates in the map data)');
    state.feedText = 'Feeds: ' + notes.join(' · ');
    paintFeeds();
    paintPreview();
  }

  function trainVoiceKey(row) {
    if (!row) return '';
    var ag = row.agency || '';
    if (row.tripId) return ag + '|trip|' + row.tripId;
    if (row.trainId) return ag + '|id|' + row.trainId;
    return ag + '|num|' + (row.routeId || '') + '|' + (row.trainNum || '') + '|' + (row.destKey || '');
  }

  function freshMins(row) {
    if (!row) return null;
    if (row.etaMs == null) return row.mins;
    return Math.max(0, Math.round((row.etaMs - Date.now()) / 60000));
  }

  function syncSeenMins() {
    var list = state.destPicks || [];
    var nowKeys = {};
    var drops = [];
    for (var i = 0; i < list.length; i++) {
      var row = list[i];
      var mins = freshMins(row);
      row.mins = mins;
      var key = trainVoiceKey(row);
      if (!key) continue;
      nowKeys[key] = 1;
      var seen = Object.prototype.hasOwnProperty.call(state.seenMin, key) ? state.seenMin[key] : null;
      if (seen != null && mins < seen && state.spokenMin[key] !== mins) drops.push(row);
      else state.seenMin[key] = mins;
    }
    Object.keys(state.seenMin).forEach(function (k) {
      if (!nowKeys[k]) {
        delete state.seenMin[k];
        delete state.spokenMin[k];
      }
    });
    drops.sort(function (a, b) {
      if (a.mins !== b.mins) return a.mins - b.mins;
      return (a.etaMs || 0) - (b.etaMs || 0);
    });
    return drops;
  }

  function markSpokenMin(row) {
    var key = trainVoiceKey(row);
    if (!key) return;
    state.spokenMin[key] = row.mins;
    state.seenMin[key] = row.mins;
  }

  function speakPick(pick, now) {
    var built = announcementText(pick);
    if (pick) {
      state.lastDestKey = pick.destKey;
      markSpokenMin(pick);
    }
    state.lastDestAt = now;
    state.nextPick = pick;
    built.notes.forEach(function (n) { state.spoken[n.key] = n.text; });
    speak(built.text);
  }

  function slotPick() {
    var list = state.destPicks || [];
    if (!list.length) return null;
    var start = 0;
    if (state.lastDestKey) {
      var at = -1;
      for (var i = 0; i < list.length; i++) if (list[i].destKey === state.lastDestKey) { at = i; break; }
      if (at >= 0) start = (at + 1) % list.length;
    }
    for (var n = 0; n < list.length; n++) {
      var row = list[(start + n) % list.length];
      row.mins = freshMins(row);
      if (state.spokenMin[trainVoiceKey(row)] !== row.mins) return row;
    }
    return null;
  }

  function maybeSpeak() {
    if (!state.running || !state.station) return;
    var hold = state.holding && state.holding.length;
    if (hold) {
      state.heldOffDest = true;
      var now = Date.now();
      if (!state.lastApproachAt || now - state.lastApproachAt >= 15000) {
        state.lastApproachAt = now;
        speak(A.approachLine(state.holding), true);
      }
      return;
    }
    if (state.heldOffDest) {
      state.heldOffDest = false;
      state.lastApproachAt = 0;
      state.lastDestAt = Date.now();
      return;
    }
    var now2 = Date.now();
    var drops = syncSeenMins();
    if (drops.length) {
      if (!state.speakLockUntil || now2 >= state.speakLockUntil) speakPick(drops[0], now2);
      return;
    }
    if (state.lastDestAt && now2 - state.lastDestAt < 60000) return;
    var pick = slotPick();
    if (!pick && (state.destPicks || []).length) {
      state.lastDestAt = now2;
      return;
    }
    speakPick(pick, now2);
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function loop(token) {
    while (state.running && state.token === token) {
      if (state.forceRefresh || !state.lastRefresh || (Date.now() - state.lastRefresh) > 10000) {
        state.forceRefresh = false;
        try { await refresh(); } catch (e) {}
      }
      if (!state.running || state.token !== token) return;
      maybeSpeak();
      paintPreview();
      var left = 3000;
      while (left > 0 && state.running && state.token === token) {
        if (state.forceRefresh) break;
        if (state.holding && state.holding.length && (!state.lastApproachAt || Date.now() - state.lastApproachAt >= 15000)) break;
        var step = Math.min(250, left);
        await sleep(step);
        left -= step;
      }
    }
  }

  function resetSpeechState() {
    state.approachMem = {};
    state.updateQueue = [];
    state.spoken = {};
    state.lastNextAt = 0;
    state.lastDestKey = '';
    state.lastDestAt = 0;
    state.lastApproachAt = 0;
    state.heldOffDest = false;
    state.seenMin = {};
    state.spokenMin = {};
    state.speakLockUntil = 0;
    state.destPicks = [];
    state.alerts = [];
    state.holding = [];
    state.nextPick = null;
    state.trains = [];
  }

  async function onPick() {
    state.station = selectedStation();
    paintSelected();
    resetSpeechState();
    state.forceRefresh = true;
    try { localStorage.setItem('rr-station-audio', state.station ? state.station.key : ''); } catch (e) {}
    $('start').disabled = !state.station;
    if (!state.station) { paintPreview(); return; }
    state.feedText = 'Loading live data…';
    paintFeeds();
    if (!state.running) {
      try { await refresh(); } catch (e) {}
      state.forceRefresh = false;
    }
  }

  function start() {
    if (state.running || !state.station) return;
    state.running = true;
    state.token++;
    $('start').disabled = true;
    $('stop').disabled = false;
    state.lastNextAt = 0;
    state.lastDestAt = 0;
    state.lastApproachAt = 0;
    state.heldOffDest = false;
    state.seenMin = {};
    state.spokenMin = {};
    // Unlock Web Speech inside this tap (sync speak). Do not await or setTimeout first.
    try { speakGesture(TTS_UNLOCK_LINE); } catch (e) {}
    loop(state.token);
  }

  function stop() {
    state.running = false;
    state.token++;
    $('start').disabled = !state.station;
    $('stop').disabled = true;
    ttsGen++;
    ttsQueue = [];
    ttsBusy = false;
    clearTtsTimer();
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
    state.feedText = 'Stopped. ' + state.feedText;
    paintFeeds();
  }

  async function boot() {
    try {
      STATIC = window.RR_STATIC || await inflateStatic(window.RR_STATIC_GZ);
      ensureTables();
    } catch (e) {
      var feeds = document.getElementById('feeds');
      if (feeds) feeds.textContent = 'Could not load the station list in this browser.';
      return;
    }
    loadStaticStations();
    renderPicker();
    $('filter').addEventListener('input', renderPicker);
    $('station').addEventListener('change', function () { onPick(); });
    $('start').addEventListener('click', start);
    $('stop').addEventListener('click', stop);
    fillVoicePicker();
    var voiceSel = $('voice');
    if (voiceSel) voiceSel.addEventListener('change', function () {
      forceDefaultVoice = false;
      try {
        if (voiceSel.value) localStorage.setItem(VOICE_KEY, voiceSel.value);
        else localStorage.removeItem(VOICE_KEY);
      } catch (e) {}
    });
    var voicePreview = $('voice-preview');
    if (voicePreview) voicePreview.addEventListener('click', previewVoice);
    var testSoundBtn = $('test-sound');
    if (testSoundBtn) testSoundBtn.addEventListener('click', testSound);
    /* rr-station-audio-tts-unlock-2026-10-05 */
    $('start').disabled = true;
    $('stop').disabled = true;
    paintFeeds();
    loadMbtaStations().then(function () {
      renderPicker();
      var saved = '';
      try { saved = localStorage.getItem('rr-station-audio') || ''; } catch (e) {}
      if (saved && stations.some(function (s) { return s.key === saved; })) {
        $('station').value = saved;
        onPick();
      }
    }).catch(function () {
      state.feedText = 'MBTA station list failed. Other railroads are still in the picker. ' + state.feedText;
      paintFeeds();
    });
    if (window.speechSynthesis) {
      speechSynthesis.onvoiceschanged = function () { fillVoicePicker(); };
      try { speechSynthesis.getVoices(); } catch (e) {}
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

  </script>
</body>
</html>
